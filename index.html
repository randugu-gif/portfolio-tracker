/* ============================================================
   HELPERS
   ============================================================ */
const fmt = (n, dec = 2) => {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('es-CO', { minimumFractionDigits: dec, maximumFractionDigits: dec });
};
const fmtPct = (n) => {
  if (isNaN(n)) return '—';
  if (typeof window !== 'undefined' && window.__privacy_hidden) return '••%';
  return `${n >= 0 ? '+' : ''}${n.toFixed(2)}%`;
};
const fmtMoney = (n, c = 'USD') => {
  const sym = c === 'USD' ? '$' : c === 'EUR' ? '€' : '';
  const suffix = c === 'COP' ? ' COP' : '';
  if (typeof window !== 'undefined' && window.__privacy_hidden) {
    return `${sym}•••${suffix}`;
  }
  return `${sym}${fmt(n)}${suffix}`;
};

const convert = (amount, from, to, trms) => {
  if (from === to) return amount;
  let cop;
  if (from === 'COP') cop = amount;
  else if (from === 'USD') cop = amount * trms.USD;
  else if (from === 'EUR') cop = amount * trms.EUR;
  else cop = amount;
  if (to === 'COP') return cop;
  if (to === 'USD') return cop / trms.USD;
  if (to === 'EUR') return cop / trms.EUR;
  return amount;
};

const snapshotMultiCurrency = (amount, nativeCurrency, trms) => ({
  USD: convert(amount, nativeCurrency, 'USD', trms),
  EUR: convert(amount, nativeCurrency, 'EUR', trms),
  COP: convert(amount, nativeCurrency, 'COP', trms)
});

/* CAGR: (end/start)^(1/años) - 1 */
const calcCAGR = (startValue, endValue, days) => {
  if (!startValue || startValue <= 0 || !endValue || days <= 0) return null;
  const years = days / 365.25;
  if (years < 0.08) return null; /* <30 días no es significativo */
  return (Math.pow(endValue / startValue, 1 / years) - 1) * 100;
};

const daysBetween = (a, b) => {
  const ms = new Date(b).getTime() - new Date(a).getTime();
  return Math.max(0, Math.floor(ms / 86400000));
};

/* XIRR via Newton-Raphson — para MWR */
const xirr = (cashflows /* [{date, amount}] */, guess = 0.1) => {
  if (cashflows.length < 2) return null;
  const t0 = new Date(cashflows[0].date).getTime();
  const years = cashflows.map(cf => (new Date(cf.date).getTime() - t0) / (365.25 * 86400000));
  const npv = (r) => cashflows.reduce((s, cf, i) => s + cf.amount / Math.pow(1 + r, years[i]), 0);
  const dnpv = (r) => cashflows.reduce((s, cf, i) => s - years[i] * cf.amount / Math.pow(1 + r, years[i] + 1), 0);

  let r = guess;
  for (let i = 0; i < 100; i++) {
    const v = npv(r), d = dnpv(r);
    if (Math.abs(d) < 1e-12) break;
    const next = r - v / d;
    if (Math.abs(next - r) < 1e-8) return next * 100;
    if (!isFinite(next) || next < -0.99) return null;
    r = next;
  }
  return null;
};

/* ============================================================
   TOAST
   ============================================================ */
const ToastContext = React.createContext({ showToast: () => {} });

/* PRIVACY CONTEXT: oculta valores monetarios con *** */
const PrivacyContext = React.createContext({ hidden: false, toggleHidden: () => {} });
const usePrivacy = () => React.useContext(PrivacyContext);
const maskValue = (s, hidden) => hidden ? s.replace(/[\d.,]+/g, '•••') : s;
const ToastProvider = ({ children }) => {
  const [toasts, setToasts] = useState([]);
  const showToast = useCallback((msg, type = 'info') => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3500);
  }, []);
  return (
    <ToastContext.Provider value={{ showToast }}>
      {children}
      <div className="fixed top-4 right-4 z-[100] space-y-2">
        {toasts.map(t => (
          <div key={t.id} className={`px-4 py-2 rounded-lg shadow-xl animate-fade-in text-sm font-medium ${
            t.type === 'error' ? 'bg-red-600' : t.type === 'success' ? 'bg-green-600' : 'bg-slate-700'
          }`}>{t.msg}</div>
        ))}
      </div>
    </ToastContext.Provider>
  );
};
const useToast = () => React.useContext(ToastContext);

/* ============================================================
   PERSISTENCIA + MIGRACIÓN v2.1 → v2.2
   ============================================================ */
const loadData = () => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return DEFAULT_DATA;
    const parsed = JSON.parse(raw);
    const merged = { ...DEFAULT_DATA, ...parsed };
    /* Migración v2.1→v2.2: añadir lotes FIFO si faltan + normalizar símbolo */
    merged.holdings = merged.holdings.map(h => {
      /* Normalizar símbolo SIEMPRE a uppercase trim */
      if (h.symbol) h.symbol = String(h.symbol).trim().toUpperCase();
      if (!h.lots && h.type !== 'cash') {
        h.lots = [{
          id: `lot_${h.id}_0`,
          shares: h.shares,
          costBasis: h.costBasis,
          commission: h.commission || 0,
          purchaseDate: h.purchaseDate,
          txSnapshot: h.txSnapshot,
          txTrms: h.txTrms
        }];
      }
      return h;
    });

    /* Consolidación idempotente: siempre se ejecuta. Si no hay duplicados, no cambia nada. */
    merged.holdings = consolidateHoldings(merged.holdings);
    merged.version = APP_VERSION;
    return merged;
  } catch { return DEFAULT_DATA; }
};

/* Función reutilizable de consolidación por símbolo+type */
/* Detecta holdings que deben ocultarse en v2.7+ por ser "pseudo-cash" o vacíos:
   - type === 'cash' (legacy explícito)
   - símbolos típicos de efectivo (EFECTIVO, CASH, EURO, USD, COP) sin shares reales
   - holdings con shares === 0 o sin lotes activos
   NOTA: respeta la flag showLegacyCash en localStorage si el usuario quiere verlos. */
const CASH_SYMBOLS = ['EFECTIVO', 'CASH', 'EURO', 'EUR', 'USD', 'COP', 'DOLAR', 'DÓLAR', 'PESOS'];

const isPseudoCashOrEmpty = (h) => {
  if (!h) return true;
  /* Legacy explícito */
  if (h.type === 'cash') return true;
  /* Símbolo típico de cash */
  const sym = (h.symbol || '').trim().toUpperCase();
  if (CASH_SYMBOLS.includes(sym)) return true;
  /* Sin lotes o cantidad cero */
  const totalShares = (h.lots || []).reduce((s, l) => s + (l.shares || 0), 0);
  if (totalShares <= 0.0001 && !h.shares) return true;
  if (h.shares !== undefined && Math.abs(h.shares) < 0.0001) return true;
  return false;
};

const consolidateHoldings = (holdings) => {
  const consolidated = [];
  const bySymbol = {};
  holdings.forEach(h => {
    const symbolKey = (h.symbol || '').trim().toUpperCase();
    if (!symbolKey) return;
    const key = `${symbolKey}__${h.type}`;
    if (!bySymbol[key]) {
      bySymbol[key] = { ...h, symbol: symbolKey, lots: [...(h.lots || [])] };
      consolidated.push(bySymbol[key]);
    } else {
      const existing = bySymbol[key];
      existing.lots = [...existing.lots, ...(h.lots || [])];
      existing.shares = existing.lots.reduce((s, l) => s + l.shares, 0);
      if (h.currentPrice && !existing.currentPrice) existing.currentPrice = h.currentPrice;
      if (h.category && (!existing.category || existing.category === 'Otros')) existing.category = h.category;
      if (h.notes && existing.notes !== h.notes && !(existing.notes || '').includes(h.notes)) {
        existing.notes = (existing.notes ? existing.notes + ' | ' : '') + h.notes;
      }
    }
  });
  /* Ordenar lotes por fecha asc (FIFO) y asegurar ids únicos */
  consolidated.forEach(h => {
    if (h.lots) {
      h.lots.sort((a, b) => (a.purchaseDate || '').localeCompare(b.purchaseDate || ''));
      const seen = new Set();
      h.lots.forEach((l, i) => {
        if (!l.id || seen.has(l.id)) l.id = `lot_${h.id}_${i}_${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
        seen.add(l.id);
      });
    }
  });
  return consolidated;
};
const persistData = (d) => localStorage.setItem(STORAGE_KEY, JSON.stringify(d));

const loadSnapshots = () => {
  try { return JSON.parse(localStorage.getItem(SNAPSHOTS_KEY) || '[]'); }
  catch { return []; }
};
const persistSnapshots = (s) => localStorage.setItem(SNAPSHOTS_KEY, JSON.stringify(s));

const loadFundamentals = () => {
  try { return JSON.parse(localStorage.getItem(FUNDAMENTALS_KEY) || '{}'); }
  catch { return {}; }
};
const persistFundamentals = (f) => localStorage.setItem(FUNDAMENTALS_KEY, JSON.stringify(f));

/* Normaliza la respuesta de Finnhub /stock/metric a un objeto plano con los 15 ratios elegidos */
const normalizeMetrics = (raw) => {
  if (!raw || !raw.metric) return null;
  const m = raw.metric;
  return {
    /* Valoración */
    per: m.peNormalizedAnnual ?? m.peTTM ?? m.peBasicExclExtraTTM ?? null,
    peg: m.pegRatio ?? null,
    ps: m.psTTM ?? null,
    pb: m.pbAnnual ?? m.pbQuarterly ?? null,
    evEbitda: m['enterpriseValueOverEBITDATTM'] ?? null,
    /* Calidad */
    roe: m.roeTTM ?? m.roeRfy ?? null,
    roic: m.roicTTM ?? m.roiTTM ?? null,
    marginOp: m.operatingMarginTTM ?? null,
    debtToEquity: m['totalDebt/totalEquityAnnual'] ?? m['totalDebt/totalEquityQuarterly'] ?? null,
    currentRatio: m.currentRatioAnnual ?? m.currentRatioQuarterly ?? null,
    /* Crecimiento */
    revGrowth: m.revenueGrowthTTMYoy ?? m.revenueGrowth5Y ?? null,
    epsGrowth: m.epsGrowthTTMYoy ?? m.epsGrowth5Y ?? null,
    divYield: m.dividendYieldIndicatedAnnual ?? m.currentDividendYieldTTM ?? null,
    payoutRatio: m.payoutRatioAnnual ?? m.payoutRatioTTM ?? null,
    beta: m.beta ?? null,
    /* Adicional: 52W range */
    week52High: m['52WeekHigh'] ?? null,
    week52Low: m['52WeekLow'] ?? null,
    /* Meta */
    fetchedAt: Date.now()
  };
};

/* ============================================================
   BACKUP / EXPORT
   ============================================================ */
const downloadBlob = (content, filename, type) => {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

const downloadBackup = (data) => {
  const payload = {
    appVersion: APP_VERSION,
    exportedAt: new Date().toISOString(),
    data,
    snapshots: loadSnapshots(),
    fundamentals: loadFundamentals()
  };
  downloadBlob(JSON.stringify(payload, null, 2), `portfolio_backup_${new Date().toISOString().split('T')[0]}.json`, 'application/json');
  localStorage.setItem(LAST_BACKUP_STORE, new Date().toISOString());
};

const csvRow = (arr) => arr.map(c => {
  const s = String(c ?? '');
  return s.includes(',') || s.includes('"') ? `"${s.replace(/"/g, '""')}"` : s;
}).join(',');

const exportLedgerCSV = (data, kind = 'all') => {
  const rows = [];
  rows.push(csvRow([
    'Fecha', 'Tipo', 'Símbolo', 'Cantidad', 'Precio Unit. Nativo', 'Moneda Nativa',
    'Comisión Nativa', 'Total Nativo',
    'Total USD', 'Total EUR', 'Total COP',
    'TRM USD/COP', 'TRM EUR/COP',
    'Categoría', 'Notas'
  ]));

  if (kind === 'all' || kind === 'buys') {
    data.holdings.forEach(h => {
      if (h.type === 'cash') return;
      (h.lots || [{ shares: h.shares, costBasis: h.costBasis, commission: h.commission, purchaseDate: h.purchaseDate, txSnapshot: h.txSnapshot, txTrms: h.txTrms }]).forEach(lot => {
        const totalNativo = lot.shares * lot.costBasis + (lot.commission || 0);
        const snap = lot.txSnapshot || { USD: 0, EUR: 0, COP: 0 };
        const trms = lot.txTrms || data.trms;
        rows.push(csvRow([
          lot.purchaseDate || '', 'COMPRA', h.symbol, lot.shares, lot.costBasis, h.currency,
          lot.commission || 0, totalNativo.toFixed(2),
          (snap.USD || 0).toFixed(2), (snap.EUR || 0).toFixed(2), (snap.COP || 0).toFixed(2),
          trms.USD || '', trms.EUR || '', h.category || '', h.notes || ''
        ]));
      });
    });
  }
  if (kind === 'all' || kind === 'sales') {
    (data.sales || []).forEach(s => {
      const totalNativo = s.shares * s.sellPrice - (s.commission || 0);
      const snap = s.txSnapshot || { USD: 0, EUR: 0, COP: 0 };
      const trms = s.txTrms || data.trms;
      rows.push(csvRow([
        s.date || '', 'VENTA', s.symbol, s.shares, s.sellPrice, s.currency || 'USD',
        s.commission || 0, totalNativo.toFixed(2),
        (snap.USD || 0).toFixed(2), (snap.EUR || 0).toFixed(2), (snap.COP || 0).toFixed(2),
        trms.USD || '', trms.EUR || '', '', s.notes || ''
      ]));
    });
  }
  if (kind === 'all' || kind === 'dividends') {
    (data.dividends || []).forEach(d => {
      const snap = d.txSnapshot || { USD: 0, EUR: 0, COP: 0 };
      const trms = d.txTrms || data.trms;
      rows.push(csvRow([
        d.date || '', 'DIVIDENDO', d.symbol, '', '', d.currency || 'USD', '',
        (d.amount || 0).toFixed(2),
        (snap.USD || 0).toFixed(2), (snap.EUR || 0).toFixed(2), (snap.COP || 0).toFixed(2),
        trms.USD || '', trms.EUR || '', '', d.notes || ''
      ]));
    });
  }

  const filename = `libro_contable_${kind}_${new Date().toISOString().split('T')[0]}.csv`;
  downloadBlob('\ufeff' + rows.join('\n'), filename, 'text/csv;charset=utf-8');
};

const validateBackup = (parsed) => {
  if (!parsed || typeof parsed !== 'object') return { ok: false, err: 'Archivo no válido' };
  const d = parsed.data || parsed;
  if (!Array.isArray(d.holdings)) return { ok: false, err: 'Falta campo "holdings"' };
  if (!d.trms) return { ok: false, err: 'Falta campo "trms"' };
  return { ok: true, data: d, snapshots: parsed.snapshots || [], fundamentals: parsed.fundamentals || {} };
};

/* ============================================================
   API CLIENTS
   ============================================================ */
const finnhub = {
  quote: async (symbol, key) => {
    const r = await fetch(`https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${key}`);
    if (!r.ok) throw new Error('Finnhub quote error');
    return r.json();
  },
  candles: async (symbol, key, resolution = 'D', days = 30) => {
    const to = Math.floor(Date.now() / 1000);
    const from = to - days * 86400;
    const r = await fetch(`https://finnhub.io/api/v1/stock/candle?symbol=${symbol}&resolution=${resolution}&from=${from}&to=${to}&token=${key}`);
    if (!r.ok) return { s: 'no_data' };
    return r.json();
  },
  news: async (symbol, key) => {
    const today = new Date().toISOString().split('T')[0];
    const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString().split('T')[0];
    const r = await fetch(`https://finnhub.io/api/v1/company-news?symbol=${symbol}&from=${weekAgo}&to=${today}&token=${key}`);
    if (!r.ok) return [];
    return r.json();
  },
  earnings: async (key, days = 30) => {
    const today = new Date().toISOString().split('T')[0];
    const future = new Date(Date.now() + days * 86400000).toISOString().split('T')[0];
    const r = await fetch(`https://finnhub.io/api/v1/calendar/earnings?from=${today}&to=${future}&token=${key}`);
    if (!r.ok) return { earningsCalendar: [] };
    return r.json();
  },
  metric: async (symbol, key) => {
    /* Devuelve un objeto con docenas de ratios. Free tier lo soporta. */
    const r = await fetch(`https://finnhub.io/api/v1/stock/metric?symbol=${symbol}&metric=all&token=${key}`);
    if (!r.ok) return null;
    return r.json();
  }
};

/* ============================================================
   GOOGLE DRIVE SYNC
   Usa Google Identity Services (GIS) para OAuth + Drive API v3.
   Scope drive.file: la app solo ve archivos que ella misma crea.
   ============================================================ */
const gdrive = {
  tokenClient: null,
  accessToken: null,
  fileId: null,

  /* Inicializa el cliente de tokens. Se llama una vez que GIS cargó. */
  initTokenClient(onToken) {
    if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
      return false;
    }
    this.tokenClient = window.google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: GDRIVE_SCOPE,
      callback: (resp) => {
        if (resp.error) { onToken(null, resp.error); return; }
        this.accessToken = resp.access_token;
        onToken(resp.access_token, null);
      }
    });
    return true;
  },

  /* Solicita autorización (abre popup de Google la primera vez) */
  requestAuth(interactive = true) {
    if (!this.tokenClient) return;
    this.tokenClient.requestAccessToken({ prompt: interactive ? 'consent' : '' });
  },

  /* Revoca el token (desconectar) */
  signOut() {
    if (this.accessToken && window.google?.accounts?.oauth2) {
      window.google.accounts.oauth2.revoke(this.accessToken, () => {});
    }
    this.accessToken = null;
    this.fileId = null;
  },

  /* Busca el archivo de datos en Drive. Devuelve el fileId o null. */
  async findFile() {
    if (!this.accessToken) throw new Error('Sin autorización');
    const q = encodeURIComponent(`name='${GDRIVE_FILENAME}' and trashed=false`);
    const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name,modifiedTime)`, {
      headers: { Authorization: `Bearer ${this.accessToken}` }
    });
    if (!r.ok) throw new Error(`Drive search error ${r.status}`);
    const j = await r.json();
    if (j.files && j.files.length > 0) {
      this.fileId = j.files[0].id;
      return { id: j.files[0].id, modifiedTime: j.files[0].modifiedTime };
    }
    return null;
  },

  /* Lee el contenido del archivo de datos */
  async readFile() {
    if (!this.fileId) {
      const found = await this.findFile();
      if (!found) return null;
    }
    const r = await fetch(`https://www.googleapis.com/drive/v3/files/${this.fileId}?alt=media`, {
      headers: { Authorization: `Bearer ${this.accessToken}` }
    });
    if (!r.ok) throw new Error(`Drive read error ${r.status}`);
    return r.json();
  },

  /* Guarda (crea o actualiza) el archivo de datos */
  async writeFile(payload) {
    if (!this.accessToken) throw new Error('Sin autorización');
    const content = JSON.stringify(payload, null, 2);
    const metadata = { name: GDRIVE_FILENAME, mimeType: 'application/json' };

    if (!this.fileId) {
      await this.findFile(); /* intenta localizar uno existente */
    }

    if (this.fileId) {
      /* Actualizar archivo existente (multipart) */
      const boundary = 'pf_boundary_' + Date.now();
      const body =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` +
        `${JSON.stringify({ name: GDRIVE_FILENAME })}\r\n` +
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n` +
        `${content}\r\n--${boundary}--`;
      const r = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${this.fileId}?uploadType=multipart`, {
        method: 'PATCH',
        headers: {
          Authorization: `Bearer ${this.accessToken}`,
          'Content-Type': `multipart/related; boundary=${boundary}`
        },
        body
      });
      if (!r.ok) throw new Error(`Drive update error ${r.status}`);
      return r.json();
    } else {
      /* Crear archivo nuevo (multipart) */
      const boundary = 'pf_boundary_' + Date.now();
      const body =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` +
        `${JSON.stringify(metadata)}\r\n` +
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n` +
        `${content}\r\n--${boundary}--`;
      const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${this.accessToken}`,
          'Content-Type': `multipart/related; boundary=${boundary}`
        },
        body
      });
      if (!r.ok) throw new Error(`Drive create error ${r.status}`);
      const j = await r.json();
      this.fileId = j.id;
      return j;
    }

const fxRates = {
  /* Devuelve { USD: cop_per_usd, EUR: cop_per_eur } */
  fetchCOP: async () => {
    try {
      /* USD→COP y EUR→COP en una sola llamada */
      const r = await fetch('https://api.frankfurter.app/latest?from=USD&to=COP,EUR');
      if (!r.ok) throw new Error('frankfurter error');
      const j = await r.json();
      const usdCop = j.rates?.COP;
      const usdEur = j.rates?.EUR;
      if (!usdCop || !usdEur) throw new Error('rates missing');
      /* EUR→COP = (USD→COP) / (USD→EUR) */
      const eurCop = usdCop / usdEur;
      return { USD: usdCop, EUR: eurCop, source: 'BCE', date: j.date };
    } catch (e) {
      /* Fallback: exchangerate.host */
      try {
        const r = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
        if (!r.ok) throw new Error('fallback error');
        const j = await r.json();
        return { USD: j.rates?.COP, EUR: j.rates?.COP / j.rates?.EUR, source: 'fallback', date: j.date };
      } catch { return null; }
    }
  }
};

const macro = {

const Sparkline = ({ data, width = 80, height = 24 }) => {
  if (!data || data.length < 2) return <div style={{ width, height }} className="text-slate-600 text-xs">—</div>;
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;
  const points = data.map((v, i) => {
    const x = (i / (data.length - 1)) * width;
    const y = height - ((v - min) / range) * height;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const stroke = data[data.length - 1] >= data[0] ? '#22c55e' : '#ef4444';
  return <svg width={width} height={height}><polyline points={points} fill="none" stroke={stroke} strokeWidth="1.5" /></svg>;
};

/* Semáforo para ratios fundamentales.
   Rangos basados en consensos de análisis fundamental para empresas growth/tech US.
   Devuelve: 'good' (verde), 'neutral' (gris), 'warn' (amarillo), 'bad' (rojo) */
const scoreRatio = (key, value) => {
  if (value === null || value === undefined || isNaN(value)) return 'neutral';
  const v = Number(value);
  switch (key) {
    case 'per':
      if (v < 0) return 'bad'; /* pérdidas */
      if (v < 15) return 'good';
      if (v < 30) return 'neutral';
      if (v < 50) return 'warn';
      return 'bad';
    case 'peg':
      if (v < 0) return 'bad';
      if (v < 1) return 'good';
      if (v < 2) return 'neutral';
      return 'warn';
    case 'ps':
      if (v < 2) return 'good';
      if (v < 8) return 'neutral';
      if (v < 15) return 'warn';
      return 'bad';
    case 'pb':
      if (v < 1.5) return 'good';
      if (v < 4) return 'neutral';
      return 'warn';
    case 'evEbitda':
      if (v < 10) return 'good';
      if (v < 20) return 'neutral';
      if (v < 35) return 'warn';
      return 'bad';
    case 'roe':
      if (v > 20) return 'good';
      if (v > 10) return 'neutral';
      if (v > 0) return 'warn';
      return 'bad';
    case 'roic':
      if (v > 15) return 'good';
      if (v > 8) return 'neutral';
      if (v > 0) return 'warn';
      return 'bad';
    case 'marginOp':
      if (v > 20) return 'good';
      if (v > 10) return 'neutral';
      if (v > 0) return 'warn';
      return 'bad';
    case 'debtToEquity':
      if (v < 0.5) return 'good';
      if (v < 1.5) return 'neutral';
      if (v < 3) return 'warn';
      return 'bad';
    case 'currentRatio':
      if (v > 2) return 'good';
      if (v > 1) return 'neutral';
      return 'bad';
    case 'revGrowth':
      if (v > 20) return 'good';
      if (v > 5) return 'neutral';
      if (v > 0) return 'warn';
      return 'bad';
    case 'epsGrowth':
      if (v > 15) return 'good';
      if (v > 0) return 'neutral';
      return 'bad';
    case 'divYield':
      if (v > 3) return 'good';
      if (v > 1) return 'neutral';
      return 'warn';
    case 'payoutRatio':
      if (v > 0 && v < 60) return 'good';
      if (v < 80) return 'neutral';
      return 'warn';
    case 'beta':
      if (v < 1) return 'good';
      if (v < 1.5) return 'neutral';
      if (v < 2) return 'warn';
      return 'bad';
    default: return 'neutral';
  }
};

/* TREEMAP profesional - DIVs HTML posicionados, texto que respeta el contenedor, responsive */
const Treemap = ({ items, height = 400, viewCurrency = 'USD' }) => {
  const [hover, setHover] = useState(null);
  const [dims, setDims] = useState({ w: 1000, h: height });
  const containerRef = useRef(null);

  /* Medir el ancho real del contenedor (responsive) */
  useEffect(() => {
    const measure = () => {
      if (containerRef.current) {
        const w = containerRef.current.clientWidth;
        setDims({ w: Math.max(100, w), h: height });
      }
    };
    measure();
    window.addEventListener('resize', measure);
    return () => window.removeEventListener('resize', measure);
  }, [height]);

  if (!items.length) return <div className="text-center text-slate-500 py-12 text-sm">Sin datos para visualizar.</div>;
  const filtered = items.filter(it => it.value > 0);
  if (!filtered.length) return null;

  /* Squarified treemap simplificado y robusto */
  const sorted = [...filtered].sort((a, b) => b.value - a.value);
  const total = sorted.reduce((s, x) => s + x.value, 0);
  const layout = [];
  const totalArea = dims.w * dims.h;
  const scale = totalArea / total;

  const worstAspect = (row, sideLen) => {
    if (!row.length) return Infinity;
    const sum = row.reduce((s, r) => s + r.value, 0) * scale;
    const rowMin = Math.min(...row.map(r => r.value)) * scale;
    const rowMax = Math.max(...row.map(r => r.value)) * scale;
    const w2 = sideLen * sideLen;
    return Math.max((w2 * rowMax) / (sum * sum), (sum * sum) / (w2 * rowMin));
  };

  const placeRow = (row, rect) => {
    const sum = row.reduce((s, r) => s + r.value, 0) * scale;
    const isHoriz = rect.w >= rect.h;
    if (isHoriz) {
      const rowW = sum / rect.h;
      let off = 0;
      row.forEach(it => {
        const h = it.value * scale / rowW;
        layout.push({ ...it, x: rect.x, y: rect.y + off, w: rowW, h });
        off += h;
      });
      return { x: rect.x + rowW, y: rect.y, w: Math.max(0, rect.w - rowW), h: rect.h };
    } else {
      const rowH = sum / rect.w;
      let off = 0;
      row.forEach(it => {
        const w = it.value * scale / rowH;
        layout.push({ ...it, x: rect.x + off, y: rect.y, w, h: rowH });
        off += w;
      });
      return { x: rect.x, y: rect.y + rowH, w: rect.w, h: Math.max(0, rect.h - rowH) };
    }
  };

  let rect = { x: 0, y: 0, w: dims.w, h: dims.h };
  let row = [];
  let remaining = [...sorted];
  while (remaining.length) {
    const sideLen = Math.min(rect.w, rect.h);
    if (sideLen <= 0) break;
    const next = remaining[0];
    const trial = [...row, next];
    if (row.length === 0 || worstAspect(trial, sideLen) <= worstAspect(row, sideLen)) {
      row.push(next);
      remaining.shift();
    } else {
      rect = placeRow(row, rect);
      row = [];
    }
  }
  if (row.length) placeRow(row, rect);

  /* HSL gradient continuo: P/L total largo plazo. Rango ±50% */
  const colorFor = (pct) => {
    const clamped = Math.max(-50, Math.min(50, pct || 0));
    const intensity = Math.abs(clamped) / 50;
    if (Math.abs(clamped) < 1) return { fill: '#334155', stroke: '#475569' };
    if (clamped > 0) {
      const lightness = 30 - intensity * 10;
      const saturation = 45 + intensity * 35;
      return { fill: `hsl(142, ${saturation}%, ${lightness}%)`, stroke: `hsl(142, ${saturation}%, ${lightness + 12}%)` };
    }
    const lightness = 34 - intensity * 10;
    const saturation = 55 + intensity * 30;
    return { fill: `hsl(0, ${saturation}%, ${lightness}%)`, stroke: `hsl(0, ${saturation}%, ${lightness + 12}%)` };
  };

  const handleMove = (e, b) => {
    const r = containerRef.current?.getBoundingClientRect();
    if (!r) return;
    setHover({ ...b, mouseX: e.clientX - r.left, mouseY: e.clientY - r.top });
  };

  return (
    <div ref={containerRef} style={{ width: '100%', height, position: 'relative', background: '#020617', borderRadius: 6, overflow: 'hidden' }} onMouseLeave={() => setHover(null)}>
      {layout.map((b, i) => {
        const c = colorFor(b.plPct || 0);
        /* Tipografía adaptativa basada en dimensión más corta */
        const minSide = Math.min(b.w, b.h);
        const fs = Math.max(8, Math.min(22, minSide / 4.5));
        /* Decidir qué mostrar según área */
        const showSymbol = b.w > 30 && b.h > 18;
        const showPct = b.w > 50 && b.h > 38;
        const showWeight = b.w > 70 && b.h > 60;
        const isHovered = hover && hover.symbol === b.symbol;
        return (
          <div key={i}
            onMouseMove={e => handleMove(e, b)}
            onMouseEnter={e => handleMove(e, b)}
            style={{
              position: 'absolute',
              left: b.x + 1, top: b.y + 1,
              width: Math.max(0, b.w - 2), height: Math.max(0, b.h - 2),
              background: `linear-gradient(to bottom, ${c.stroke}, ${c.fill})`,
              border: isHovered ? '2px solid #fff' : '1px solid #020617',
              borderRadius: 4,
              cursor: 'pointer',
              display: 'flex',
              flexDirection: 'column',
              alignItems: 'center',
              justifyContent: 'center',
              overflow: 'hidden',
              padding: 2,
              boxSizing: 'border-box',
              transition: 'border 0.15s',
              userSelect: 'none'
            }}>
            {showSymbol && (
              <div style={{
                fontSize: fs,
                fontWeight: 700,
                color: '#fff',
                textShadow: '0 1px 2px rgba(0,0,0,0.7)',
                lineHeight: 1.05,
                maxWidth: '100%',
                overflow: 'hidden',
                textOverflow: 'ellipsis',
                whiteSpace: 'nowrap',
                textAlign: 'center'
              }}>{b.symbol}</div>
            )}
            {showPct && (
              <div style={{
                fontSize: fs * 0.55,
                fontWeight: 500,
                color: '#fff',
                opacity: 0.95,
                textShadow: '0 1px 2px rgba(0,0,0,0.7)',
                fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace',
                whiteSpace: 'nowrap'
              }}>{fmtPct(b.plPct || 0)}</div>
            )}
            {showWeight && (
              <div style={{
                fontSize: fs * 0.45,
                color: '#fff',
                opacity: 0.75,
                textShadow: '0 1px 2px rgba(0,0,0,0.7)',
                fontFamily: 'ui-monospace, monospace',
                whiteSpace: 'nowrap'
              }}>{(b.weight * 100).toFixed(1)}%</div>
            )}
          </div>
        );
      })}
      {hover && (
        <div className="absolute pointer-events-none bg-slate-950/95 border border-slate-600 rounded-lg shadow-2xl px-3 py-2 text-xs z-20 min-w-[170px]"
          style={{
            left: Math.min(hover.mouseX + 14, dims.w - 190),
            top: Math.min(hover.mouseY + 14, height - 140)
          }}>
          <div className="font-bold text-cyan-400 text-sm mb-1">{hover.symbol}</div>
          <div className="space-y-0.5">
            <div className="flex justify-between gap-3"><span className="text-slate-400">Valor:</span><span className="font-mono text-white">{fmtMoney(hover.value, viewCurrency)}</span></div>
            <div className="flex justify-between gap-3"><span className="text-slate-400">P/L total:</span><span className={`font-mono ${(hover.plPct || 0) >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtPct(hover.plPct || 0)}</span></div>
            {hover.cagr !== null && hover.cagr !== undefined && <div className="flex justify-between gap-3"><span className="text-slate-400">CAGR:</span><span className={`font-mono ${(hover.cagr || 0) >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtPct(hover.cagr)}</span></div>}
            <div className="flex justify-between gap-3"><span className="text-slate-400">% Día:</span><span className={`font-mono ${(hover.changePct || 0) >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtPct(hover.changePct || 0)}</span></div>
            <div className="flex justify-between gap-3"><span className="text-slate-400">% Portfolio:</span><span className="font-mono text-white">{(hover.weight * 100).toFixed(2)}%</span></div>
            {hover.category && <div className="flex justify-between gap-3"><span className="text-slate-400">Categoría:</span><span className="text-slate-300">{hover.category}</span></div>}
          </div>
        </div>
      )}
      <div className="absolute bottom-2 left-2 flex items-center gap-2 text-[10px] bg-slate-950/80 backdrop-blur rounded px-2 py-1">
        <span className="text-slate-400">P/L:</span>
        <div className="flex items-center gap-0.5">
          <span style={{ background: 'hsl(0, 85%, 24%)' }} className="w-4 h-3 rounded-sm"></span>
          <span style={{ background: 'hsl(0, 65%, 30%)' }} className="w-4 h-3"></span>
          <span style={{ background: '#334155' }} className="w-4 h-3"></span>
          <span style={{ background: 'hsl(142, 60%, 25%)' }} className="w-4 h-3"></span>
          <span style={{ background: 'hsl(142, 80%, 20%)' }} className="w-4 h-3 rounded-sm"></span>
        </div>
        <span className="text-slate-500">−50%</span><span className="text-slate-500">0</span><span className="text-slate-500">+50%</span>
      </div>
    </div>
  );
};

  }
  const padding = { top: 20, right: 20, bottom: 30, left: 60 };
  const innerW = width - padding.left - padding.right;
  const innerH = height - padding.top - padding.bottom;
  const values = data.map(d => d.value);
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;

  const points = data.map((d, i) => {
    const x = padding.left + (i / (data.length - 1)) * innerW;
    const y = padding.top + innerH - ((d.value - min) / range) * innerH;
    return { x, y, ...d };
  });

  const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
  const areaPath = `${path} L ${points[points.length - 1].x.toFixed(1)} ${padding.top + innerH} L ${padding.left} ${padding.top + innerH} Z`;
  const first = data[0].value, last = data[data.length - 1].value;
  const up = last >= first;
  const color = up ? '#22c55e' : '#ef4444';

  const yTicks = 4;
  const tickValues = Array.from({ length: yTicks + 1 }, (_, i) => min + (range * i / yTicks));

  return (
    <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`}>
      <defs>
        <linearGradient id="grad" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.3" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      {tickValues.map((v, i) => {
        const y = padding.top + innerH - ((v - min) / range) * innerH;
        return (
          <g key={i}>
            <line x1={padding.left} x2={width - padding.right} y1={y} y2={y} stroke="#1e293b" strokeWidth="1" />
            <text x={padding.left - 8} y={y + 3} textAnchor="end" fill="#64748b" fontSize="10">{fmt(v, 0)}</text>
          </g>
        );
      })}
      <path d={areaPath} fill="url(#grad)" />
      <path d={path} fill="none" stroke={color} strokeWidth="2" />
      {data.length <= 30 && points.map((p, i) => (
        <circle key={i} cx={p.x} cy={p.y} r="2.5" fill={color} />
      ))}
      <text x={padding.left} y={15} fill="#94a3b8" fontSize="11">{data[0].date}</text>
      <text x={width - padding.right} y={15} fill="#94a3b8" fontSize="11" textAnchor="end">{data[data.length - 1].date}</text>
    </svg>
  );
};

/* ============================================================
   MODAL VENTA (con FIFO real)
   ============================================================ */
const SellModal = ({ open, onClose, onSave, holding, currentTrms }) => {
  const [txTrms, setTxTrms] = useState(currentTrms);
  const [preview, setPreview] = useState({ USD: 0, EUR: 0, COP: 0 });
  const [sharesInput, setSharesInput] = useState(0);
  const formRef = useRef(null);

  useEffect(() => {
    if (open) {
      setTxTrms(currentTrms);
      setSharesInput(holding?.shares || 0);
    }
  }, [open, currentTrms, holding]);

  const fifoPreview = useMemo(() => {
    if (!holding || !holding.lots) return null;
    const lots = [...holding.lots].sort((a, b) => a.purchaseDate.localeCompare(b.purchaseDate));
    let remaining = sharesInput;
    const consumed = [];
    let totalCost = 0;
    for (const lot of lots) {
      if (remaining <= 0) break;
      const take = Math.min(remaining, lot.shares);
      const lotCost = take * lot.costBasis + (lot.commission || 0) * (take / lot.shares);
      consumed.push({ lotId: lot.id, shares: take, costBasis: lot.costBasis, lotCost, purchaseDate: lot.purchaseDate });
      totalCost += lotCost;
      remaining -= take;
    }
    return { consumed, totalCost, fullySatisfied: remaining <= 0.0001 };
  }, [sharesInput, holding]);

  const recalcPreview = () => {
    const f = formRef.current; if (!f || !holding) return;
    const shares = parseFloat(f.shares.value) || 0;
    const price = parseFloat(f.sellPrice.value) || 0;
    const comm = parseFloat(f.commission.value) || 0;
    setSharesInput(shares);
    setPreview(snapshotMultiCurrency(shares * price - comm, holding.currency, txTrms));
  };

  useEffect(() => { recalcPreview(); /* eslint-disable-next-line */ }, [txTrms, open]);

  if (!open || !holding) return null;

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!fifoPreview?.fullySatisfied) return;
    const f = new FormData(e.target);
    const shares = parseFloat(f.get('shares'));
    const sellPrice = parseFloat(f.get('sellPrice'));
    const commission = parseFloat(f.get('commission') || 0);
    const totalNativo = shares * sellPrice - commission;
    const txSnapshot = snapshotMultiCurrency(totalNativo, holding.currency, txTrms);

    onSave({
      id: `s_${Date.now()}`,
      holdingId: holding.id,
      symbol: holding.symbol,
      currency: holding.currency,
      shares, sellPrice, commission,
      date: f.get('date'),
      notes: f.get('notes') || '',
      txSnapshot, txTrms: { ...txTrms },
      fifoConsumed: fifoPreview.consumed,
      avgCostBasis: fifoPreview.totalCost / shares,
      realizedPL_native: totalNativo - fifoPreview.totalCost
    });
  };

  return (
    <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 animate-fade-in">
      <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-xl max-h-[90vh] overflow-y-auto">
        <div className="p-4 border-b border-slate-800 flex justify-between items-center sticky top-0 bg-slate-900 z-10">
          <h3 className="font-bold text-red-400"><i className="fa-solid fa-arrow-trend-down mr-1"></i>Vender {holding.symbol} <span className="text-xs text-slate-400 font-normal">(FIFO)</span></h3>
          <button onClick={onClose}><i className="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <form ref={formRef} onSubmit={handleSubmit} onChange={recalcPreview} className="p-4 space-y-3 text-sm">
          <div className="bg-slate-800/50 rounded p-2 text-xs">
            Posee: <span className="font-bold text-white">{fmt(holding.shares, 4)} {holding.symbol}</span> · {holding.lots?.length || 1} lote(s)
          </div>
          <div className="grid grid-cols-3 gap-3">
            <div><label className="text-xs text-slate-400">Cantidad</label><input name="shares" type="number" step="any" max={holding.shares} required defaultValue={holding.shares} className="w-full bg-slate-950 border border-slate-700 rounded p-2" /></div>
            <div><label className="text-xs text-slate-400">Precio venta</label><input name="sellPrice" type="number" step="any" required defaultValue={holding.currentPrice} className="w-full bg-slate-950 border border-slate-700 rounded p-2" /></div>
            <div><label className="text-xs text-slate-400">Comisión</label><input name="commission" type="number" step="any" defaultValue={0} className="w-full bg-slate-950 border border-slate-700 rounded p-2" /></div>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div><label className="text-xs text-slate-400">Fecha</label><input name="date" type="date" required defaultValue={new Date().toISOString().split('T')[0]} className="w-full bg-slate-950 border border-slate-700 rounded p-2" /></div>
            <div><label className="text-xs text-slate-400">Notas</label><input name="notes" placeholder="rebalanceo" className="w-full bg-slate-950 border border-slate-700 rounded p-2" /></div>
          </div>

          {/* FIFO preview */}
          {fifoPreview && fifoPreview.consumed.length > 0 && (
            <div className="bg-cyan-950/30 border border-cyan-700/50 rounded-lg p-3">
              <div className="text-xs font-bold text-cyan-300 uppercase tracking-wider mb-2"><i className="fa-solid fa-layer-group mr-1"></i>Lotes FIFO consumidos</div>
              <div className="space-y-1 text-xs">
                {fifoPreview.consumed.map((c, i) => (
                  <div key={i} className="flex justify-between font-mono">
                    <span className="text-slate-400">{c.purchaseDate}:</span>
                    <span>{fmt(c.shares, 4)} × {fmtMoney(c.costBasis, holding.currency)} = {fmtMoney(c.lotCost, holding.currency)}</span>
                  </div>
                ))}
                <div className="flex justify-between font-bold pt-1 border-t border-cyan-800">
                  <span>Costo total:</span><span>{fmtMoney(fifoPreview.totalCost, holding.currency)}</span>
                </div>
              </div>
            </div>
          )}

          <div className="bg-slate-800/50 border border-slate-700 rounded-lg p-3 space-y-2">
            <div className="flex items-center justify-between">
              <div className="text-xs font-bold text-amber-400">TRMs de la venta</div>
              <button type="button" onClick={() => setTxTrms(currentTrms)} className="text-xs text-cyan-400 hover:underline">Actuales</button>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div><label className="text-xs text-slate-400">USD/COP</label><input type="number" step="any" value={txTrms.USD} onChange={e => setTxTrms(t => ({ ...t, USD: parseFloat(e.target.value) || 0 }))} className="w-full bg-slate-950 border border-slate-700 rounded p-2" /></div>
              <div><label className="text-xs text-slate-400">EUR/COP</label><input type="number" step="any" value={txTrms.EUR} onChange={e => setTxTrms(t => ({ ...t, EUR: parseFloat(e.target.value) || 0 }))} className="w-full bg-slate-950 border border-slate-700 rounded p-2" /></div>
            </div>
          </div>

          <div className="bg-gradient-to-r from-red-950/40 to-orange-950/40 border border-red-700/50 rounded-lg p-3">
            <div className="text-xs font-bold text-red-300 uppercase tracking-wider mb-2">Ingreso neto</div>
            <div className="grid grid-cols-3 gap-2 text-sm">
              <div className="bg-slate-950/60 rounded p-2"><div className="text-xs text-slate-400">USD</div><div className="font-bold text-green-400">${fmt(preview.USD)}</div></div>
              <div className="bg-slate-950/60 rounded p-2"><div className="text-xs text-slate-400">EUR</div><div className="font-bold text-blue-400">€{fmt(preview.EUR)}</div></div>
              <div className="bg-slate-950/60 rounded p-2"><div className="text-xs text-slate-400">COP</div><div className="font-bold text-yellow-400">${fmt(preview.COP, 0)}</div></div>
            </div>
          </div>

          <button type="submit" disabled={!fifoPreview?.fullySatisfied} className="w-full bg-red-600 hover:bg-red-500 disabled:opacity-50 py-3 rounded-xl font-bold">Ejecutar Venta FIFO</button>
        </form>
      </div>
    </div>
  );
};

              <div className="bg-slate-950/60 rounded p-2"><div className="text-xs text-slate-400">EUR</div><div className="font-bold text-blue-400">€{fmt(preview.EUR)}</div></div>
              <div className="bg-slate-950/60 rounded p-2"><div className="text-xs text-slate-400">COP</div><div className="font-bold text-yellow-400">${fmt(preview.COP, 0)}</div></div>
            </div>
          </div>

          <button type="submit" className="w-full bg-amber-600 hover:bg-amber-500 py-3 rounded-xl font-bold">Guardar</button>
        </form>
      </div>
    </div>
  );
};

/* ============================================================
   SUB-PESTAÑA: POSICIONES (con desplegables, sort, search)
   ============================================================ */
const PositionsSection = ({ data, setData, viewCurrency, finnhubKey, fundamentals, setFundamentals }) => {
  const { showToast } = useToast();
  const { hidden } = usePrivacy();
  const [posModal, setPosModal] = useState({ open: false });
  const [sellModal, setSellModal] = useState({ open: false });
  const [refreshing, setRefreshing] = useState(false);
  const [expanded, setExpanded] = useState({});
  const [search, setSearch] = useState('');
  const [sortBy, setSortBy] = useState('weight');
  const [sortDir, setSortDir] = useState('desc');
  const [filterCat, setFilterCat] = useState('all');
  const [filterStatus, setFilterStatus] = useState('all');
  const [groupBy, setGroupBy] = useState('none');
  const [editingPrice, setEditingPrice] = useState(null);
  /* showLegacyCash se sincroniza desde localStorage cada vez que cambia */
  const [showLegacyCash, setShowLegacyCash] = useState(() => localStorage.getItem('show_legacy_cash') === 'true');

  /* Re-leer flag cuando se modifique desde Settings */
  useEffect(() => {
    const interval = setInterval(() => {
      const cur = localStorage.getItem('show_legacy_cash') === 'true';
      if (cur !== showLegacyCash) setShowLegacyCash(cur);
    }, 1000);
    return () => clearInterval(interval);
  }, [showLegacyCash]);

  /* Contar holdings legacy de cash en data raw */
  const legacyCashCount = useMemo(() => data.holdings.filter(h => isPseudoCashOrEmpty(h)).length, [data.holdings]);

  const savePrice = (holdingId, newPrice) => {
    if (!newPrice || isNaN(newPrice) || newPrice <= 0) { setEditingPrice(null); return; }
    const next = { ...data, holdings: data.holdings.map(h => h.id === holdingId ? { ...h, currentPrice: newPrice } : h) };
    setData(next); persistData(next);
    setEditingPrice(null);
    showToast('Precio actualizado para todos los lotes', 'success');
  };

  const refreshPrices = async () => {
    if (!finnhubKey) { showToast('Falta API key', 'error'); return; }
    setRefreshing(true);
    const symbols = [...new Set(data.holdings.filter(h => !isPseudoCashOrEmpty(h)).map(h => h.symbol))];
    const updates = { ...data };
    const newFundamentals = { ...fundamentals };
    let fundamentalsCount = 0;

    for (const sym of symbols) {
      try {
        const q = await finnhub.quote(sym, finnhubKey);
        if (q.c > 0) updates.holdings = updates.holdings.map(h => h.symbol === sym && !isPseudoCashOrEmpty(h) ? { ...h, currentPrice: q.c, dayChangePct: q.dp } : h);
        await new Promise(r => setTimeout(r, 80));

        /* Fundamentales: solo si caché tiene más de 6 horas */
        const cached = newFundamentals[sym];
        const sixHours = 6 * 3600 * 1000;
        if (!cached || !cached.fetchedAt || (Date.now() - cached.fetchedAt) > sixHours) {
          try {
            const raw = await finnhub.metric(sym, finnhubKey);
            const normalized = normalizeMetrics(raw);
            if (normalized) {
              newFundamentals[sym] = normalized;
              fundamentalsCount++;
            }
            await new Promise(r => setTimeout(r, 80));
          } catch (e) { console.warn('metric fail', sym); }
        }
      } catch (e) { console.warn(sym); }
    }
    setData(updates); persistData(updates);
    setFundamentals(newFundamentals);
    persistFundamentals(newFundamentals);

    /* Crear snapshot automático */
    const totalValue = updates.holdings.reduce((s, h) => s + convert(h.shares * (h.currentPrice || h.costBasis), h.currency, 'USD', updates.trms), 0);
    const snapshots = loadSnapshots();
    const today = new Date().toISOString().split('T')[0];
    const lastIdx = snapshots.findIndex(s => s.date === today);
    const snap = { date: today, valueUSD: totalValue, valueEUR: convert(totalValue, 'USD', 'EUR', updates.trms), valueCOP: convert(totalValue, 'USD', 'COP', updates.trms) };
    if (lastIdx >= 0) snapshots[lastIdx] = snap; else snapshots.push(snap);
    persistSnapshots(snapshots);

    setRefreshing(false);
    const fmsg = fundamentalsCount > 0 ? ` · ${fundamentalsCount} fundamentales` : '';
    showToast(`${symbols.length} precios actualizados${fmsg}`, 'success');
  };

  /* Cálculo agregado por holding */
  const enriched = useMemo(() => {
    /* Filtrar pseudo-cash y holdings vacíos a menos que el usuario lo haya activado en Config */
    const sourceHoldings = showLegacyCash ? data.holdings : data.holdings.filter(h => !isPseudoCashOrEmpty(h));
    const totalValueUSD = sourceHoldings.reduce((s, h) => s + convert(h.shares * (h.currentPrice || h.costBasis), h.currency, 'USD', data.trms), 0);

    return sourceHoldings.map(h => {
      const lots = h.lots || [{ shares: h.shares, costBasis: h.costBasis, commission: h.commission || 0, purchaseDate: h.purchaseDate, txSnapshot: h.txSnapshot, txTrms: h.txTrms }];
      const totalShares = lots.reduce((s, l) => s + l.shares, 0);
      const totalCostNative = lots.reduce((s, l) => s + l.shares * l.costBasis + (l.commission || 0), 0);
      const avgCost = totalShares > 0 ? (totalCostNative - lots.reduce((s, l) => s + (l.commission || 0), 0)) / totalShares : 0;
      const valueNative = totalShares * (h.currentPrice || avgCost);
      const plNative = valueNative - totalCostNative;
      const plPct = totalCostNative ? (plNative / totalCostNative) * 100 : 0;
      const valueUSD = convert(valueNative, h.currency, 'USD', data.trms);
      const valueView = convert(valueNative, h.currency, viewCurrency, data.trms);
      const costView = convert(totalCostNative, h.currency, viewCurrency, data.trms);
      const plView = valueView - costView;
      const weight = totalValueUSD > 0 ? valueUSD / totalValueUSD : 0;

      /* CAGR ponderado por lote */
      const oldestLot = lots.reduce((min, l) => !min || l.purchaseDate < min.purchaseDate ? l : min, null);
      const days = oldestLot ? daysBetween(oldestLot.purchaseDate, new Date()) : 0;
      const cagr = calcCAGR(totalCostNative, valueNative, days);

      /* P/L realizado del activo */
      const sales = (data.sales || []).filter(s => s.holdingId === h.id || s.symbol === h.symbol);
      const realizedPL = sales.reduce((s, sale) => s + (sale.realizedPL_native || 0), 0);

      /* Dividendos cobrados (en moneda nativa de la posición) */
      const divs = (data.dividends || []).filter(d => d.symbol === h.symbol);
      const divTotal = divs.reduce((s, d) => s + convert(d.amount, d.currency, h.currency, data.trms), 0);
      const yoc = totalCostNative > 0 ? (divTotal / totalCostNative) * 100 : 0;

      /* Fundamentales para este símbolo (si están cacheados) */
      const fundamental = fundamentals[h.symbol] || null;
      const per = fundamental?.per ?? null;

      return {
        ...h, lots, totalShares, totalCostNative, avgCost, valueNative, plNative, plPct,
        valueView, costView, plView, weight, cagr, daysHeld: days,
        realizedPL, divTotal, yoc,
        fundamental, per,
        oldestDate: oldestLot?.purchaseDate
      };
    });
  }, [data, viewCurrency, fundamentals, showLegacyCash]);

  const filtered = useMemo(() => {
    let list = enriched.filter(h => {
      if (search && !h.symbol.toLowerCase().includes(search.toLowerCase()) && !(h.category || '').toLowerCase().includes(search.toLowerCase())) return false;
      if (filterCat !== 'all' && h.category !== filterCat) return false;
      if (filterStatus === 'winners' && h.plPct < 0) return false;
      if (filterStatus === 'losers' && h.plPct >= 0) return false;
      return true;
    });

    const sorter = (a, b) => {
      let av, bv;
      if (sortBy === 'symbol') { av = a.symbol; bv = b.symbol; }
      else if (sortBy === 'weight') { av = a.weight; bv = b.weight; }
      else if (sortBy === 'shares') { av = a.totalShares; bv = b.totalShares; }
      else if (sortBy === 'cost') { av = a.costView; bv = b.costView; }
      else if (sortBy === 'value') { av = a.valueView; bv = b.valueView; }
      else if (sortBy === 'pl') { av = a.plView; bv = b.plView; }
      else if (sortBy === 'plPct') { av = a.plPct; bv = b.plPct; }
      else if (sortBy === 'cagr') { av = a.cagr || -999; bv = b.cagr || -999; }
      else if (sortBy === 'per') { av = a.per ?? 999; bv = b.per ?? 999; }
      else if (sortBy === 'category') { av = a.category || ''; bv = b.category || ''; }
      else return 0;
      if (typeof av === 'string') return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
      return sortDir === 'asc' ? av - bv : bv - av;
    };
    return list.sort(sorter);
  }, [enriched, search, sortBy, sortDir, filterCat, filterStatus]);

  /* Agrupamiento por categoría (para vista groupBy='category') */
  const grouped = useMemo(() => {
    if (groupBy === 'none') return null;
    const groups = {};
    filtered.forEach(h => {
      const k = h.category || 'Otros';
      if (!groups[k]) groups[k] = { items: [], totalValue: 0, totalCost: 0, totalPL: 0 };
      groups[k].items.push(h);
      groups[k].totalValue += h.valueView;
      groups[k].totalCost += h.costView;
      groups[k].totalPL += h.plView;
    });
    return groups;
  }, [filtered, groupBy]);

  const categories = useMemo(() => [...new Set(enriched.map(h => h.category).filter(Boolean))], [enriched]);

  const SortHeader = ({ field, label, align = 'left', className = '' }) => {
    const active = sortBy === field;
    return (
      <th className={`p-1.5 md:p-2 cursor-pointer hover:text-cyan-400 select-none text-${align} text-xs ${className}`} onClick={() => {
        if (active) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
        else { setSortBy(field); setSortDir('desc'); }
      }}>
        {label} {active && <i className={`fa-solid ${sortDir === 'asc' ? 'fa-caret-up' : 'fa-caret-down'} ml-1`}></i>}
      </th>
    );
  };

  const handleSavePosition = (payload) => {
    let nextHoldings;
    if (payload.mode === 'newPosition') {
      /* Añadir y luego consolidar todo (idempotente, fusiona duplicados case-insensitive) */
      const normalized = { ...payload.holding, symbol: (payload.holding.symbol || '').trim().toUpperCase() };
      nextHoldings = consolidateHoldings([...data.holdings, normalized]);
      const wasConsolidated = nextHoldings.length === data.holdings.length;
      showToast(wasConsolidated ? `Lote añadido a ${normalized.symbol} (consolidado)` : 'Posición creada', 'success');
    } else if (payload.mode === 'addLot') {
      nextHoldings = data.holdings.map(h => {
        if (h.id !== payload.holdingId) return h;
        const newLots = [...(h.lots || []), payload.lot].sort((a, b) => (a.purchaseDate || '').localeCompare(b.purchaseDate || ''));
        const newShares = newLots.reduce((s, l) => s + l.shares, 0);
        return { ...h, lots: newLots, shares: newShares, currentPrice: payload.currentPrice || h.currentPrice };
      });
      showToast('Lote añadido', 'success');
    } else if (payload.mode === 'editLot') {
      nextHoldings = data.holdings.map(h => {
        if (h.id !== payload.holdingId) return h;
        const newLots = h.lots.map(l => l.id === payload.lot.id ? payload.lot : l).sort((a, b) => (a.purchaseDate || '').localeCompare(b.purchaseDate || ''));
        const newShares = newLots.reduce((s, l) => s + l.shares, 0);
        return { ...h, lots: newLots, shares: newShares };
      });
      showToast('Lote actualizado', 'success');
    }
    const next = { ...data, holdings: nextHoldings };
    setData(next); persistData(next); setPosModal({ open: false });
  };

  const handleSaveSale = (sale) => {
    const h = data.holdings.find(x => x.id === sale.holdingId);
    if (!h) return;
    /* Consumir lotes FIFO */
    const consumed = sale.fifoConsumed;
    const newLots = h.lots.map(lot => {
      const used = consumed.find(c => c.lotId === lot.id);
      if (!used) return lot;
      const remaining = lot.shares - used.shares;
      if (remaining < 0.0001) return null;
      return { ...lot, shares: remaining };
    }).filter(Boolean);

    const newShares = newLots.reduce((s, l) => s + l.shares, 0);
    let nextHoldings;
    if (newShares < 0.0001) {
      nextHoldings = data.holdings.filter(x => x.id !== h.id);
    } else {
      nextHoldings = data.holdings.map(x => x.id === h.id ? { ...x, lots: newLots, shares: newShares } : x);
    }
    const next = { ...data, holdings: nextHoldings, sales: [...(data.sales || []), sale] };
    setData(next); persistData(next); setSellModal({ open: false });
    showToast('Venta registrada (FIFO)', 'success');
  };

  const deleteLot = (holdingId, lotId) => {
    if (!confirm('¿Eliminar este lote? Si es el único, se eliminará la posición.')) return;
    const next = { ...data, holdings: data.holdings.map(h => {
      if (h.id !== holdingId) return h;
      const newLots = h.lots.filter(l => l.id !== lotId);
      const newShares = newLots.reduce((s, l) => s + l.shares, 0);
      return { ...h, lots: newLots, shares: newShares };
    }).filter(h => (h.lots && h.lots.length > 0))};
    setData(next); persistData(next);
    showToast('Lote eliminado', 'success');
  };

  const deleteHolding = (holdingId) => {
    const h = data.holdings.find(x => x.id === holdingId);
    if (!h) return;
    const label = h.symbol || 'esta posición';
    if (!confirm(`¿Eliminar TODA la posición ${label}? Esto borra todos los lotes asociados. La acción NO se puede deshacer (excepto restaurando un backup).`)) return;
    const next = { ...data, holdings: data.holdings.filter(x => x.id !== holdingId) };
    setData(next); persistData(next);
    showToast(`${label} eliminada`, 'success');
  };

  const renderRow = (h) => {
    const isExpanded = expanded[h.id];
    return (
      <React.Fragment key={h.id}>
        <tr className="border-t border-slate-800 hover:bg-slate-800/30 cursor-pointer" onClick={() => setExpanded(e => ({ ...e, [h.id]: !e[h.id] }))}>
          <td className="p-1.5 md:p-2 w-6 text-center">
            <i className={`fa-solid ${isExpanded ? 'fa-chevron-down' : 'fa-chevron-right'} text-slate-400 text-[0.65rem]`}></i>
          </td>
          <td className="p-1.5 md:p-2 font-bold">
            <div className="flex items-center gap-1.5">
              <span>{h.symbol}</span>
              {h.lots && h.lots.length > 1 && (
                <span className="bg-cyan-900/60 border border-cyan-700/50 text-cyan-300 text-[10px] font-mono px-1 py-0.5 rounded">×{h.lots.length}</span>
              )}
            </div>
          </td>
          <td className="text-right p-1.5 md:p-2 font-mono">
            <span className={h.weight > 0.15 ? 'text-cyan-400 font-bold' : 'text-slate-300'}>{hidden ? '••%' : `${(h.weight * 100).toFixed(1)}%`}</span>
          </td>
          <td className="text-right p-1.5 md:p-2 font-mono hidden md:table-cell">{fmt(h.totalShares, 4)}</td>
          <td className="text-right p-1.5 md:p-2 font-mono hidden lg:table-cell">{fmtMoney(h.avgCost, h.currency)}</td>
          <td className="text-right p-1.5 md:p-2 font-mono hidden md:table-cell" onClick={e => e.stopPropagation()}>
            {editingPrice === h.id ? (
              <input
                type="number" step="any" autoFocus defaultValue={h.currentPrice}
                onKeyDown={e => {
                  if (e.key === 'Enter') savePrice(h.id, parseFloat(e.target.value));
                  if (e.key === 'Escape') setEditingPrice(null);
                }}
                onBlur={e => savePrice(h.id, parseFloat(e.target.value))}
                className="w-20 bg-slate-950 border border-cyan-600 rounded px-1 py-0.5 text-right text-white"
              />
            ) : (
              <span onClick={() => setEditingPrice(h.id)} className="cursor-pointer hover:text-cyan-400 group inline-flex items-center gap-1">
                {fmtMoney(h.currentPrice, h.currency)}
                <i className="fa-solid fa-pen-to-square text-[0.6rem] text-slate-600 group-hover:text-cyan-400"></i>
              </span>
            )}
          </td>
          <td className="text-right p-1.5 md:p-2 font-mono">{fmtMoney(h.valueView, viewCurrency)}</td>
          <td className={`text-right p-1.5 md:p-2 font-mono hidden sm:table-cell ${h.plView >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtMoney(h.plView, viewCurrency)}</td>
          <td className={`text-right p-1.5 md:p-2 font-mono ${h.plPct >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtPct(h.plPct)}</td>
          <td className={`text-right p-1.5 md:p-2 font-mono hidden lg:table-cell ${(h.cagr || 0) >= 0 ? 'text-green-400' : 'text-red-400'}`}>{h.cagr !== null ? fmtPct(h.cagr) : '—'}</td>
          <td className="text-right p-1.5 md:p-2 font-mono hidden md:table-cell">
            {h.per !== null ? (
              <span className={`px-1.5 py-0.5 rounded border text-xs ${scoreColor(scoreRatio('per', h.per))}`} title={`PER ${h.per.toFixed(2)}`}>
                {h.per.toFixed(1)}
              </span>
            ) : <span className="text-slate-600 text-xs">—</span>}
          </td>
          <td className="text-center p-1.5 md:p-2 text-slate-400 hidden lg:table-cell">{h.category || '—'}</td>
          <td className="p-1.5 md:p-2 text-right whitespace-nowrap" onClick={e => e.stopPropagation()}>
            <button onClick={() => setPosModal({ open: true, mode: 'addLot', holdingToEdit: h })} className="text-indigo-400 hover:text-indigo-300 mr-1 md:mr-2" title="Añadir compra"><i className="fa-solid fa-plus text-xs"></i></button>
            {h.type !== 'cash' && <button onClick={() => setSellModal({ open: true, holding: h })} className="text-red-400 hover:text-red-300 mr-1 md:mr-2" title="Vender FIFO"><i className="fa-solid fa-arrow-trend-down text-xs"></i></button>}
            <button onClick={() => deleteHolding(h.id)} className="text-slate-500 hover:text-red-400" title="Eliminar posición completa"><i className="fa-solid fa-trash text-xs"></i></button>
          </td>
        </tr>
        {isExpanded && (
          <tr className="bg-slate-950/50">
            <td colSpan="12" className="p-3 border-t border-slate-800">
              <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-3">
                <div className="bg-slate-900 rounded p-2">
                  <div className="text-xs text-slate-400">Días en cartera</div>
                  <div className="font-bold text-sm">{h.daysHeld} d</div>
                </div>
                <div className="bg-slate-900 rounded p-2">
                  <div className="text-xs text-slate-400">CAGR</div>
                  <div className={`font-bold text-sm ${(h.cagr || 0) >= 0 ? 'text-green-400' : 'text-red-400'}`}>{h.cagr !== null ? fmtPct(h.cagr) : '—'}</div>
                </div>
                <div className="bg-slate-900 rounded p-2">
                  <div className="text-xs text-slate-400">P/L Realizado</div>
                  <div className={`font-bold text-sm ${h.realizedPL >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtMoney(h.realizedPL, h.currency)}</div>
                </div>
                <div className="bg-slate-900 rounded p-2">
                  <div className="text-xs text-slate-400">Dividendos</div>
                  <div className="font-bold text-sm text-amber-400">{fmtMoney(h.divTotal, h.currency)}</div>
                </div>
                <div className="bg-slate-900 rounded p-2">
                  <div className="text-xs text-slate-400">YoC</div>
                  <div className="font-bold text-sm text-amber-400">{fmtPct(h.yoc)}</div>
                </div>
              </div>
              <div className="flex items-center justify-between mb-2">
                <div className="text-xs text-slate-400 uppercase tracking-wider"><i className="fa-solid fa-layer-group mr-1 text-cyan-400"></i>{h.lots.length} {h.lots.length === 1 ? 'compra' : 'compras'} consolidadas — orden FIFO</div>
                {h.lots.length > 1 && <div className="text-xs text-slate-500">Costo medio ponderado: <span className="font-mono text-slate-300">{fmtMoney(h.avgCost, h.currency)}</span></div>}
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-xs">
                  <thead className="text-slate-500">
                    <tr>
                      <th className="text-left p-1">Fecha</th>
                      <th className="text-right p-1">Cant.</th>
                      <th className="text-right p-1">Costo unit.</th>
                      <th className="text-right p-1">Comisión</th>
                      <th className="text-right p-1">Total nativo</th>
                      <th className="text-right p-1">USD</th>
                      <th className="text-right p-1">EUR</th>
                      <th className="text-right p-1">COP</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody>
                    {h.lots.map(lot => (
                      <tr key={lot.id} className="border-t border-slate-800">
                        <td className="p-1">{lot.purchaseDate}</td>
                        <td className="text-right p-1 font-mono">{fmt(lot.shares, 4)}</td>
                        <td className="text-right p-1 font-mono">{fmtMoney(lot.costBasis, h.currency)}</td>
                        <td className="text-right p-1 font-mono">{fmtMoney(lot.commission || 0, h.currency)}</td>
                        <td className="text-right p-1 font-mono">{fmtMoney(lot.shares * lot.costBasis + (lot.commission || 0), h.currency)}</td>
                        <td className="text-right p-1 font-mono text-green-400">${fmt(lot.txSnapshot?.USD || 0)}</td>
                        <td className="text-right p-1 font-mono text-blue-400">€{fmt(lot.txSnapshot?.EUR || 0)}</td>
                        <td className="text-right p-1 font-mono text-yellow-400">${fmt(lot.txSnapshot?.COP || 0, 0)}</td>
                        <td className="p-1 text-right whitespace-nowrap">
                          <button onClick={() => setPosModal({ open: true, mode: 'editLot', holdingToEdit: h, lotToEdit: lot })} className="text-slate-400 hover:text-white mr-1"><i className="fa-solid fa-pen text-xs"></i></button>
                          <button onClick={() => deleteLot(h.id, lot.id)} className="text-slate-400 hover:text-red-400"><i className="fa-solid fa-trash text-xs"></i></button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              {/* Fundamentales */}
              {h.type !== 'cash' && (
                <div className="mt-4 pt-3 border-t border-slate-800">
                  <FundamentalsGrid metrics={h.fundamental} currentPrice={h.currentPrice} />
                </div>
              )}

const SalesSection = ({ data, setData, viewCurrency }) => {
  const { showToast } = useToast();
  const [search, setSearch] = useState('');
  const [sortBy, setSortBy] = useState('date');
  const [sortDir, setSortDir] = useState('desc');
  const [yearFilter, setYearFilter] = useState('all');
  const [expanded, setExpanded] = useState({});

  const sales = data.sales || [];
  const years = useMemo(() => [...new Set(sales.map(s => s.date?.slice(0, 4)).filter(Boolean))].sort().reverse(), [sales]);

  const enriched = useMemo(() => sales.map(s => ({
    ...s,
    valueView: convert(s.shares * s.sellPrice - (s.commission || 0), s.currency, viewCurrency, data.trms),
    plView: convert(s.realizedPL_native || 0, s.currency, viewCurrency, data.trms)
  })), [sales, viewCurrency, data.trms]);

  const filtered = useMemo(() => {
    let list = enriched.filter(s => {
      if (search && !s.symbol.toLowerCase().includes(search.toLowerCase())) return false;
      if (yearFilter !== 'all' && !s.date?.startsWith(yearFilter)) return false;
      return true;
    });
    list.sort((a, b) => {
      let av, bv;
      if (sortBy === 'date') { av = a.date; bv = b.date; }
      else if (sortBy === 'symbol') { av = a.symbol; bv = b.symbol; }
      else if (sortBy === 'value') { av = a.valueView; bv = b.valueView; }
      else if (sortBy === 'pl') { av = a.plView; bv = b.plView; }
      if (typeof av === 'string') return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
      return sortDir === 'asc' ? av - bv : bv - av;
    });
    return list;
  }, [enriched, search, sortBy, sortDir, yearFilter]);

  const totals = useMemo(() => ({
    count: filtered.length,
    ingresos: filtered.reduce((s, x) => s + x.valueView, 0),
    plTotal: filtered.reduce((s, x) => s + x.plView, 0),
    ganadoras: filtered.filter(x => x.plView > 0).length,
    perdedoras: filtered.filter(x => x.plView < 0).length
  }), [filtered]);

  const deleteSale = (id) => {
    if (!confirm('¿Eliminar venta? Esto NO restaura los lotes consumidos.')) return;
    const next = { ...data, sales: data.sales.filter(s => s.id !== id) };
    setData(next); persistData(next);
    showToast('Venta eliminada', 'success');
  };

  const SortHeader = ({ field, label, align = 'left' }) => {
    const active = sortBy === field;
    return (
      <th className={`p-2 cursor-pointer hover:text-cyan-400 select-none text-${align} text-xs`} onClick={() => {
        if (active) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
        else { setSortBy(field); setSortDir('desc'); }
      }}>{label} {active && <i className={`fa-solid ${sortDir === 'asc' ? 'fa-caret-up' : 'fa-caret-down'} ml-1`}></i>}</th>
    );
  };

  return (
    <div className="space-y-3">
      <div className="grid grid-cols-2 md:grid-cols-5 gap-2">
        <div className="bg-slate-900 border border-slate-800 rounded p-3"><div className="text-xs text-slate-400">Ventas</div><div className="text-lg font-bold">{totals.count}</div></div>
        <div className="bg-slate-900 border border-slate-800 rounded p-3"><div className="text-xs text-slate-400">Ingresos</div><div className="text-lg font-bold">{fmtMoney(totals.ingresos, viewCurrency)}</div></div>
        <div className="bg-slate-900 border border-slate-800 rounded p-3"><div className="text-xs text-slate-400">P/L Realizado</div><div className={`text-lg font-bold ${totals.plTotal >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtMoney(totals.plTotal, viewCurrency)}</div></div>
        <div className="bg-slate-900 border border-slate-800 rounded p-3"><div className="text-xs text-slate-400">Ganadoras</div><div className="text-lg font-bold text-green-400">{totals.ganadoras}</div></div>
        <div className="bg-slate-900 border border-slate-800 rounded p-3"><div className="text-xs text-slate-400">Perdedoras</div><div className="text-lg font-bold text-red-400">{totals.perdedoras}</div></div>
      </div>

      <div className="flex flex-wrap gap-2 items-center">
        <div className="flex-1 min-w-[200px] relative">
          <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Buscar símbolo..." className="w-full bg-slate-900 border border-slate-700 rounded pl-8 pr-3 py-1.5 text-sm" />
        </div>
        <select value={yearFilter} onChange={e => setYearFilter(e.target.value)} className="bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm">
          <option value="all">Todos los años</option>
          {years.map(y => <option key={y}>{y}</option>)}
        </select>
        <button onClick={() => exportLedgerCSV(data, 'sales')} className="bg-purple-600 hover:bg-purple-500 px-3 py-1.5 rounded text-sm">
          <i className="fa-solid fa-file-csv mr-1"></i>Exportar CSV
        </button>
      </div>

      <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="sticky-th">
            <tr className="text-slate-400">
              <th className="w-8"></th>
              <SortHeader field="date" label="Fecha" />
              <SortHeader field="symbol" label="Símbolo" />
              <th className="text-right p-2 text-xs">Cant.</th>
              <th className="text-right p-2 text-xs">Precio</th>
              <SortHeader field="value" label={`Ingreso (${viewCurrency})`} align="right" />
              <SortHeader field="pl" label={`P/L (${viewCurrency})`} align="right" />
              <th className="text-right p-2 text-xs">USD</th>
              <th className="text-right p-2 text-xs">EUR</th>
              <th className="text-right p-2 text-xs">COP</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(s => (
              <React.Fragment key={s.id}>
                <tr className="border-t border-slate-800 hover:bg-slate-800/30 cursor-pointer" onClick={() => setExpanded(e => ({ ...e, [s.id]: !e[s.id] }))}>
                  <td className="p-2 w-8 text-center"><i className={`fa-solid ${expanded[s.id] ? 'fa-chevron-down' : 'fa-chevron-right'} text-slate-400 text-xs`}></i></td>
                  <td className="p-2">{s.date}</td>
                  <td className="p-2 font-bold">{s.symbol}</td>
                  <td className="text-right p-2 font-mono text-xs">{fmt(s.shares, 4)}</td>
                  <td className="text-right p-2 font-mono text-xs">{fmtMoney(s.sellPrice, s.currency)}</td>
                  <td className="text-right p-2 font-mono">{fmtMoney(s.valueView, viewCurrency)}</td>
                  <td className={`text-right p-2 font-mono ${s.plView >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtMoney(s.plView, viewCurrency)}</td>
                  <td className="text-right p-2 font-mono text-xs text-green-400">${fmt(s.txSnapshot?.USD || 0)}</td>
                  <td className="text-right p-2 font-mono text-xs text-blue-400">€{fmt(s.txSnapshot?.EUR || 0)}</td>
                  <td className="text-right p-2 font-mono text-xs text-yellow-400">${fmt(s.txSnapshot?.COP || 0, 0)}</td>
                  <td className="p-2 text-right" onClick={e => e.stopPropagation()}>
                    <button onClick={() => deleteSale(s.id)} className="text-slate-400 hover:text-red-400"><i className="fa-solid fa-trash text-xs"></i></button>
                  </td>
                </tr>
                {expanded[s.id] && (
                  <tr className="bg-slate-950/50">
                    <td colSpan="11" className="p-3 border-t border-slate-800">
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-2 text-xs">
                        <div><span className="text-slate-400">Costo medio FIFO:</span> <span className="font-mono">{fmtMoney(s.avgCostBasis, s.currency)}</span></div>
                        <div><span className="text-slate-400">Comisión:</span> <span className="font-mono">{fmtMoney(s.commission, s.currency)}</span></div>
                        <div><span className="text-slate-400">TRM USD/COP:</span> <span className="font-mono">{fmt(s.txTrms?.USD || 0, 2)}</span></div>
                        <div><span className="text-slate-400">TRM EUR/COP:</span> <span className="font-mono">{fmt(s.txTrms?.EUR || 0, 2)}</span></div>
                      </div>
                      {s.fifoConsumed && s.fifoConsumed.length > 0 && (
                        <div>

                          <table className="w-full text-xs">
                            <thead className="text-slate-500"><tr><th className="text-left p-1">Lote (fecha)</th><th className="text-right p-1">Cant.</th><th className="text-right p-1">Costo unit.</th><th className="text-right p-1">Costo total</th></tr></thead>
                            <tbody>
                              {s.fifoConsumed.map((c, i) => (
                                <tr key={i} className="border-t border-slate-800">
                                  <td className="p-1">{c.purchaseDate}</td>
                                  <td className="text-right p-1 font-mono">{fmt(c.shares, 4)}</td>
                                  <td className="text-right p-1 font-mono">{fmtMoney(c.costBasis, s.currency)}</td>
                                  <td className="text-right p-1 font-mono">{fmtMoney(c.lotCost, s.currency)}</td>

                      {s.notes && <div className="text-xs text-slate-400 mt-2"><i className="fa-solid fa-note-sticky mr-1"></i>{s.notes}</div>}
                    </td>
                  </tr>
                )}
              </React.Fragment>
            ))}
            {filtered.length === 0 && <tr><td colSpan="11" className="p-8 text-center text-slate-500 text-sm">{sales.length === 0 ? 'Sin ventas registradas.' : 'Sin resultados.'}</td></tr>}

  );

    ...d,
    valueView: convert(d.amount, d.currency, viewCurrency, data.trms)
  })), [divs, viewCurrency, data.trms]);

  const filtered = useMemo(() => {
    let list = enriched.filter(d => {
      if (search && !d.symbol.toLowerCase().includes(search.toLowerCase())) return false;
      if (yearFilter !== 'all' && !d.date?.startsWith(yearFilter)) return false;
      return true;
    });
    list.sort((a, b) => {

    });
    return list;

        </div>

      <DividendModal open={modal.open} onClose={() => setModal({ open: false })} onSave={handleSave} dividendToEdit={modal.dividendToEdit} currentTrms={data.trms} />

  );

   ============================================================ */
const OverviewSection = ({ data, viewCurrency, snapshots }) => {
  const [tmMode] = useState('day'); /* solo % día según elección */

  const enriched = useMemo(() => {
    const realHoldings = data.holdings.filter(h => !isPseudoCashOrEmpty(h));
    const totalValueView = realHoldings.reduce((s, h) => s + convert(h.shares * (h.currentPrice || h.costBasis), h.currency, viewCurrency, data.trms), 0);
    return realHoldings.map(h => {
      const lots = h.lots || [{ shares: h.shares, costBasis: h.costBasis, commission: h.commission || 0, purchaseDate: h.purchaseDate }];
      const totalCostNative = lots.reduce((s, l) => s + l.shares * l.costBasis + (l.commission || 0), 0);
      const valueNative = h.shares * (h.currentPrice || h.costBasis);
      const plPct = totalCostNative ? ((valueNative - totalCostNative) / totalCostNative) * 100 : 0;
      const oldest = lots.reduce((min, l) => !min || (l.purchaseDate || '') < (min.purchaseDate || min) ? l : min, null);
      const days = oldest?.purchaseDate ? daysBetween(oldest.purchaseDate, new Date()) : 0;
      const cagr = calcCAGR(totalCostNative, valueNative, days);
      const value = convert(valueNative, h.currency, viewCurrency, data.trms);
      return {
        symbol: h.symbol,
        value,
        weight: totalValueView > 0 ? value / totalValueView : 0,
        changePct: h.dayChangePct || 0,
        plPct,
        cagr,
        category: h.category
      };
    });
  }, [data, viewCurrency]);

  /* Métricas globales */
  const kpis = useMemo(() => {
    /* Filtrar pseudo-cash y holdings vacíos para que no distorsionen KPIs */
    const realHoldings = data.holdings.filter(h => !isPseudoCashOrEmpty(h));
    let invested = 0, current = 0;
    realHoldings.forEach(h => {
      const lots = h.lots || [{ shares: h.shares, costBasis: h.costBasis, commission: h.commission || 0 }];
      const totalCost = lots.reduce((s, l) => s + l.shares * l.costBasis + (l.commission || 0), 0);
      invested += convert(totalCost, h.currency, viewCurrency, data.trms);
      current += convert(h.shares * (h.currentPrice || h.costBasis), h.currency, viewCurrency, data.trms);
    });
    const realizedPL = (data.sales || []).reduce((s, sale) => s + convert(sale.realizedPL_native || 0, sale.currency, viewCurrency, data.trms), 0);
    const totalDivs = (data.dividends || []).reduce((s, d) => s + convert(d.amount, d.currency, viewCurrency, data.trms), 0);

    /* MWR via XIRR */
    const cashflows = [];
    realHoldings.forEach(h => {
      (h.lots || []).forEach(lot => {
        const total = lot.shares * lot.costBasis + (lot.commission || 0);
        cashflows.push({ date: lot.purchaseDate, amount: -convert(total, h.currency, viewCurrency, data.trms) });
      });
    });
    (data.sales || []).forEach(s => {
      cashflows.push({ date: s.date, amount: convert(s.shares * s.sellPrice - (s.commission || 0), s.currency, viewCurrency, data.trms) });
    });
    (data.dividends || []).forEach(d => {
      cashflows.push({ date: d.date, amount: convert(d.amount, d.currency, viewCurrency, data.trms) });
    });
    /* Valor final como cashflow positivo de hoy */
    if (current > 0) cashflows.push({ date: new Date().toISOString().split('T')[0], amount: current });
    cashflows.sort((a, b) => a.date.localeCompare(b.date));
    const mwr = cashflows.length >= 2 ? xirr(cashflows) : null;

    /* Drawdown desde snapshots */
    let maxDD = 0, peak = -Infinity;
    const snapKey = viewCurrency === 'USD' ? 'valueUSD' : viewCurrency === 'EUR' ? 'valueEUR' : 'valueCOP';
    snapshots.forEach(s => {
      const v = s[snapKey];
      if (v > peak) peak = v;
      const dd = peak > 0 ? ((v - peak) / peak) * 100 : 0;
      if (dd < maxDD) maxDD = dd;
    });

    /* CAGR consolidado buy-and-hold del portafolio:
       (Valor actual + ingresos por ventas + dividendos) / Inversión total inicial,
       desde la fecha de la primera compra. Captura toda la rentabilidad acumulada. */
    let earliestDate = null;
    realHoldings.forEach(h => {
      (h.lots || []).forEach(lot => {
        if (lot.purchaseDate && (!earliestDate || lot.purchaseDate < earliestDate)) earliestDate = lot.purchaseDate;
      });
    });
    const totalReturn = current + (data.sales || []).reduce((s, sale) => s + convert(sale.shares * sale.sellPrice - (sale.commission || 0), sale.currency, viewCurrency, data.trms), 0) + totalDivs;
    const daysSinceStart = earliestDate ? daysBetween(earliestDate, new Date()) : 0;
    const cagrPortfolio = invested > 0 && daysSinceStart > 30 ? calcCAGR(invested, totalReturn, daysSinceStart) : null;

    return { invested, current, plLatent: current - invested, plPct: invested ? ((current - invested) / invested) * 100 : 0, realizedPL, totalDivs, mwr, maxDD, cagrPortfolio, daysSinceStart, earliestDate };
  }, [data, viewCurrency, snapshots]);

  /* Datos para gráfico lineal */
  const chartData = useMemo(() => {
    const snapKey = viewCurrency === 'USD' ? 'valueUSD' : viewCurrency === 'EUR' ? 'valueEUR' : 'valueCOP';
    return snapshots.map(s => ({ date: s.date, value: s[snapKey] || 0 })).sort((a, b) => a.date.localeCompare(b.date));
  }, [snapshots, viewCurrency]);

  return (
    <div className="space-y-4">
      {/* CAGR consolidado destacado en card grande aparte */}
      <div className="bg-gradient-to-br from-indigo-950/60 to-purple-950/40 border border-indigo-700/40 rounded-xl p-4">
        <div className="flex items-center justify-between flex-wrap gap-3">
          <div className="flex items-center gap-3">
            <div className="bg-indigo-600/30 rounded-lg w-12 h-12 flex items-center justify-center">
              <i className="fa-solid fa-chart-line text-2xl text-indigo-300"></i>
            </div>
            <div>
              <div className="text-xs text-indigo-300 uppercase tracking-wider font-bold">CAGR Consolidado del Portafolio</div>
              <div className="text-xs text-slate-400">Rentabilidad anualizada buy-and-hold desde {kpis.earliestDate || '—'} · {kpis.daysSinceStart} días</div>
            </div>
          </div>
          <div className="text-right">
            {kpis.cagrPortfolio !== null ? (
              <>
                <div className={`text-3xl font-bold ${kpis.cagrPortfolio >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtPct(kpis.cagrPortfolio)}</div>
                <div className="text-xs text-slate-400">anualizado · incluye dividendos y ventas</div>
              </>
            ) : (
              <div className="text-2xl font-bold text-slate-500">— <span className="text-xs">(necesita &gt;30 días)</span></div>
            )}
          </div>
        </div>
      </div>

      {/* KPIs ampliados - más compactos en móvil */}
      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-7 gap-1.5 md:gap-2">
        <div className="bg-slate-900 border border-slate-800 rounded-lg p-2 md:p-3"><div className="text-[10px] md:text-xs text-slate-400">Invertido</div><div className="text-sm md:text-base font-bold truncate">{fmtMoney(kpis.invested, viewCurrency)}</div></div>
        <div className="bg-slate-900 border border-slate-800 rounded-lg p-2 md:p-3"><div className="text-[10px] md:text-xs text-slate-400">Valor actual</div><div className="text-sm md:text-base font-bold truncate">{fmtMoney(kpis.current, viewCurrency)}</div></div>
        <div className="bg-slate-900 border border-slate-800 rounded-lg p-2 md:p-3"><div className="text-[10px] md:text-xs text-slate-400">P/L Latente</div><div className={`text-sm md:text-base font-bold truncate ${kpis.plLatent >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtMoney(kpis.plLatent, viewCurrency)}</div></div>
        <div className="bg-slate-900 border border-slate-800 rounded-lg p-2 md:p-3"><div className="text-[10px] md:text-xs text-slate-400">% Rentab.</div><div className={`text-sm md:text-base font-bold ${kpis.plPct >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtPct(kpis.plPct)}</div></div>
        <div className="bg-slate-900 border border-slate-800 rounded-lg p-2 md:p-3"><div className="text-[10px] md:text-xs text-slate-400">P/L Realizado</div><div className={`text-sm md:text-base font-bold truncate ${kpis.realizedPL >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtMoney(kpis.realizedPL, viewCurrency)}</div></div>
        <div className="bg-slate-900 border border-slate-800 rounded-lg p-2 md:p-3"><div className="text-[10px] md:text-xs text-slate-400">Dividendos</div><div className="text-sm md:text-base font-bold text-amber-400 truncate">{fmtMoney(kpis.totalDivs, viewCurrency)}</div></div>
        <div className="bg-slate-900 border border-slate-800 rounded-lg p-2 md:p-3 col-span-2 sm:col-span-1"><div className="text-[10px] md:text-xs text-slate-400" title="Money-Weighted Return (XIRR)">MWR / IRR</div><div className={`text-sm md:text-base font-bold ${(kpis.mwr || 0) >= 0 ? 'text-green-400' : 'text-red-400'}`}>{kpis.mwr !== null ? fmtPct(kpis.mwr) : '—'}</div></div>
      </div>

      {/* Drawdown info */}
      {kpis.maxDD < 0 && (
        <div className="bg-red-950/20 border border-red-800/50 rounded p-2 text-xs">
          <i className="fa-solid fa-arrow-trend-down text-red-400 mr-1"></i>
          Drawdown máximo histórico: <span className="text-red-400 font-bold">{fmtPct(kpis.maxDD)}</span> · {snapshots.length} snapshots
        </div>
      )}

      {/* Evolución */}
      <div className="bg-slate-900 border border-slate-800 rounded-xl p-3">
        <div className="text-xs text-slate-400 uppercase tracking-wider mb-2"><i className="fa-solid fa-chart-line mr-1"></i>Evolución patrimonio ({viewCurrency})</div>
        <LineChart data={chartData} />
      </div>

      {/* Treemap */}
      <div className="bg-slate-900 border border-slate-800 rounded-xl p-3">
        <div className="text-xs text-slate-400 uppercase tracking-wider mb-2"><i className="fa-solid fa-table-cells-large mr-1"></i>Mapa de árbol (tamaño por valor · color por % día)</div>
        <Treemap items={enriched} height={460} viewCurrency={viewCurrency} />
      </div>
    </div>
  );
};

const MarketPulseTab = ({ data, finnhubKey }) => {
  const { showToast } = useToast();
  const [quotes, setQuotes] = useState({});
  const [sparks, setSparks] = useState({});
  const [macroData, setMacroData] = useState({});
  const [earnings, setEarnings] = useState([]);
  const [loading, setLoading] = useState(false);
  const [lastUpdate, setLastUpdate] = useState(null);

  const symbols = useMemo(() => [...new Set(data.holdings.filter(h => !isPseudoCashOrEmpty(h)).map(h => h.symbol))], [data]);

  const loadAll = async () => {
    if (!finnhubKey) { showToast('Falta Finnhub key', 'error'); return; }
    setLoading(true);
    const newQ = {}, newS = {};
    for (const sym of symbols) {
      try {
        const [q, c] = await Promise.all([finnhub.quote(sym, finnhubKey), finnhub.candles(sym, finnhubKey, 'D', 30)]);
        if (q.c > 0) newQ[sym] = q;
        if (c.s === 'ok' && c.c) newS[sym] = c.c;
        await new Promise(r => setTimeout(r, 80));
      } catch (e) { console.warn(sym); }
    }
    setQuotes(newQ); setSparks(newS);

    const [vix, dxy, us10y, gold, eurusd, btc] = await Promise.all([
      macro.fetchStooq('^vix'), macro.fetchStooq('dx.f'), macro.fetchStooq('10usy.b'),
      macro.fetchStooq('xauusd'), macro.fetchStooq('eurusd'), macro.btc()
    ]);
    setMacroData({ vix, dxy, us10y, gold, eurusd, btc });

    try {
      const e = await finnhub.earnings(finnhubKey, 30);
      setEarnings((e.earningsCalendar || []).filter(x => symbols.includes(x.symbol)).sort((a, b) => a.date.localeCompare(b.date)));
    } catch (e) { /* */ }

    setLastUpdate(new Date());
    setLoading(false);
    showToast('Market Pulse actualizado', 'success');
  };

  useEffect(() => { if (symbols.length && finnhubKey) loadAll(); /* eslint-disable-next-line */ }, []);

  const MacroCard = ({ label, value, unit = '' }) => {
    if (!value) return <div className="bg-slate-900 border border-slate-800 rounded-lg p-3"><div className="text-xs text-slate-400">{label}</div><div className="text-slate-600">—</div></div>;
    return (
      <div className="bg-slate-900 border border-slate-800 rounded-lg p-3">
        <div className="text-xs text-slate-400">{label}</div>
        <div className="text-lg font-bold">{fmt(value.close)}{unit}</div>
        <div className={`text-xs font-mono ${value.changePct >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtPct(value.changePct)}</div>
      </div>
    );
  };

  return (
    <div className="space-y-4">
      <div className="flex justify-between items-center flex-wrap gap-2">
        <div className="flex items-center gap-3">
          <h2 className="text-lg font-bold"><i className="fa-solid fa-wave-square text-cyan-400 mr-2"></i>Market Pulse</h2>
          {lastUpdate && <span className="text-xs text-slate-500"><span className="pulse-dot inline-block w-2 h-2 rounded-full bg-green-500 mr-1"></span>{lastUpdate.toLocaleTimeString('es-ES')}</span>}
        </div>
        <button onClick={loadAll} disabled={loading} className="bg-cyan-600 hover:bg-cyan-500 disabled:opacity-50 px-3 py-1.5 rounded text-sm">
          <i className={`fa-solid fa-rotate ${loading ? 'fa-spin' : ''} mr-1`}></i>Actualizar
        </button>
      </div>

      <div>
        <div className="text-xs text-slate-400 mb-2 uppercase tracking-wider">Macro</div>
        <div className="grid grid-cols-3 md:grid-cols-6 gap-2">
          <MacroCard label="VIX" value={macroData.vix} />
          <MacroCard label="DXY" value={macroData.dxy} />
          <MacroCard label="US10Y" value={macroData.us10y} unit="%" />
          <MacroCard label="Oro" value={macroData.gold} />
          <MacroCard label="EUR/USD" value={macroData.eurusd} />
          <MacroCard label="BTC" value={macroData.btc} />
        </div>
      </div>

      <div>
        <div className="text-xs text-slate-400 mb-2 uppercase tracking-wider">Tickers</div>
        <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-slate-800 text-xs text-slate-400">
              <tr><th className="text-left p-2">Símbolo</th><th className="text-right p-2">Precio</th><th className="text-right p-2">% Día</th><th className="text-right p-2">H/L</th><th className="text-center p-2">30D</th></tr>
            </thead>
            <tbody>
              {symbols.map(sym => {
                const q = quotes[sym];
                return (
                  <tr key={sym} className="border-t border-slate-800 hover:bg-slate-800/30">
                    <td className="p-2 font-bold">{sym}</td>
                    <td className="text-right p-2 font-mono">{q ? fmt(q.c) : '—'}</td>
                    <td className={`text-right p-2 font-mono ${q && q.dp >= 0 ? 'text-green-400' : 'text-red-400'}`}>{q ? fmtPct(q.dp) : '—'}</td>
                    <td className="text-right p-2 font-mono text-xs text-slate-400">{q ? `${fmt(q.h)}/${fmt(q.l)}` : '—'}</td>

                  <td className="text-right p-2 font-mono">{e.epsEstimate ? fmt(e.epsEstimate) : '—'}</td>
                  <td className="text-right p-2 font-mono">{e.revenueEstimate ? fmt(e.revenueEstimate / 1e6, 0) : '—'}</td>
                </tr>
              ))}
              {earnings.length === 0 && <tr><td colSpan="5" className="p-6 text-center text-slate-500 text-sm">Sin earnings programados.</td></tr>}

          </table>

    </div>
  );
};

/* ============================================================
   NEWS TAB (sin cambios sustanciales vs v2.1)
   ============================================================ */
const NewsTab = ({ data, finnhubKey, claudeKey }) => {
  const { showToast } = useToast();
  const [news, setNews] = useState([]);
  const [loading, setLoading] = useState(false);
  const [classifying, setClassifying] = useState(false);
  const [filter, setFilter] = useState('all');
  const [symbolFilter, setSymbolFilter] = useState('all');

  const symbols = useMemo(() => [...new Set(data.holdings.filter(h => !isPseudoCashOrEmpty(h)).map(h => h.symbol))], [data]);

  const loadNews = async () => {
    if (!finnhubKey) { showToast('Falta Finnhub key', 'error'); return; }
    setLoading(true);
    const all = [];
    for (const sym of symbols) {
      try {
        const items = await finnhub.news(sym, finnhubKey);
        items.slice(0, 5).forEach(n => all.push({ ...n, symbol: sym, _id: `${sym}_${n.id}` }));
        await new Promise(r => setTimeout(r, 80));
      } catch (e) { }
    }
    all.sort((a, b) => b.datetime - a.datetime);
    setNews(all);
    setLoading(false);
    showToast(`${all.length} noticias`, 'success');
  };

  const classify = async () => {
    if (!claudeKey) { showToast('Falta Claude key', 'error'); return; }
    if (!news.length) { showToast('Carga noticias primero', 'error'); return; }
    setClassifying(true);
    try {
      const batches = [];
      for (let i = 0; i < news.length; i += 10) batches.push(news.slice(i, i + 10));
      const enriched = [...news];
      let idx = 0;
      for (const batch of batches) {
        const results = await claudeApi.classifyNews(claudeKey, batch.map(n => ({ symbol: n.symbol, headline: n.headline, summary: n.summary })));
        results.forEach((r, j) => { enriched[idx + j] = { ...enriched[idx + j], ...r }; });
        idx += batch.length;
        setNews([...enriched]);
      }
      showToast('Clasificación completa', 'success');
    } catch (e) { showToast(`Error: ${e.message}`, 'error'); }
    setClassifying(false);
  };

  const filtered = useMemo(() => news.filter(n => {
    if (filter !== 'all' && n.impact !== filter) return false;
    if (symbolFilter !== 'all' && n.symbol !== symbolFilter) return false;
    return true;
  }), [news, filter, symbolFilter]);

  const counts = useMemo(() => ({
    red: news.filter(n => n.impact === 'red').length,
    yellow: news.filter(n => n.impact === 'yellow').length,
    white: news.filter(n => n.impact === 'white').length
  }), [news]);

  return (
    <div className="space-y-3">
      <div className="flex flex-wrap justify-between items-center gap-2">
        <h2 className="text-lg font-bold"><i className="fa-solid fa-newspaper text-amber-400 mr-2"></i>News & Catalysts</h2>
        <div className="flex gap-2 flex-wrap">
          <button onClick={loadNews} disabled={loading} className="bg-cyan-600 hover:bg-cyan-500 disabled:opacity-50 px-3 py-1.5 rounded text-sm">
            <i className={`fa-solid fa-download ${loading ? 'fa-spin' : ''} mr-1`}></i>Cargar
          </button>
          <button onClick={classify} disabled={classifying || !news.length} className="bg-purple-600 hover:bg-purple-500 disabled:opacity-50 px-3 py-1.5 rounded text-sm">
            <i className={`fa-solid fa-brain ${classifying ? 'fa-spin' : ''} mr-1`}></i>Clasificar IA
          </button>
        </div>
      </div>

      <div className="flex flex-wrap gap-2 items-center text-xs">
        {['all', 'red', 'yellow', 'white'].map(f => (
          <button key={f} onClick={() => setFilter(f)} className={`px-2 py-1 rounded ${filter === f ? 'bg-white text-slate-900' : 'bg-slate-800 text-slate-300'}`}>
            {f === 'all' ? `Todas (${news.length})` : f === 'red' ? `🔴 ${counts.red}` : f === 'yellow' ? `🟡 ${counts.yellow}` : `⚪ ${counts.white}`}
          </button>
        ))}
        <select value={symbolFilter} onChange={e => setSymbolFilter(e.target.value)} className="bg-slate-800 border border-slate-700 rounded p-1">
          <option value="all">Todos los símbolos</option>
          {symbols.map(s => <option key={s}>{s}</option>)}
        </select>
      </div>

      <div className="space-y-2">
        {filtered.map(n => {
          const ic = n.impact === 'red' ? 'border-red-500/50 bg-red-950/20' : n.impact === 'yellow' ? 'border-yellow-500/50 bg-yellow-950/10' : n.impact === 'white' ? 'border-slate-700' : 'border-slate-800';
          const dir = n.direction === 'bullish' ? '📈' : n.direction === 'bearish' ? '📉' : n.direction === 'neutral' ? '➖' : '';
          return (
            <a key={n._id} href={n.url} target="_blank" rel="noopener noreferrer" className={`block border ${ic} bg-slate-900/50 rounded-lg p-3 hover:border-cyan-500/50 transition-all`}>
              <div className="flex justify-between items-start gap-3 mb-1">
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="font-bold text-cyan-400 text-sm">{n.symbol}</span>
                  {n.impact && <span className="text-xs">{n.impact === 'red' ? '🔴' : n.impact === 'yellow' ? '🟡' : '⚪'}</span>}
                  {dir && <span className="text-xs">{dir}</span>}
                  <span className="text-xs text-slate-500">{new Date(n.datetime * 1000).toLocaleString('es-ES', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}</span>
                </div>
                <span className="text-xs text-slate-500">{n.source}</span>
              </div>
              <div className="text-sm text-white mb-1">{n.headline}</div>
              {n.reasoning && <div className="text-xs text-purple-300 mt-2 italic"><i className="fa-solid fa-brain mr-1"></i>{n.reasoning}</div>}
              {!n.reasoning && n.summary && <div className="text-xs text-slate-400 mt-1 line-clamp-2">{n.summary.slice(0, 200)}</div>}
            </a>
          );
        })}
        {filtered.length === 0 && <div className="text-center text-slate-500 py-12 text-sm">{news.length === 0 ? 'Pulsa "Cargar".' : 'Sin resultados.'}</div>}
      </div>
    </div>
  );
};

/* ============================================================
   APP ROOT
   ============================================================ */
const App = () => {
  const [data, setData] = useState(loadData);
  const [snapshots, setSnapshots] = useState(loadSnapshots);
  const [fundamentals, setFundamentals] = useState(loadFundamentals);
  const [tab, setTab] = useState('portfolio');
  const [finnhubKey, setFinnhubKey] = useState(() => localStorage.getItem(FINNHUB_KEY_STORE) || '');
  const [claudeKey, setClaudeKey] = useState(() => localStorage.getItem(CLAUDE_KEY_STORE) || '');
  const [showSettings, setShowSettings] = useState(false);
  const [importDialog, setImportDialog] = useState({ open: false });
  const [hidden, setHidden] = useState(() => localStorage.getItem('privacy_hidden') === 'true');
  const fileInputRef = useRef(null);

  /* ===== Google Drive sync states ===== */
  const [gdriveReady, setGdriveReady] = useState(false); /* SDK cargado */
  const [gdriveConnected, setGdriveConnected] = useState(false); /* token activo */
  const [gdriveStatus, setGdriveStatus] = useState('idle'); /* idle | syncing | synced | error */
  const [gdriveLastSync, setGdriveLastSync] = useState(() => localStorage.getItem('gdrive_last_sync') || null);
  const [gdriveError, setGdriveError] = useState(null);
  const [gdriveAutoSync, setGdriveAutoSync] = useState(() => localStorage.getItem('gdrive_autosync') === 'true');
  const syncTimerRef = useRef(null);

  /* Esperar a que el SDK de Google cargue */
  useEffect(() => {
    let attempts = 0;
    const checkSDK = setInterval(() => {
      attempts++;
      if (window.google?.accounts?.oauth2) {
        const ok = gdrive.initTokenClient((token, err) => {
          if (err) {
            setGdriveError('Error de autorización: ' + err);
            setGdriveConnected(false);
            setGdriveStatus('error');
            return;
          }
          setGdriveConnected(true);
          setGdriveError(null);
          /* Tras conectar, hacer pull inicial */
          gdrivePull();
        });
        if (ok) { setGdriveReady(true); clearInterval(checkSDK); }
      }
      if (attempts > 40) clearInterval(checkSDK); /* timeout ~20s */
    }, 500);
    return () => clearInterval(checkSDK);
  // eslint-disable-next-line
  }, []);

  /* Conectar a Drive (dispara popup OAuth) */
  const gdriveConnect = () => {
    setGdriveError(null);
    setGdriveStatus('syncing');
    gdrive.requestAuth(true);
  };

  /* Desconectar */
  const gdriveDisconnect = () => {
    gdrive.signOut();
    setGdriveConnected(false);
    setGdriveStatus('idle');
    localStorage.setItem('gdrive_autosync', 'false');
    setGdriveAutoSync(false);
  };

  /* PUSH: subir datos locales a Drive */
  const gdrivePush = async () => {
    if (!gdrive.accessToken) { setGdriveError('No conectado a Drive'); return; }
    setGdriveStatus('syncing');
    try {
      const payload = {
        appVersion: APP_VERSION,
        savedAt: new Date().toISOString(),
        data,
        snapshots: loadSnapshots(),
        fundamentals: loadFundamentals()
      };
      await gdrive.writeFile(payload);
      const ts = new Date().toISOString();
      localStorage.setItem('gdrive_last_sync', ts);
      setGdriveLastSync(ts);
      setGdriveStatus('synced');
      setGdriveError(null);
    } catch (e) {
      setGdriveStatus('error');
      setGdriveError(e.message);
    }
  };

  /* PULL: descargar datos de Drive y aplicarlos */
  const gdrivePull = async () => {
    if (!gdrive.accessToken) return;
    setGdriveStatus('syncing');
    try {
      const remote = await gdrive.readFile();
      if (!remote || !remote.data) {
        /* No hay archivo en Drive aún: subimos el local como primer estado */
        await gdrivePush();
        return;
      }
      /* Resolución de conflicto: comparar timestamps */
      const remoteTime = new Date(remote.savedAt || 0).getTime();
      const localSyncTime = localStorage.getItem('gdrive_last_sync')
        ? new Date(localStorage.getItem('gdrive_last_sync')).getTime() : 0;

      const applyRemote = () => {
        if (remote.data) { setData(remote.data); persistData(remote.data); }
        if (remote.snapshots) { persistSnapshots(remote.snapshots); setSnapshots(remote.snapshots); }
        if (remote.fundamentals) { persistFundamentals(remote.fundamentals); setFundamentals(remote.fundamentals); }
        const ts = new Date().toISOString();
        localStorage.setItem('gdrive_last_sync', ts);
        setGdriveLastSync(ts);
        setGdriveStatus('synced');
      };

      if (remoteTime > localSyncTime) {
        /* Drive tiene datos más nuevos */
        const localHoldings = data.holdings?.length || 0;
        const remoteHoldings = remote.data.holdings?.length || 0;
        if (localHoldings > 0 && localHoldings !== remoteHoldings) {
          /* Posible conflicto: preguntar */
          if (confirm(`Google Drive tiene una versión más reciente (${remoteHoldings} posiciones) que la local (${localHoldings} posiciones).\n\n¿Cargar la versión de Drive? (Cancelar = mantener la local y subirla)`)) {
            applyRemote();
          } else {
            await gdrivePush();
          }
        } else {
          applyRemote();
        }
      } else {
        /* Local es igual o más nuevo: subir local */
        await gdrivePush();
      }
    } catch (e) {
      setGdriveStatus('error');
      setGdriveError(e.message);
    }
  };

  /* Auto-sync: si está activo, push 3s después de cada cambio en data */
  useEffect(() => {
    if (!gdriveAutoSync || !gdriveConnected) return;
    if (syncTimerRef.current) clearTimeout(syncTimerRef.current);
    syncTimerRef.current = setTimeout(() => { gdrivePush(); }, 3000);
    return () => { if (syncTimerRef.current) clearTimeout(syncTimerRef.current); };
  // eslint-disable-next-line
  }, [data, snapshots, fundamentals, gdriveAutoSync, gdriveConnected]);

  const toggleAutoSync = () => {
    setGdriveAutoSync(v => {
      const next = !v;
      localStorage.setItem('gdrive_autosync', String(next));
      return next;
    });
  };


  const toggleHidden = () => {
    setHidden(h => {
      const next = !h;
      localStorage.setItem('privacy_hidden', String(next));
      window.__privacy_hidden = next;
      return next;
    });
  };

  /* Inicializar flag global al cargar */
  useEffect(() => { window.__privacy_hidden = hidden; }, [hidden]);

  /* Sync snapshots desde localStorage cuando cambian */
  useEffect(() => {
    const id = setInterval(() => {
      const s = loadSnapshots();
      if (JSON.stringify(s) !== JSON.stringify(snapshots)) setSnapshots(s);
    }, 2000);
    return () => clearInterval(id);
  }, [snapshots]);

  useEffect(() => { localStorage.setItem(FINNHUB_KEY_STORE, finnhubKey); }, [finnhubKey]);
  useEffect(() => { localStorage.setItem(CLAUDE_KEY_STORE, claudeKey); }, [claudeKey]);

  useEffect(() => {
    const last = localStorage.getItem(LAST_BACKUP_STORE);
    if (data.holdings.length === 0) return;
    if (!last) { localStorage.setItem(LAST_BACKUP_STORE, new Date().toISOString()); return; }
    const days = (Date.now() - new Date(last).getTime()) / 86400000;
    if (days > 7) {
      setTimeout(() => {
        if (confirm(`Han pasado ${Math.floor(days)} días sin backup. ¿Descargar?`)) downloadBackup(data);
        else localStorage.setItem(LAST_BACKUP_STORE, new Date().toISOString());
      }, 2000);
    }
  }, []);

  const updateTrm = (cur, val) => {
    const next = { ...data, trms: { ...data.trms, [cur]: parseFloat(val) || 0 } };
    setData(next); persistData(next);
  };

  const [fxRefreshing, setFxRefreshing] = useState(false);
  const [fxLastUpdate, setFxLastUpdate] = useState(() => localStorage.getItem('fx_last_update') || null);
  const [fxSource, setFxSource] = useState(() => localStorage.getItem('fx_source') || null);
  const [fxStatus, setFxStatus] = useState(null); /* { ok, msg, date } */

  const refreshFX = async (silent = false) => {
    setFxRefreshing(true);
    setFxStatus(null);
    const rates = await fxRates.fetchCOP();
    if (rates && rates.USD && rates.EUR) {
      const next = { ...data, trms: { USD: Math.round(rates.USD * 100) / 100, EUR: Math.round(rates.EUR * 100) / 100 } };
      setData(next); persistData(next);
      const ts = new Date().toISOString();
      localStorage.setItem('fx_last_update', ts);
      localStorage.setItem('fx_source', rates.source);
      setFxLastUpdate(ts); setFxSource(rates.source);
      if (!silent) setFxStatus({ ok: true, msg: `TRMs actualizadas desde ${rates.source} (${rates.date})`, date: rates.date });
    } else if (!silent) {
      setFxStatus({ ok: false, msg: 'No se pudieron obtener TRMs (sin internet o API no disponible)' });
    }
    setFxRefreshing(false);
    setTimeout(() => setFxStatus(null), 4000);
  };

  /* Auto-fetch TRMs al cargar si llevan más de 6h sin actualizar */
  useEffect(() => {
    const last = localStorage.getItem('fx_last_update');
    const hoursAgo = last ? (Date.now() - new Date(last).getTime()) / 3600000 : 999;
    if (hoursAgo > 6) {
      setTimeout(() => refreshFX(true), 1000);
    }
  // eslint-disable-next-line
  }, []);

  const handleFileSelected = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const v = validateBackup(parsed);
        if (!v.ok) { setImportDialog({ open: true, error: v.err }); return; }
        setImportDialog({ open: true, parsed: v.data, snapshots: v.snapshots, fundamentals: v.fundamentals, fileName: file.name });
      } catch (err) { setImportDialog({ open: true, error: 'JSON inválido' }); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  const performImport = (mode) => {
    if (!importDialog.parsed) return;
    let next;
    if (mode === 'replace') {
      next = { ...DEFAULT_DATA, ...importDialog.parsed };
      if (importDialog.snapshots?.length) { persistSnapshots(importDialog.snapshots); setSnapshots(importDialog.snapshots); }
      if (importDialog.fundamentals && Object.keys(importDialog.fundamentals).length) {
        persistFundamentals(importDialog.fundamentals); setFundamentals(importDialog.fundamentals);
      }
    } else {
      const ids = new Set(data.holdings.map(h => h.id));
      const newH = importDialog.parsed.holdings.filter(h => !ids.has(h.id));
      const sIds = new Set((data.sales || []).map(s => s.id));
      const newS = (importDialog.parsed.sales || []).filter(s => !sIds.has(s.id));
      const dIds = new Set((data.dividends || []).map(d => d.id));
      const newD = (importDialog.parsed.dividends || []).filter(d => !dIds.has(d.id));
      next = { ...data, holdings: [...data.holdings, ...newH], sales: [...(data.sales || []), ...newS], dividends: [...(data.dividends || []), ...newD] };
    }
    setData(next); persistData(next);
    setImportDialog({ open: false });
  };

  return (
    <ToastProvider>
      <PrivacyContext.Provider value={{ hidden, toggleHidden }}>
      <div className="min-h-screen p-2 md:p-4 max-w-7xl mx-auto">
        <header className="mb-4">
          <div className="flex justify-between items-center flex-wrap gap-2">
            <div>
              <h1 className="text-2xl font-bold"><i className="fa-solid fa-chart-line text-cyan-400 mr-2"></i>Portfolio Cockpit <span className="text-xs text-slate-500 font-normal">v{APP_VERSION}</span></h1>
              <p className="text-xs text-slate-400">FIFO · Multi-divisa · CAGR/MWR · Treemap · Evolución · IA</p>
            </div>
            <div className="flex items-center gap-2 flex-wrap">
              {/* TRM indicator en header - se oculta en modo discreto */}
              {!hidden && (
                <div className="bg-slate-800/70 border border-slate-700 rounded-lg px-3 py-1.5 text-xs flex items-center gap-2">
                  <i className="fa-solid fa-globe text-yellow-400"></i>
                  <div className="flex flex-col leading-tight">
                    <span className="text-slate-300">USD <span className="font-mono text-white">{fmt(data.trms.USD, 0)}</span></span>
                    <span className="text-slate-300">EUR <span className="font-mono text-white">{fmt(data.trms.EUR, 0)}</span></span>
                  </div>
                  <button onClick={() => refreshFX(false)} disabled={fxRefreshing} title="Refrescar TRMs desde BCE" className="text-cyan-400 hover:text-cyan-300 disabled:opacity-50 ml-1">
                    <i className={`fa-solid fa-rotate ${fxRefreshing ? 'fa-spin' : ''}`}></i>
                  </button>
                </div>
              )}
              <button onClick={toggleHidden} title={hidden ? 'Mostrar valores' : 'Ocultar valores'} className={`px-3 py-1.5 rounded text-sm ${hidden ? 'bg-amber-700 hover:bg-amber-600' : 'bg-slate-800 hover:bg-slate-700'}`}>
                <i className={`fa-solid ${hidden ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                <span className="hidden sm:inline ml-1">{hidden ? 'Discreto' : 'Visible'}</span>
              </button>
              {/* Indicador Google Drive */}
              {gdriveConnected && (
                <button
                  onClick={() => gdrivePush()}
                  title={gdriveLastSync ? `Último sync: ${new Date(gdriveLastSync).toLocaleString('es-ES')}` : 'Sincronizar ahora'}
                  className={`px-3 py-1.5 rounded text-sm flex items-center gap-1.5 ${
                    gdriveStatus === 'error' ? 'bg-red-800 hover:bg-red-700' :
                    gdriveStatus === 'syncing' ? 'bg-blue-800' :
                    'bg-green-800 hover:bg-green-700'
                  }`}>
                  <i className={`fa-brands fa-google-drive ${gdriveStatus === 'syncing' ? 'fa-fade' : ''}`}></i>
                  <span className="hidden sm:inline">
                    {gdriveStatus === 'syncing' ? 'Sync...' : gdriveStatus === 'error' ? 'Error' : 'Drive'}
                  </span>
                </button>
              )}
              <button onClick={() => setShowSettings(s => !s)} className="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded text-sm">
                <i className="fa-solid fa-cog"></i>
                <span className="hidden sm:inline ml-1">Config</span>
              </button>
            </div>
          </div>

          <nav className="flex gap-1 mt-4 border-b border-slate-800 overflow-x-auto">
            {[
              { id: 'portfolio', label: 'Portfolio', icon: 'fa-briefcase' },
              { id: 'pulse', label: 'Market Pulse', icon: 'fa-wave-square' },
              { id: 'news', label: 'News & Catalysts', icon: 'fa-newspaper' }
            ].map(t => (
              <button key={t.id} onClick={() => setTab(t.id)} className={`px-4 py-2 text-sm font-medium border-b-2 transition-colors whitespace-nowrap ${
                tab === t.id ? 'border-cyan-400 text-cyan-400' : 'border-transparent text-slate-400 hover:text-white'
              }`}><i className={`fa-solid ${t.icon} mr-1.5`}></i>{t.label}</button>
            ))}
          </nav>
        </header>

        {showSettings && (
          <div className="bg-slate-900 border border-slate-700 rounded-xl p-4 mb-4 space-y-4 animate-fade-in">
            {/* ===== GOOGLE DRIVE SYNC ===== */}
            <div>
              <h3 className="font-bold text-blue-400 text-sm uppercase tracking-wider mb-2">
                <i className="fa-brands fa-google-drive mr-1"></i>Sincronización Google Drive
              </h3>
              {!gdriveReady && (
                <div className="text-xs text-slate-500 bg-slate-800/50 rounded p-2">
                  <i className="fa-solid fa-spinner fa-spin mr-1"></i>Cargando SDK de Google...
                </div>
              )}
              {gdriveReady && !gdriveConnected && (
                <div className="space-y-2">
                  <div className="text-xs text-slate-400">
                    Conecta tu Google Drive para sincronizar automáticamente tus datos entre PC, móvil y tablet.
                  </div>
                  <button onClick={gdriveConnect} className="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded text-sm font-bold">
                    <i className="fa-brands fa-google-drive mr-1"></i>Conectar Google Drive
                  </button>
                </div>
              )}
              {gdriveConnected && (
                <div className="space-y-2">
                  <div className="flex items-center gap-2 text-sm">
                    <span className="inline-flex items-center gap-1 text-green-400">
                      <i className="fa-solid fa-circle-check"></i>Conectado
                    </span>
                    {gdriveLastSync && (
                      <span className="text-xs text-slate-500">
                        · Último sync: {new Date(gdriveLastSync).toLocaleString('es-ES')}
                      </span>
                    )}
                  </div>
                  <div className="flex flex-wrap gap-2">
                    <button onClick={gdrivePush} disabled={gdriveStatus === 'syncing'} className="bg-blue-600 hover:bg-blue-500 disabled:opacity-50 px-3 py-1.5 rounded text-sm">
                      <i className={`fa-solid fa-cloud-arrow-up ${gdriveStatus === 'syncing' ? 'fa-fade' : ''} mr-1`}></i>Subir ahora
                    </button>
                    <button onClick={gdrivePull} disabled={gdriveStatus === 'syncing'} className="bg-cyan-700 hover:bg-cyan-600 disabled:opacity-50 px-3 py-1.5 rounded text-sm">
                      <i className="fa-solid fa-cloud-arrow-down mr-1"></i>Descargar de Drive
                    </button>
                    <button onClick={gdriveDisconnect} className="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-sm">
                      <i className="fa-solid fa-link-slash mr-1"></i>Desconectar
                    </button>
                  </div>
                  <label className="flex items-center gap-2 cursor-pointer mt-1">
                    <input type="checkbox" checked={gdriveAutoSync} onChange={toggleAutoSync} className="w-4 h-4" />
                    <span className="text-sm">Sincronización automática (sube cambios 3s después de cada modificación)</span>
                  </label>
                </div>
              )}
              {gdriveError && (
                <div className="text-xs bg-red-950/40 border border-red-800 text-red-300 rounded p-2 mt-2">
                  <i className="fa-solid fa-triangle-exclamation mr-1"></i>{gdriveError}

              )}
              <div className="text-xs text-slate-500 mt-2">

              </div>
            </div>

            <div className="border-t border-slate-800 pt-4">

                <button onClick={() => fileInputRef.current?.click()} className="bg-blue-600 hover:bg-blue-500 px-3 py-2 rounded text-sm"><i className="fa-solid fa-upload mr-1"></i>Importar JSON</button>

                <i className="fa-solid fa-circle-info mr-1 text-cyan-400"></i>
                Backup incluye lotes FIFO, snapshots de patrimonio y TRMs históricas por transacción. CSV listo para auditoría contable.
              </div>

            <div className="border-t border-slate-800 pt-4">
              <h3 className="font-bold text-orange-400 text-sm uppercase tracking-wider mb-2"><i className="fa-solid fa-wrench mr-1"></i>Reparación de datos</h3>
              <div className="flex flex-wrap gap-2">

                  <div className="text-xs text-slate-500 mt-2">
                    <i className="fa-solid fa-info-circle mr-1 text-amber-400"></i>
                    Tienes <span className="font-bold text-amber-400">{data.holdings.filter(h => isPseudoCashOrEmpty(h)).length}</span> posición(es) ocultas (efectivo legacy o saldo cero). Siguen en el backup JSON.
                  </div>
                  <button onClick={() => {
                    const toDelete = data.holdings.filter(h => isPseudoCashOrEmpty(h));
                    if (!toDelete.length) return;
                    const list = toDelete.map(h => h.symbol || '(sin símbolo)').join(', ');
                    if (!confirm(`¿Eliminar PERMANENTEMENTE estas ${toDelete.length} posiciones?\n\n${list}\n\nEsta acción NO se puede deshacer (excepto restaurando un backup).`)) return;
                    const next = { ...data, holdings: data.holdings.filter(h => !isPseudoCashOrEmpty(h)) };
                    setData(next); persistData(next);
                    alert(`${toDelete.length} posición(es) eliminada(s) permanentemente.`);
                  }} className="mt-2 bg-red-700 hover:bg-red-600 px-3 py-1.5 rounded text-xs">
                    <i className="fa-solid fa-trash mr-1"></i>Eliminar permanentemente las posiciones ocultas
                  </button>
                </>
              )}
            </div>

            <div className="border-t border-slate-800 pt-4">
              <h3 className="font-bold text-cyan-400 text-sm uppercase tracking-wider mb-2">API Keys</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                  <label className="text-xs text-slate-400 block mb-1"><a href="https://finnhub.io/register" target="_blank" rel="noopener" className="hover:underline">Finnhub <i className="fa-solid fa-arrow-up-right-from-square text-[0.6rem]"></i></a></label>
                  <input type="password" value={finnhubKey} onChange={e => setFinnhubKey(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm" />
                </div>
                <div>
                  <label className="text-xs text-slate-400 block mb-1"><a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener" className="hover:underline">Claude <i className="fa-solid fa-arrow-up-right-from-square text-[0.6rem]"></i></a></label>
                  <input type="password" value={claudeKey} onChange={e => setClaudeKey(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm" />
                </div>
              </div>
            </div>

            <div className="border-t border-slate-800 pt-4">
              <div className="flex items-center justify-between flex-wrap gap-2 mb-2">
                <h3 className="font-bold text-yellow-400 text-sm uppercase tracking-wider"><i className="fa-solid fa-globe mr-1"></i>TRMs en tiempo real</h3>
                <button onClick={() => refreshFX(false)} disabled={fxRefreshing} className="bg-yellow-700 hover:bg-yellow-600 disabled:opacity-50 px-3 py-1 rounded text-xs font-bold">
                  <i className={`fa-solid fa-rotate ${fxRefreshing ? 'fa-spin' : ''} mr-1`}></i>{fxRefreshing ? 'Obteniendo...' : 'Actualizar desde BCE'}
                </button>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs text-slate-400 block mb-1">USD/COP</label>
                  <input type="number" step="any" value={data.trms.USD} onChange={e => updateTrm('USD', e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm" />
                </div>
                <div>
                  <label className="text-xs text-slate-400 block mb-1">EUR/COP</label>
                  <input type="number" step="any" value={data.trms.EUR} onChange={e => updateTrm('EUR', e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm" />
                </div>
              </div>
              {fxLastUpdate && (
                <div className="text-xs text-slate-500 mt-2">
                  <i className="fa-solid fa-clock mr-1"></i>Última actualización: {new Date(fxLastUpdate).toLocaleString('es-ES')} {fxSource && <span className="text-cyan-400">· fuente: {fxSource}</span>}
                </div>
              )}
              {fxStatus && (
                <div className={`text-xs mt-2 p-2 rounded ${fxStatus.ok ? 'bg-green-950/40 text-green-300 border border-green-800' : 'bg-red-950/40 text-red-300 border border-red-800'}`}>
                  <i className={`fa-solid ${fxStatus.ok ? 'fa-circle-check' : 'fa-triangle-exclamation'} mr-1`}></i>{fxStatus.msg}
                </div>
              )}
              <div className="text-xs text-slate-500 mt-2">
                <i className="fa-solid fa-circle-info mr-1 text-cyan-400"></i>Fuente: Banco Central Europeo (BCE) vía frankfurter.app. Auto-refresh si llevan más de 6 horas sin actualizar. Cada transacción guarda su propia TRM histórica.
              </div>
            </div>

            <div className="border-t border-slate-800 pt-4 text-xs text-slate-500">
              <div>Snapshots históricos: <span className="font-mono text-slate-300">{snapshots.length}</span></div>
              <div>Posiciones: <span className="font-mono text-slate-300">{data.holdings.length}</span> · Lotes totales: <span className="font-mono text-slate-300">{data.holdings.reduce((s, h) => s + (h.lots?.length || 0), 0)}</span></div>
              <div>Ventas: <span className="font-mono text-slate-300">{(data.sales || []).length}</span> · Dividendos: <span className="font-mono text-slate-300">{(data.dividends || []).length}</span></div>
            </div>
          </div>
        )}

        <main>
          {tab === 'portfolio' && <PortfolioTab data={data} setData={setData} finnhubKey={finnhubKey} snapshots={snapshots} fundamentals={fundamentals} setFundamentals={setFundamentals} />}
          {tab === 'pulse' && <MarketPulseTab data={data} finnhubKey={finnhubKey} />}
          {tab === 'news' && <NewsTab data={data} finnhubKey={finnhubKey} claudeKey={claudeKey} />}
        </main>

        <footer className="text-center text-xs text-slate-600 mt-8 py-4">
          Finnhub · Stooq · CoinGecko · Claude Haiku 4.5 · v{APP_VERSION} · Audit-ready multi-divisa con FIFO
        </footer>

        {importDialog.open && (
          <div className="fixed inset-0 bg-black/80 z-[60] flex items-center justify-center p-4 animate-fade-in">
            <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md p-5">
              <h3 className="font-bold text-blue-400 mb-3"><i className="fa-solid fa-upload mr-1"></i>Importar</h3>
              {importDialog.error ? (
                <div className="space-y-3">
                  <div className="bg-red-950/40 border border-red-700/50 rounded p-3 text-sm text-red-300"><i className="fa-solid fa-triangle-exclamation mr-1"></i>{importDialog.error}</div>
                  <button onClick={() => setImportDialog({ open: false })} className="w-full bg-slate-700 py-2 rounded">Cerrar</button>
                </div>
              ) : (
                <div className="space-y-3 text-sm">
                  <div className="bg-slate-800/50 rounded p-3 space-y-1">
                    <div className="text-xs text-slate-400">Archivo: <span className="text-white">{importDialog.fileName}</span></div>
                    <div className="text-xs text-slate-400">Posiciones: <span className="text-white">{importDialog.parsed.holdings.length}</span></div>
                    <div className="text-xs text-slate-400">Ventas: <span className="text-white">{(importDialog.parsed.sales || []).length}</span></div>
                    <div className="text-xs text-slate-400">Dividendos: <span className="text-white">{(importDialog.parsed.dividends || []).length}</span></div>
                    <div className="text-xs text-slate-400">Snapshots: <span className="text-white">{(importDialog.snapshots || []).length}</span></div>
                  </div>
                  <button onClick={() => performImport('merge')} className="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded text-sm"><i className="fa-solid fa-code-merge mr-1"></i>Fusionar (sin duplicar)</button>
                  <button onClick={() => { if (confirm('Esto reemplazará TODOS tus datos. ¿Seguir?')) performImport('replace'); }} className="w-full bg-red-600 hover:bg-red-500 py-2 rounded text-sm"><i className="fa-solid fa-rotate mr-1"></i>Reemplazar todo</button>
                  <button onClick={() => setImportDialog({ open: false })} className="w-full bg-slate-700 py-2 rounded text-sm">Cancelar</button>
                </div>
              )}
            </div>
          </div>
        )}
      </div>
      </PrivacyContext.Provider>
    </ToastProvider>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

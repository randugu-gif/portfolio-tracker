/* ============================================================
   SUB-PESTAÑA: POSICIONES (con desplegables, sort, search)
   ============================================================ */
const PositionsSection = ({ data, setData, viewCurrency, finnhubKey, fundamentals, setFundamentals }) => {
  const { showToast } = useToast();
  const { hidden } = usePrivacy();
  const [posModal, setPosModal] = useState({ open: false });
  const [sellModal, setSellModal] = useState({ open: false });
  const [refreshing, setRefreshing] = useState(false);
  const [expanded, setExpanded] = useState({});
  const [search, setSearch] = useState('');
  const [sortBy, setSortBy] = useState('value');
  const [sortDir, setSortDir] = useState('desc');
  const [filterCat, setFilterCat] = useState('all');
  const [filterStatus, setFilterStatus] = useState('all');
  const [groupBy, setGroupBy] = useState('none');
  const [editingPrice, setEditingPrice] = useState(null);
  /* showLegacyCash se sincroniza desde localStorage cada vez que cambia */
  const [showLegacyCash, setShowLegacyCash] = useState(() => localStorage.getItem('show_legacy_cash') === 'true');

  /* Re-leer flag cuando se modifique desde Settings */
  useEffect(() => {
    const interval = setInterval(() => {
      const cur = localStorage.getItem('show_legacy_cash') === 'true';
      if (cur !== showLegacyCash) setShowLegacyCash(cur);
    }, 1000);
    return () => clearInterval(interval);
  }, [showLegacyCash]);

  /* Contar holdings legacy de cash en data raw */
  const legacyCashCount = useMemo(() => data.holdings.filter(h => isPseudoCashOrEmpty(h)).length, [data.holdings]);

  const savePrice = (holdingId, newPrice) => {
    if (!newPrice || isNaN(newPrice) || newPrice <= 0) { setEditingPrice(null); return; }
    const next = { ...data, holdings: data.holdings.map(h => h.id === holdingId ? { ...h, currentPrice: newPrice } : h) };
    setData(next); persistData(next);
    setEditingPrice(null);
    showToast('Precio actualizado para todos los lotes', 'success');
  };

  const refreshPrices = async () => {
    if (!finnhubKey) { showToast('Falta API key', 'error'); return; }
    setRefreshing(true);
    /* Separar acciones con API (USD/EUR) de acciones sin API (COP) */
    const allActive = data.holdings.filter(h => !isPseudoCashOrEmpty(h));
    const apiSymbols = [...new Set(allActive.filter(h => h.currency !== 'COP').map(h => h.symbol))];
    const copSymbols = allActive.filter(h => h.currency === 'COP').map(h => h.symbol);
    const updates = { ...data };
    const newFundamentals = { ...fundamentals };
    let fundamentalsCount = 0;

    for (const sym of apiSymbols) {
      try {
        const q = await finnhub.quote(sym, finnhubKey);
        if (q.c > 0) updates.holdings = updates.holdings.map(h => h.symbol === sym && !isPseudoCashOrEmpty(h) ? { ...h, currentPrice: q.c, dayChangePct: q.dp } : h);
        await new Promise(r => setTimeout(r, 80));

        /* Fundamentales: solo si caché tiene más de 6 horas */
        const cached = newFundamentals[sym];
        const sixHours = 6 * 3600 * 1000;
        if (!cached || !cached.fetchedAt || (Date.now() - cached.fetchedAt) > sixHours) {
          try {
            const raw = await finnhub.metric(sym, finnhubKey);
            const normalized = normalizeMetrics(raw);
            if (normalized) {
              newFundamentals[sym] = normalized;
              fundamentalsCount++;
            }
            await new Promise(r => setTimeout(r, 80));
          } catch (e) { console.warn('metric fail', sym); }
        }
      } catch (e) { console.warn(sym); }
    }
    setData(updates); persistData(updates);
    setFundamentals(newFundamentals);
    persistFundamentals(newFundamentals);

    /* Crear snapshot automático */
    const totalValue = updates.holdings.reduce((s, h) => s + convert(h.shares * (h.currentPrice || h.costBasis), h.currency, 'USD', updates.trms), 0);
    const snapshots = loadSnapshots();
    const today = new Date().toISOString().split('T')[0];
    const lastIdx = snapshots.findIndex(s => s.date === today);
    const snap = { date: today, valueUSD: totalValue, valueEUR: convert(totalValue, 'USD', 'EUR', updates.trms), valueCOP: convert(totalValue, 'USD', 'COP', updates.trms) };
    if (lastIdx >= 0) snapshots[lastIdx] = snap; else snapshots.push(snap);
    persistSnapshots(snapshots);

    /* Acumular histórico de precios: sectores + cada activo */
    try {
      await fetchSectorETFs(finnhubKey);
      updates.holdings.forEach(h => {
        if (isPseudoCashOrEmpty(h) || !h.currentPrice) return;
        phAppend(h.symbol, today, h.currentPrice);
      });
    } catch (e) { console.warn('[priceHistory] Error acumulando:', e); }

    setRefreshing(false);
    localStorage.setItem('last_price_refresh', new Date().toISOString());
    const fmsg = fundamentalsCount > 0 ? ` · ${fundamentalsCount} fundamentales` : '';
    const copMsg = copSymbols.length > 0 ? ` · ${copSymbols.length} COP (manual)` : '';
    showToast(`${apiSymbols.length} precios actualizados${fmsg}${copMsg}`, 'success');
  };

  /* Cálculo agregado por holding */
  const enriched = useMemo(() => {
    /* Filtrar pseudo-cash y holdings vacíos a menos que el usuario lo haya activado en Config */
    const sourceHoldings = showLegacyCash ? data.holdings : data.holdings.filter(h => !isPseudoCashOrEmpty(h));
    const totalValueUSD = sourceHoldings.reduce((s, h) => s + convert(h.shares * (h.currentPrice || h.costBasis), h.currency, 'USD', data.trms), 0);

    return sourceHoldings.map(h => {
      const lots = h.lots || [{ shares: h.shares, costBasis: h.costBasis, commission: h.commission || 0, purchaseDate: h.purchaseDate, txSnapshot: h.txSnapshot, txTrms: h.txTrms }];
      const totalShares = lots.reduce((s, l) => s + l.shares, 0);
      const totalCostNative = lots.reduce((s, l) => s + l.shares * l.costBasis + (l.commission || 0), 0);
      const avgCost = totalShares > 0 ? (totalCostNative - lots.reduce((s, l) => s + (l.commission || 0), 0)) / totalShares : 0;
      const valueNative = totalShares * (h.currentPrice || avgCost);
      const plNative = valueNative - totalCostNative;
      const plPct = totalCostNative ? (plNative / totalCostNative) * 100 : 0;
      const valueUSD = convert(valueNative, h.currency, 'USD', data.trms);
      const valueView = convert(valueNative, h.currency, viewCurrency, data.trms);
      const costView = convert(totalCostNative, h.currency, viewCurrency, data.trms);
      const plView = valueView - costView;
      const weight = totalValueUSD > 0 ? valueUSD / totalValueUSD : 0;

      /* CAGR ponderado por lote */
      const oldestLot = lots.reduce((min, l) => !min || l.purchaseDate < min.purchaseDate ? l : min, null);
      const days = oldestLot ? daysBetween(oldestLot.purchaseDate, new Date()) : 0;
      const cagr = calcCAGR(totalCostNative, valueNative, days);

      /* P/L realizado del activo */
      const sales = (data.sales || []).filter(s => s.holdingId === h.id || s.symbol === h.symbol);
      const realizedPL = sales.reduce((s, sale) => s + (sale.realizedPL_native || 0), 0);

      /* Dividendos cobrados (en moneda nativa de la posición) */
      const divs = (data.dividends || []).filter(d => d.symbol === h.symbol);
      const divTotal = divs.reduce((s, d) => s + convert(d.amount, d.currency, h.currency, data.trms), 0);
      const yoc = totalCostNative > 0 ? (divTotal / totalCostNative) * 100 : 0;

      /* Fundamentales para este símbolo (si están cacheados) */
      const fundamental = fundamentals[h.symbol] || null;
      const per = fundamental?.per ?? null;

      return {
        ...h, lots, totalShares, totalCostNative, avgCost, valueNative, plNative, plPct,
        valueView, costView, plView, weight, cagr, daysHeld: days,
        realizedPL, divTotal, yoc,
        fundamental, per,
        oldestDate: oldestLot?.purchaseDate
      };
    });
  }, [data, viewCurrency, fundamentals, showLegacyCash]);

  const filtered = useMemo(() => {
    let list = enriched.filter(h => {
      if (search && !h.symbol.toLowerCase().includes(search.toLowerCase()) && !(h.category || '').toLowerCase().includes(search.toLowerCase())) return false;
      if (filterCat !== 'all' && h.category !== filterCat) return false;
      if (filterStatus === 'winners' && h.plPct < 0) return false;
      if (filterStatus === 'losers' && h.plPct >= 0) return false;
      return true;
    });

    const sorter = (a, b) => {
      let av, bv;
      if (sortBy === 'symbol') { av = a.symbol; bv = b.symbol; }
      else if (sortBy === 'weight') { av = a.weight; bv = b.weight; }
      else if (sortBy === 'shares') { av = a.totalShares; bv = b.totalShares; }
      else if (sortBy === 'cost') { av = a.costView; bv = b.costView; }
      else if (sortBy === 'value') { av = a.valueView; bv = b.valueView; }
      else if (sortBy === 'pl') { av = a.plView; bv = b.plView; }
      else if (sortBy === 'plPct') { av = a.plPct; bv = b.plPct; }
      else if (sortBy === 'cagr') { av = a.cagr || -999; bv = b.cagr || -999; }
      else if (sortBy === 'per') { av = a.per ?? 999; bv = b.per ?? 999; }
      else if (sortBy === 'category') { av = a.category || ''; bv = b.category || ''; }
      else return 0;
      if (typeof av === 'string') return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
      return sortDir === 'asc' ? av - bv : bv - av;
    };
    return list.sort(sorter);
  }, [enriched, search, sortBy, sortDir, filterCat, filterStatus]);

  /* Agrupamiento por categoría (para vista groupBy='category') */
  const grouped = useMemo(() => {
    if (groupBy === 'none') return null;
    const groups = {};
    filtered.forEach(h => {
      const k = h.category || 'Otros';
      if (!groups[k]) groups[k] = { items: [], totalValue: 0, totalCost: 0, totalPL: 0 };
      groups[k].items.push(h);
      groups[k].totalValue += h.valueView;
      groups[k].totalCost += h.costView;
      groups[k].totalPL += h.plView;
    });
    return groups;
  }, [filtered, groupBy]);

  const categories = useMemo(() => [...new Set(enriched.map(h => h.category).filter(Boolean))], [enriched]);

  const SortHeader = ({ field, label, align = 'left', className = '' }) => {
    const active = sortBy === field;
    return (
      <th className={`p-1.5 md:p-2 cursor-pointer hover:text-cyan-400 select-none text-${align} text-xs ${className}`} onClick={() => {
        if (active) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
        else { setSortBy(field); setSortDir('desc'); }
      }}>
        {label} {active && <i className={`fa-solid ${sortDir === 'asc' ? 'fa-caret-up' : 'fa-caret-down'} ml-1`}></i>}
      </th>
    );
  };

  const handleSavePosition = (payload) => {
    let nextHoldings;
    if (payload.mode === 'newPosition') {
      /* Añadir y luego consolidar todo (idempotente, fusiona duplicados case-insensitive) */
      const normalized = { ...payload.holding, symbol: (payload.holding.symbol || '').trim().toUpperCase() };
      nextHoldings = consolidateHoldings([...data.holdings, normalized]);
      const wasConsolidated = nextHoldings.length === data.holdings.length;
      showToast(wasConsolidated ? `Lote añadido a ${normalized.symbol} (consolidado)` : 'Posición creada', 'success');
    } else if (payload.mode === 'addLot') {
      nextHoldings = data.holdings.map(h => {
        if (h.id !== payload.holdingId) return h;
        const newLots = [...(h.lots || []), payload.lot].sort((a, b) => (a.purchaseDate || '').localeCompare(b.purchaseDate || ''));
        const newShares = newLots.reduce((s, l) => s + l.shares, 0);
        return { ...h, lots: newLots, shares: newShares, currentPrice: payload.currentPrice || h.currentPrice };
      });
      showToast('Lote añadido', 'success');
    } else if (payload.mode === 'editLot') {
      nextHoldings = data.holdings.map(h => {
        if (h.id !== payload.holdingId) return h;
        const newLots = h.lots.map(l => l.id === payload.lot.id ? payload.lot : l).sort((a, b) => (a.purchaseDate || '').localeCompare(b.purchaseDate || ''));
        const newShares = newLots.reduce((s, l) => s + l.shares, 0);
        return { ...h, lots: newLots, shares: newShares };
      });
      showToast('Lote actualizado', 'success');
    }
    const next = { ...data, holdings: nextHoldings };
    setData(next); persistData(next); setPosModal({ open: false });
  };

  const handleSaveSale = (sale) => {
    const h = data.holdings.find(x => x.id === sale.holdingId);
    if (!h) return;
    /* Consumir lotes FIFO */
    const consumed = sale.fifoConsumed;
    const newLots = h.lots.map(lot => {
      const used = consumed.find(c => c.lotId === lot.id);
      if (!used) return lot;
      const remaining = lot.shares - used.shares;
      if (remaining < 0.0001) return null;
      return { ...lot, shares: remaining };
    }).filter(Boolean);

    const newShares = newLots.reduce((s, l) => s + l.shares, 0);
    let nextHoldings;
    if (newShares < 0.0001) {
      nextHoldings = data.holdings.filter(x => x.id !== h.id);
    } else {
      nextHoldings = data.holdings.map(x => x.id === h.id ? { ...x, lots: newLots, shares: newShares } : x);
    }
    const next = { ...data, holdings: nextHoldings, sales: [...(data.sales || []), sale] };
    setData(next); persistData(next); setSellModal({ open: false });
    showToast('Venta registrada (FIFO)', 'success');
  };

  const deleteLot = (holdingId, lotId) => {
    if (!confirm('¿Eliminar este lote? Si es el único, se eliminará la posición.')) return;
    const next = { ...data, holdings: data.holdings.map(h => {
      if (h.id !== holdingId) return h;
      const newLots = h.lots.filter(l => l.id !== lotId);
      const newShares = newLots.reduce((s, l) => s + l.shares, 0);
      return { ...h, lots: newLots, shares: newShares };
    }).filter(h => (h.lots && h.lots.length > 0))};
    setData(next); persistData(next);
    showToast('Lote eliminado', 'success');
  };

  const deleteHolding = (holdingId) => {
    const h = data.holdings.find(x => x.id === holdingId);
    if (!h) return;
    const label = h.symbol || 'esta posición';
    if (!confirm(`¿Eliminar TODA la posición ${label}? Esto borra todos los lotes asociados. La acción NO se puede deshacer (excepto restaurando un backup).`)) return;
    const next = { ...data, holdings: data.holdings.filter(x => x.id !== holdingId) };
    setData(next); persistData(next);
    showToast(`${label} eliminada`, 'success');
  };

  /* Modal de edición rápida (categoría, notas, símbolo) */
  const [editModal, setEditModal] = useState({ open: false, holding: null });

  const saveEditHolding = (holdingId, patch) => {
    const next = {
      ...data,
      holdings: data.holdings.map(h => {
        if (h.id !== holdingId) return h;
        const updated = { ...h, ...patch };
        if (patch.symbol) updated.symbol = patch.symbol.trim().toUpperCase();
        return updated;
      })
    };
    /* Si cambió el símbolo, consolidar por si genera duplicado */
    next.holdings = consolidateHoldings(next.holdings);
    setData(next); persistData(next);
    setEditModal({ open: false, holding: null });
    showToast('Posición actualizada', 'success');
  };

  const renderRow = (h) => {
    const isExpanded = expanded[h.id];
    return (
      <React.Fragment key={h.id}>
        <tr className="border-t border-slate-800 hover:bg-slate-800/30 cursor-pointer" onClick={() => setExpanded(e => ({ ...e, [h.id]: !e[h.id] }))}>
          <td className="p-1.5 md:p-2 w-6 text-center">
            <i className={`fa-solid ${isExpanded ? 'fa-chevron-down' : 'fa-chevron-right'} text-slate-400 text-[0.65rem]`}></i>
          </td>
          <td className="p-1.5 md:p-2 font-bold">
            <div className="flex items-center gap-1.5">
              <span>{h.symbol}</span>
              {h.lots && h.lots.length > 1 && (
                <span className="bg-cyan-900/60 border border-cyan-700/50 text-cyan-300 text-[10px] font-mono px-1 py-0.5 rounded">×{h.lots.length}</span>
              )}
              {h.dayChangePct !== undefined && h.dayChangePct !== null && Math.abs(h.dayChangePct) > 0.01 && (
                <span className={`text-[10px] font-mono ${h.dayChangePct >= 0 ? 'text-green-500' : 'text-red-500'}`}>
                  {h.dayChangePct >= 0 ? '▲' : '▼'}{Math.abs(h.dayChangePct).toFixed(1)}%
                </span>
              )}
            </div>
          </td>
          <td className="text-right p-1.5 md:p-2 font-mono">
            <span className={h.weight > 0.15 ? 'text-cyan-400 font-bold' : 'text-slate-300'}>{hidden ? '••%' : `${(h.weight * 100).toFixed(1)}%`}</span>
          </td>
          <td className="text-right p-1.5 md:p-2 font-mono hidden md:table-cell" onClick={e => e.stopPropagation()}>
            {editingPrice === h.id ? (
              <input
                type="number" step="any" autoFocus defaultValue={h.currentPrice}
                onKeyDown={e => {
                  if (e.key === 'Enter') savePrice(h.id, parseFloat(e.target.value));
                  if (e.key === 'Escape') setEditingPrice(null);
                }}
                onBlur={e => savePrice(h.id, parseFloat(e.target.value))}
                className="w-20 bg-slate-950 border border-cyan-600 rounded px-1 py-0.5 text-right text-white"
              />
            ) : (
              <span onClick={() => setEditingPrice(h.id)} className="cursor-pointer inline-flex items-center gap-1 hover:text-cyan-400">
                {fmtMoney(h.currentPrice, h.currency)}
                <i className="fa-solid fa-pen-to-square text-[0.6rem] text-slate-600 hover:text-cyan-400"></i>
              </span>
            )}
          </td>
          <td className={`text-right p-1.5 md:p-2 font-mono hidden sm:table-cell ${h.plView >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtMoney(h.plView, viewCurrency)}</td>
          <td className={`text-right p-1.5 md:p-2 font-mono ${h.plPct >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtPct(h.plPct)}</td>
          <td className={`text-right p-1.5 md:p-2 font-mono hidden lg:table-cell ${(h.cagr || 0) >= 0 ? 'text-green-400' : 'text-red-400'}`}>{h.cagr !== null ? fmtPct(h.cagr) : '—'}</td>
          <td className="text-right p-1.5 md:p-2 font-mono">{fmtMoney(h.valueView, viewCurrency)}</td>
          <td className="text-right p-1.5 md:p-2 font-mono hidden md:table-cell text-slate-400">{fmt(h.totalShares, 4)}</td>
          <td className="text-center p-1.5 md:p-2 text-slate-400 hidden lg:table-cell">{h.category || '—'}</td>
          <td className="p-1.5 md:p-2 text-right whitespace-nowrap" onClick={e => e.stopPropagation()}>
            <button onClick={() => setPosModal({ open: true, mode: 'addLot', holdingToEdit: h })} className="text-indigo-400 hover:text-indigo-300 mr-1 md:mr-2" title="Añadir compra"><i className="fa-solid fa-plus text-xs"></i></button>
            {h.type !== 'cash' && <button onClick={() => setSellModal({ open: true, holding: h })} className="text-red-400 hover:text-red-300 mr-1 md:mr-2" title="Vender FIFO"><i className="fa-solid fa-arrow-trend-down text-xs"></i></button>}
            <button onClick={() => setEditModal({ open: true, holding: h })} className="text-amber-400 hover:text-amber-300 mr-1 md:mr-2" title="Editar categoría/notas/símbolo"><i className="fa-solid fa-pen-to-square text-xs"></i></button>
            <button onClick={() => deleteHolding(h.id)} className="text-slate-500 hover:text-red-400" title="Eliminar posición completa"><i className="fa-solid fa-trash text-xs"></i></button>
          </td>
        </tr>
        {isExpanded && (
          <tr className="bg-slate-950/50">
            <td colSpan="12" className="p-3 border-t border-slate-800">
              <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-3">
                <div className="bg-slate-900 rounded p-2">
                  <div className="text-xs text-slate-400">Días en cartera</div>
                  <div className="font-bold text-sm">{h.daysHeld} d</div>
                </div>
                <div className="bg-slate-900 rounded p-2">
                  <div className="text-xs text-slate-400">CAGR</div>
                  <div className={`font-bold text-sm ${(h.cagr || 0) >= 0 ? 'text-green-400' : 'text-red-400'}`}>{h.cagr !== null ? fmtPct(h.cagr) : '—'}</div>
                </div>
                <div className="bg-slate-900 rounded p-2">
                  <div className="text-xs text-slate-400">P/L Realizado</div>
                  <div className={`font-bold text-sm ${h.realizedPL >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtMoney(h.realizedPL, h.currency)}</div>
                </div>
                <div className="bg-slate-900 rounded p-2">
                  <div className="text-xs text-slate-400">Dividendos</div>
                  <div className="font-bold text-sm text-amber-400">{fmtMoney(h.divTotal, h.currency)}</div>
                </div>
                <div className="bg-slate-900 rounded p-2">
                  <div className="text-xs text-slate-400">YoC</div>
                  <div className="font-bold text-sm text-amber-400">{fmtPct(h.yoc)}</div>
                </div>
              </div>
              <div className="flex items-center justify-between mb-2">
                <div className="text-xs text-slate-400 uppercase tracking-wider"><i className="fa-solid fa-layer-group mr-1 text-cyan-400"></i>{h.lots.length} {h.lots.length === 1 ? 'compra' : 'compras'} consolidadas — orden FIFO</div>
                {h.lots.length > 1 && <div className="text-xs text-slate-500">Costo medio ponderado: <span className="font-mono text-slate-300">{fmtMoney(h.avgCost, h.currency)}</span></div>}
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-xs">
                  <thead className="text-slate-500">
                    <tr>
                      <th className="text-left p-1">Fecha</th>
                      <th className="text-right p-1">Cant.</th>
                      <th className="text-right p-1">Costo unit.</th>
                      <th className="text-right p-1">Comisión</th>
                      <th className="text-right p-1">Total invertido</th>
                      <th className="text-right p-1">Valor actual</th>
                      <th className="text-right p-1">Ganancia</th>
                      <th className="text-right p-1">% Gan.</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody>
                    {h.lots.map(lot => {
                      const invested = lot.shares * lot.costBasis + (lot.commission || 0);
                      const valueNow = lot.shares * (h.currentPrice || lot.costBasis);
                      const gain = valueNow - invested;
                      const gainPct = invested > 0 ? (gain / invested) * 100 : 0;
                      return (
                        <tr key={lot.id} className="border-t border-slate-800">
                          <td className="p-1">{lot.purchaseDate}</td>
                          <td className="text-right p-1 font-mono">{fmt(lot.shares, 4)}</td>
                          <td className="text-right p-1 font-mono">{fmtMoney(lot.costBasis, h.currency)}</td>
                          <td className="text-right p-1 font-mono">{fmtMoney(lot.commission || 0, h.currency)}</td>
                          <td className="text-right p-1 font-mono text-slate-400">{fmtMoney(invested, h.currency)}</td>
                          <td className="text-right p-1 font-mono text-white">{fmtMoney(valueNow, h.currency)}</td>
                          <td className={`text-right p-1 font-mono ${gain >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtMoney(gain, h.currency)}</td>
                          <td className={`text-right p-1 font-mono font-bold ${gainPct >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtPct(gainPct)}</td>
                          <td className="p-1 text-right whitespace-nowrap">
                            <button onClick={() => setPosModal({ open: true, mode: 'editLot', holdingToEdit: h, lotToEdit: lot })} className="text-slate-400 hover:text-white mr-1"><i className="fa-solid fa-pen text-xs"></i></button>
                            <button onClick={() => deleteLot(h.id, lot.id)} className="text-slate-400 hover:text-red-400"><i className="fa-solid fa-trash text-xs"></i></button>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              {/* Fundamentales */}
              {h.type !== 'cash' && (
                <div className="mt-4 pt-3 border-t border-slate-800">
                  <FundamentalsGrid metrics={h.fundamental} currentPrice={h.currentPrice} />
                </div>
              )}
              {h.notes && <div className="text-xs text-slate-400 mt-2"><i className="fa-solid fa-note-sticky mr-1"></i>{h.notes}</div>}
            </td>
          </tr>
        )}
      </React.Fragment>
    );
  };

  return (
    <div className="space-y-3">
      {legacyCashCount > 0 && !showLegacyCash && (
        <div className="bg-slate-800/50 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-400 flex items-center justify-between gap-2">
          <span>
            <i className="fa-solid fa-eye-slash mr-1 text-slate-500"></i>
            {legacyCashCount} posición(es) ocultas (efectivo o saldo cero). Sigue en backup.
          </span>
          <button onClick={() => {
            localStorage.setItem('show_legacy_cash', 'true');
            setShowLegacyCash(true);
          }} className="text-cyan-400 hover:underline">Mostrar</button>
        </div>
      )}
      {/* Toolbar */}
      <div className="flex flex-wrap gap-2 items-center">
        <div className="flex-1 min-w-[200px] relative">
          <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Buscar símbolo o categoría..." className="w-full bg-slate-900 border border-slate-700 rounded pl-8 pr-3 py-1.5 text-sm" />
        </div>
        <select value={filterCat} onChange={e => setFilterCat(e.target.value)} className="bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm">
          <option value="all">Todas las cat.</option>
          {categories.map(c => <option key={c}>{c}</option>)}
        </select>
        <select value={filterStatus} onChange={e => setFilterStatus(e.target.value)} className="bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm">
          <option value="all">Todas</option>
          <option value="winners">Ganadoras</option>
          <option value="losers">Perdedoras</option>
        </select>
        <select value={groupBy} onChange={e => setGroupBy(e.target.value)} className="bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm">
          <option value="none">Sin agrupar</option>
          <option value="category">Agrupar por categoría</option>
        </select>
        <button onClick={refreshPrices} disabled={refreshing} className="bg-cyan-600 hover:bg-cyan-500 disabled:opacity-50 px-3 py-1.5 rounded text-sm">
          <i className={`fa-solid fa-rotate ${refreshing ? 'fa-spin' : ''} mr-1`}></i>Actualizar
        </button>
        <button onClick={() => setPosModal({ open: true, mode: 'newPosition' })} className="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded text-sm">
          <i className="fa-solid fa-plus mr-1"></i>Nueva
        </button>
      </div>

      {/* Indicador de última actualización */}
      {(() => {
        const lastRefresh = localStorage.getItem('last_price_refresh');
        if (!lastRefresh) return null;
        const mins = Math.round((Date.now() - new Date(lastRefresh).getTime()) / 60000);
        const label = mins < 1 ? 'ahora mismo' : mins < 60 ? `hace ${mins} min` : mins < 1440 ? `hace ${Math.round(mins / 60)}h` : `hace ${Math.round(mins / 1440)} días`;
        const stale = mins > 360; /* >6 horas = stale */
        return (
          <div className={`text-[10px] ${stale ? 'text-amber-400' : 'text-slate-500'}`}>
            <i className={`fa-solid ${stale ? 'fa-triangle-exclamation' : 'fa-clock'} mr-1`}></i>
            Precios actualizados {label}
            {stale && <span className="ml-1">(pulsa Actualizar)</span>}
          </div>
        );
      })()}

      {/* Tabla responsive: en móvil solo lo esencial */}
      <div className="glass-card overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-xs md:text-sm">
            <thead className="sticky-th">
              <tr className="text-slate-400">
                <th className="w-6"></th>
                <SortHeader field="symbol" label="Símbolo" />
                <SortHeader field="weight" label="%" align="right" />
                <th className="text-right p-1.5 md:p-2 text-xs hidden md:table-cell">Actual</th>
                <SortHeader field="pl" label={`P/L`} align="right" className="hidden sm:table-cell" />
                <SortHeader field="plPct" label="%Gan" align="right" />
                <SortHeader field="cagr" label="CAGR" align="right" className="hidden lg:table-cell" />
                <SortHeader field="value" label={`Valor`} align="right" />
                <SortHeader field="shares" label="Cant." align="right" className="hidden md:table-cell" />
                <SortHeader field="category" label="Cat." align="center" className="hidden lg:table-cell" />
                <th className="text-right p-1.5 md:p-2 text-xs">·</th>
              </tr>
            </thead>
            <tbody>
              {!grouped && filtered.map(renderRow)}
              {grouped && Object.entries(grouped).map(([cat, g]) => (
                <React.Fragment key={cat}>
                  <tr className="bg-slate-800/70">
                    <td colSpan="12" className="p-2 font-bold text-cyan-400 text-sm">
                      <i className="fa-solid fa-folder mr-2"></i>{cat} <span className="text-xs text-slate-400 font-normal">({g.items.length}) · Valor: {fmtMoney(g.totalValue, viewCurrency)} · P/L: <span className={g.totalPL >= 0 ? 'text-green-400' : 'text-red-400'}>{fmtMoney(g.totalPL, viewCurrency)}</span></span>
                    </td>
                  </tr>
                  {g.items.map(renderRow)}
                </React.Fragment>
              ))}
              {filtered.length === 0 && (
                <tr><td colSpan="14" className="p-8 text-center text-slate-500 text-sm">
                  {data.holdings.length === 0 ? 'Sin posiciones. Pulsa "Nueva".' : 'Sin resultados con estos filtros.'}
                </td></tr>
              )}
            </tbody>
            {filtered.length > 0 && (
              <tfoot className="sticky bottom-0 bg-slate-950/95 backdrop-blur border-t-2 border-cyan-800">
                <tr className="text-xs font-bold">
                  <td className="p-2"></td>
                  <td className="p-2 text-slate-300" colSpan="2">
                    <i className="fa-solid fa-sigma mr-1 text-cyan-400"></i>Total ({filtered.length} posiciones)
                  </td>
                  <td className={`text-right p-2 font-mono hidden sm:table-cell ${filtered.reduce((s, h) => s + h.plView, 0) >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                    {fmtMoney(filtered.reduce((s, h) => s + h.plView, 0), viewCurrency)}
                  </td>

const SalesSection = ({ data, setData, viewCurrency }) => {
  const { showToast } = useToast();
  const [search, setSearch] = useState('');
  const [sortBy, setSortBy] = useState('date');
  const [sortDir, setSortDir] = useState('desc');
  const [yearFilter, setYearFilter] = useState('all');
  const [expanded, setExpanded] = useState({});

  const sales = data.sales || [];
  const years = useMemo(() => [...new Set(sales.map(s => s.date?.slice(0, 4)).filter(Boolean))].sort().reverse(), [sales]);

  const enriched = useMemo(() => sales.map(s => ({
    ...s,
    valueView: convert(s.shares * s.sellPrice - (s.commission || 0), s.currency, viewCurrency, data.trms),
    plView: convert(s.realizedPL_native || 0, s.currency, viewCurrency, data.trms)
  })), [sales, viewCurrency, data.trms]);

  const filtered = useMemo(() => {
    let list = enriched.filter(s => {
      if (search && !s.symbol.toLowerCase().includes(search.toLowerCase())) return false;
      if (yearFilter !== 'all' && !s.date?.startsWith(yearFilter)) return false;
      return true;
    });
    list.sort((a, b) => {
      let av, bv;
      if (sortBy === 'date') { av = a.date; bv = b.date; }
      else if (sortBy === 'symbol') { av = a.symbol; bv = b.symbol; }
      else if (sortBy === 'value') { av = a.valueView; bv = b.valueView; }
      else if (sortBy === 'pl') { av = a.plView; bv = b.plView; }
      if (typeof av === 'string') return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
      return sortDir === 'asc' ? av - bv : bv - av;
    });
    return list;
  }, [enriched, search, sortBy, sortDir, yearFilter]);

  const totals = useMemo(() => ({
    count: filtered.length,
    ingresos: filtered.reduce((s, x) => s + x.valueView, 0),
    plTotal: filtered.reduce((s, x) => s + x.plView, 0),
    ganadoras: filtered.filter(x => x.plView > 0).length,

    if (!confirm('¿Eliminar venta? Esto NO restaura los lotes consumidos.')) return;

/* ============================================================
   PANEL DE RIESGO Y CONCENTRACIÓN
   ============================================================ */
/* ============================================================
   PANEL DE RENTABILIDAD — TWR vs MWR (XIRR)
   TWR: rendimiento de la estrategia (sin efecto de aportes).
   MWR: rendimiento real del dinero del inversor (IRR con fechas).
   ============================================================ */
const xirrBisect = (cashflows) => {
  /* cashflows: [{date, cf}] — convención: aportes negativos, valor final positivo */
  if (!cashflows || cashflows.length < 2) return null;
  const hasNeg = cashflows.some(c => c.cf < 0), hasPos = cashflows.some(c => c.cf > 0);
  if (!hasNeg || !hasPos) return null;
  const t0 = new Date(cashflows[0].date);
  const yrs = cashflows.map(c => (new Date(c.date) - t0) / (365.25 * 86400000));
  const npv = (r) => cashflows.reduce((s, c, i) => s + c.cf / Math.pow(1 + r, yrs[i]), 0);
  let lo = -0.9999, hi = 10;
  let flo = npv(lo), fhi = npv(hi);
  if (!isFinite(flo) || !isFinite(fhi) || flo * fhi > 0) return null;
  for (let i = 0; i < 120; i++) {
    const mid = (lo + hi) / 2, fm = npv(mid);
    if (Math.abs(fm) < 1e-7) return mid;
    if (flo * fm < 0) { hi = mid; fhi = fm; } else { lo = mid; flo = fm; }
  }
  return (lo + hi) / 2;
};

const ReturnsPanel = ({ data, viewCurrency, chartData }) => {
  const calc = useMemo(() => {
    const trms = data.trms || {};
    /* Flujos externos del inversor: compras (+aporte) y ventas (-retiro).
       Usa txSnapshot (TRM histórica de la fecha) cuando existe. */
    const flows = [];
    data.holdings.forEach(h => {
      (h.lots || []).forEach(lot => {
        if (!lot.purchaseDate) return;
        const native = lot.shares * lot.costBasis + (lot.commission || 0);
        const snap = lot.txSnapshot || {};
        const amt = (snap[viewCurrency] && snap[viewCurrency] > 0)
          ? snap[viewCurrency]
          : convert(native, h.currency, viewCurrency, trms);
        flows.push({ date: lot.purchaseDate, amount: amt });
      });
    });
    (data.sales || []).forEach(s => {
      if (!s.date) return;
      const native = s.shares * s.sellPrice - (s.commission || 0);
      flows.push({ date: s.date, amount: -convert(native, s.currency, viewCurrency, trms) });
    });
    flows.sort((a, b) => a.date.localeCompare(b.date));
    if (flows.length === 0) return null;

    /* Valor actual del portafolio (desde holdings, independiente de snapshots) */
    const today = new Date().toISOString().split('T')[0];
    const currentValue = data.holdings
      .filter(h => !isPseudoCashOrEmpty(h))
      .reduce((s, h) => s + convert((h.currentPrice || 0) * (h.shares || 0), h.currency, viewCurrency, trms), 0);
    if (currentValue <= 0) return null;

    /* ===== MWR: XIRR sobre toda la historia ===== */
    const cfs = flows.map(f => ({ date: f.date, cf: -f.amount }));
    cfs.push({ date: today, cf: currentValue });
    const mwr = xirrBisect(cfs);
    const firstFlowDate = flows[0].date;
    const totalDays = Math.max(1, daysBetween(firstFlowDate, today));
    const totalInvested = flows.reduce((s, f) => s + Math.max(0, f.amount), 0);
    const totalWithdrawn = flows.reduce((s, f) => s + Math.max(0, -f.amount), 0);

    /* ===== TWR: sobre el período con snapshots ===== */
    let twr = null, twrAnnual = null, twrDays = 0, spyReturn = null;
    if (chartData && chartData.length >= 2) {
      const flowByDate = {};
      flows.forEach(f => { flowByDate[f.date] = (flowByDate[f.date] || 0) + f.amount; });
      let factor = 1, valid = true;
      for (let i = 1; i < chartData.length; i++) {
        const prev = chartData[i - 1], curr = chartData[i];
        let flow = 0;
        Object.keys(flowByDate).forEach(d => { if (d > prev.date && d <= curr.date) flow += flowByDate[d]; });
        const denom = prev.value + flow;
        if (denom > 0 && curr.value > 0) factor *= curr.value / denom;
        else { valid = false; break; }
      }
      if (valid) {
        twr = factor - 1;
        twrDays = Math.max(1, daysBetween(chartData[0].date, chartData[chartData.length - 1].date));
        twrAnnual = Math.pow(1 + twr, 365.25 / twrDays) - 1;
      }
      /* SPY en el mismo rango */
      const spy = phGet('SPY').slice().sort((a, b) => a.date.localeCompare(b.date))
        .filter(p => p.date >= chartData[0].date && p.date <= chartData[chartData.length - 1].date);
      if (spy.length >= 2 && spy[0].close > 0) spyReturn = (spy[spy.length - 1].close / spy[0].close) - 1;
    }

    return { mwr, twr, twrAnnual, twrDays, spyReturn, firstFlowDate, totalDays, totalInvested, totalWithdrawn, currentValue, nFlows: flows.length };
  }, [data, viewCurrency, chartData]);

  if (!calc) return null;
  const fmtPctSigned = (v, dec = 1) => v === null || !isFinite(v) ? '—' : `${v >= 0 ? '+' : ''}${(v * 100).toFixed(dec)}%`;
  const col = (v) => v === null ? 'text-slate-500' : v >= 0 ? 'text-emerald-400' : 'text-rose-400';

  /* Insight timing: comparar MWR vs TWR anualizado */
  let insight = null;
  if (calc.mwr !== null && calc.twrAnnual !== null && calc.twrDays >= 30) {
    const diff = calc.mwr - calc.twrAnnual;
    if (diff > 0.005) insight = { icon: 'fa-arrow-trend-up', cls: 'text-emerald-300', txt: `Tu MWR supera al TWR en ${(diff * 100).toFixed(1)} pp anuales: el timing de tus aportes añadió valor (compraste relativamente barato).` };
    else if (diff < -0.005) insight = { icon: 'fa-arrow-trend-down', cls: 'text-amber-300', txt: `Tu MWR está ${(Math.abs(diff) * 100).toFixed(1)} pp anuales por debajo del TWR: los aportes llegaron en momentos relativamente caros. La estrategia rinde; el timing restó.` };
    else insight = { icon: 'fa-equals', cls: 'text-slate-400', txt: 'MWR ≈ TWR: el timing de tus aportes fue neutro.' };
  }

  return (
    <div className="glass-card p-3">
      <div className="flex items-center justify-between mb-3 flex-wrap gap-1">
        <div className="text-xs text-slate-400 uppercase tracking-wider"><i className="fa-solid fa-percent mr-1 text-cyan-400"></i>Rentabilidad real: estrategia vs tu dinero</div>
        <div className="text-[10px] text-slate-600">{calc.nFlows} flujos · desde {calc.firstFlowDate}</div>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
        {/* MWR */}
        <div className="kpi-card glass-card p-3">
          <div className="text-[9px] text-slate-500 uppercase">MWR / TIR <span className="normal-case">(tu dinero)</span></div>
          <div className={`text-xl font-bold font-mono ${col(calc.mwr)}`}>{fmtPctSigned(calc.mwr)}</div>
          <div className="text-[9px] text-slate-600 mt-0.5">anual · pondera cuándo aportaste{calc.totalDays < 90 ? ' · período corto: interpretar con cautela' : ''}</div>
        </div>
        {/* TWR */}
        <div className="kpi-card glass-card p-3">
          <div className="text-[9px] text-slate-500 uppercase">TWR <span className="normal-case">(estrategia)</span></div>
          {calc.twr !== null ? (
            <div>
              <div className={`text-xl font-bold font-mono ${col(calc.twrAnnual)}`}>{fmtPctSigned(calc.twrAnnual)}</div>
              <div className="text-[9px] text-slate-600 mt-0.5">anual · {fmtPctSigned(calc.twr)} en {calc.twrDays} días con snapshots</div>
            </div>
          ) : (
            <div>
              <div className="text-xl font-bold font-mono text-slate-600">—</div>
              <div className="text-[9px] text-slate-600 mt-0.5">necesita ≥2 snapshots (pulsa Actualizar a diario)</div>
            </div>
          )}
        </div>
        {/* SPY */}
        <div className="kpi-card glass-card p-3">
          <div className="text-[9px] text-slate-500 uppercase">SPY <span className="normal-case">(mismo período TWR)</span></div>
          {calc.spyReturn !== null ? (
            <div>
              <div className={`text-xl font-bold font-mono ${col(calc.spyReturn)}`}>{fmtPctSigned(calc.spyReturn)}</div>
              <div className="text-[9px] text-slate-600 mt-0.5">
                {calc.twr !== null && <span className={calc.twr >= calc.spyReturn ? 'text-emerald-500' : 'text-rose-500'}>α {fmtPctSigned(calc.twr - calc.spyReturn)} vs tu TWR</span>}
              </div>
            </div>
          ) : (
            <div>
              <div className="text-xl font-bold font-mono text-slate-600">—</div>
              <div className="text-[9px] text-slate-600 mt-0.5">acumulando histórico de SPY</div>
            </div>
          )}
        </div>
      </div>

      <div className="flex flex-wrap gap-x-4 gap-y-1 mt-2 text-[10px] text-slate-500">
        <span>Aportado: <span className="font-mono text-slate-300">{fmtMoney(calc.totalInvested, viewCurrency)}</span></span>
        {calc.totalWithdrawn > 0 && <span>Retirado: <span className="font-mono text-slate-300">{fmtMoney(calc.totalWithdrawn, viewCurrency)}</span></span>}
        <span>Valor actual: <span className="font-mono text-slate-300">{fmtMoney(calc.currentValue, viewCurrency)}</span></span>
      </div>

      {insight && (
        <div className={`mt-2 p-2 rounded-lg bg-slate-800/40 text-[11px] ${insight.cls}`}>
          <i className={`fa-solid ${insight.icon} mr-1.5`}></i>{insight.txt}
        </div>
      )}
      <div className="text-[9px] text-slate-700 mt-1.5">Flujos = compras/ventas registradas (dividendos cuentan como rendimiento, no aporte). Compras valoradas con TRM histórica de su fecha cuando está disponible.</div>
    </div>
  );
};

const RiskConcentrationPanel = ({ data, viewCurrency }) => {
  const trms = data.trms || {};

  const analysis = useMemo(() => {
    const active = data.holdings.filter(h => !isPseudoCashOrEmpty(h));
    const items = active.map(h => ({
      symbol: h.symbol, category: h.category || 'Otros', currency: h.currency,
      value: convert((h.currentPrice || 0) * (h.shares || 0), h.currency, viewCurrency, trms)
    })).filter(i => i.value > 0);
    const total = items.reduce((s, i) => s + i.value, 0);
    if (total <= 0 || items.length === 0) return null;

    const weighted = items.map(i => ({ ...i, w: i.value / total })).sort((a, b) => b.w - a.w);
    const hhi = weighted.reduce((s, i) => s + i.w * i.w, 0);
    const nEff = 1 / hhi;
    const top1 = weighted[0];
    const top5 = weighted.slice(0, 5).reduce((s, i) => s + i.w, 0);

    const byCat = {}, byCur = {};
    weighted.forEach(i => {
      byCat[i.category] = (byCat[i.category] || 0) + i.w;
      byCur[i.currency] = (byCur[i.currency] || 0) + i.w;
    });
    const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    const curs = Object.entries(byCur).sort((a, b) => b[1] - a[1]);

    return { weighted, hhi, nEff, top1, top5, cats, curs, count: items.length };
  }, [data.holdings, viewCurrency, trms]);

  /* Correlaciones reales desde price_history acumulado */
  const corr = useMemo(() => {
    if (!analysis) return null;
    const history = phGetAll();

    const dailyReturns = (series) => {
      const sorted = [...series].sort((a, b) => a.date.localeCompare(b.date));
      const map = {};
      for (let i = 1; i < sorted.length; i++) {
        const prev = sorted[i - 1].close;
        if (prev > 0) map[sorted[i].date] = (sorted[i].close - prev) / prev;
      }
      return map;
    };

    const symbols = analysis.weighted.map(i => i.symbol).filter(s => (history[s] || []).length >= 11);
    const maxHave = Math.max(0, ...analysis.weighted.map(i => (history[i.symbol] || []).length));
    if (symbols.length < 2) return { ready: false, have: maxHave };

    const returns = {};
    symbols.forEach(s => { returns[s] = dailyReturns(history[s]); });

    const pearson = (xs, ys) => {
      const n = xs.length; if (n < 2) return null;
      const mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;
      let num = 0, dx2 = 0, dy2 = 0;
      for (let i = 0; i < n; i++) { const dx = xs[i] - mx, dy = ys[i] - my; num += dx * dy; dx2 += dx * dx; dy2 += dy * dy; }
      const den = Math.sqrt(dx2 * dy2);
      return den === 0 ? null : num / den;
    };

    const pairs = [];
    for (let i = 0; i < symbols.length; i++) {
      for (let j = i + 1; j < symbols.length; j++) {
        const a = symbols[i], b = symbols[j];
        const dates = Object.keys(returns[a]).filter(d => returns[b][d] !== undefined);
        if (dates.length >= 10) {
          const r = pearson(dates.map(d => returns[a][d]), dates.map(d => returns[b][d]));
          if (r !== null && isFinite(r)) pairs.push({ a, b, r, n: dates.length });
        }
      }
    }
    if (pairs.length === 0) return { ready: false, have: maxHave };
    const avg = pairs.reduce((s, p) => s + p.r, 0) / pairs.length;
    const topPairs = [...pairs].sort((x, y) => y.r - x.r).slice(0, 3);
    return { ready: true, avg, topPairs, nSymbols: symbols.length };
  }, [analysis]);

  if (!analysis) return null;

  /* Alertas con umbrales */
  const alerts = [];
  if (analysis.top1.w > 0.20) alerts.push({ sev: 'high', msg: `${analysis.top1.symbol} concentra el ${(analysis.top1.w * 100).toFixed(0)}% del portafolio (umbral 20%)` });
  else if (analysis.top1.w > 0.15) alerts.push({ sev: 'med', msg: `${analysis.top1.symbol} pesa ${(analysis.top1.w * 100).toFixed(0)}% (umbral 15%)` });
  if (analysis.top5 > 0.75) alerts.push({ sev: 'high', msg: `El Top 5 acumula ${(analysis.top5 * 100).toFixed(0)}% del portafolio (umbral 75%)` });
  else if (analysis.top5 > 0.60) alerts.push({ sev: 'med', msg: `El Top 5 acumula ${(analysis.top5 * 100).toFixed(0)}% (umbral 60%)` });
  if (analysis.nEff < 6 && analysis.count >= 8) alerts.push({ sev: 'med', msg: `Tienes ${analysis.count} posiciones pero el N efectivo es ${analysis.nEff.toFixed(1)} — la diversificación real es baja` });
  if (analysis.cats[0] && analysis.cats[0][1] > 0.50) alerts.push({ sev: 'med', msg: `La categoría "${analysis.cats[0][0]}" concentra ${(analysis.cats[0][1] * 100).toFixed(0)}% (umbral 50%)` });
  if (corr && corr.ready && corr.avg > 0.6) alerts.push({ sev: 'med', msg: `Correlación media ${corr.avg.toFixed(2)}: tus posiciones se mueven juntas; la diversificación efectiva es menor de lo que aparenta` });

  const sevColor = { high: 'text-rose-400 bg-rose-400/10 border-rose-800/30', med: 'text-amber-400 bg-amber-400/10 border-amber-800/30' };
  const nEffStatus = analysis.nEff >= 10 ? 'text-emerald-400' : analysis.nEff >= 6 ? 'text-amber-400' : 'text-rose-400';
  const top5Status = analysis.top5 <= 0.60 ? 'text-emerald-400' : analysis.top5 <= 0.75 ? 'text-amber-400' : 'text-rose-400';

  return (
    <div className="glass-card p-3">
      <div className="flex items-center justify-between mb-3">
        <div className="text-xs text-slate-400 uppercase tracking-wider"><i className="fa-solid fa-gauge-high mr-1 text-cyan-400"></i>Riesgo y concentración</div>
        {alerts.length === 0
          ? <span className="text-[10px] text-emerald-400 bg-emerald-400/10 px-2 py-0.5 rounded-full"><i className="fa-solid fa-check mr-1"></i>Sin alertas</span>
          : <span className="text-[10px] text-amber-400 bg-amber-400/10 px-2 py-0.5 rounded-full"><i className="fa-solid fa-triangle-exclamation mr-1"></i>{alerts.length} alerta{alerts.length > 1 ? 's' : ''}</span>}
      </div>

      {/* KPIs */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-2 mb-3">
        <div className="kpi-card glass-card p-2.5">
          <div className="text-[9px] text-slate-500 uppercase">N efectivo</div>
          <div className={`text-lg font-bold font-mono ${nEffStatus}`}>{analysis.nEff.toFixed(1)} <span className="text-[10px] text-slate-500 font-normal">/ {analysis.count}</span></div>
          <div className="text-[9px] text-slate-600">posiciones reales vs nominales</div>
        </div>
        <div className="kpi-card glass-card p-2.5">
          <div className="text-[9px] text-slate-500 uppercase">Top 5</div>
          <div className={`text-lg font-bold font-mono ${top5Status}`}>{(analysis.top5 * 100).toFixed(0)}%</div>
          <div className="relative h-1.5 bg-slate-800/60 rounded-full overflow-hidden mt-1">
            <div className={`h-full rounded-full ${analysis.top5 > 0.75 ? 'bg-rose-500' : analysis.top5 > 0.60 ? 'bg-amber-500' : 'bg-emerald-500'}`} style={{ width: `${analysis.top5 * 100}%` }}></div>
            <div className="absolute top-0 left-[60%] w-px h-full bg-slate-500/60"></div>
            <div className="absolute top-0 left-[75%] w-px h-full bg-slate-500/60"></div>
          </div>
        </div>
        <div className="kpi-card glass-card p-2.5">
          <div className="text-[9px] text-slate-500 uppercase">Mayor posición</div>
          <div className="text-lg font-bold font-mono text-white">{analysis.top1.symbol}</div>
          <div className={`text-[10px] font-mono ${analysis.top1.w > 0.20 ? 'text-rose-400' : analysis.top1.w > 0.15 ? 'text-amber-400' : 'text-slate-400'}`}>{(analysis.top1.w * 100).toFixed(1)}% del total</div>
        </div>
        <div className="kpi-card glass-card p-2.5">
          <div className="text-[9px] text-slate-500 uppercase">Correlación media</div>
          {corr && corr.ready ? (
            <div>
              <div className={`text-lg font-bold font-mono ${corr.avg > 0.6 ? 'text-amber-400' : 'text-emerald-400'}`}>{corr.avg.toFixed(2)}</div>
              <div className="text-[9px] text-slate-600">{corr.nSymbols} activos con histórico</div>
            </div>
          ) : (
            <div>
              <div className="text-lg font-bold font-mono text-slate-600">—</div>
              <div className="text-[9px] text-slate-600">acumulando ({corr ? corr.have : 0}/11 días)</div>
            </div>
          )}
        </div>
      </div>

      {/* Exposición por categoría y moneda */}
      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
        <div>
          <div className="text-[10px] text-slate-500 uppercase mb-1.5">Por categoría</div>
          <div className="space-y-1">
            {analysis.cats.slice(0, 5).map(([cat, w]) => (
              <div key={cat} className="flex items-center gap-2 text-[11px]">

                <div className="flex-1 h-3 bg-slate-800/50 rounded-full overflow-hidden">
                  <div className={`h-full rounded-full ${w > 0.5 ? 'bg-amber-500' : 'bg-cyan-600'}`} style={{ width: `${w * 100}%` }}></div>

                <span className={`w-9 text-right font-mono ${w > 0.5 ? 'text-amber-400 font-bold' : 'text-slate-400'}`}>{(w * 100).toFixed(0)}%</span>
              </div>
            ))}
          </div>
        </div>
        <div>
          <div className="text-[10px] text-slate-500 uppercase mb-1.5">Por moneda</div>

};

        weight: totalValueView > 0 ? value / totalValueView : 0,
        changePct: h.dayChangePct || 0,
        plPct, cagr, category: h.category,
        currency: h.currency
      };
    });
  }, [data, viewCurrency]);

  /* Métricas globales */
  const kpis = useMemo(() => {
    const realHoldings = data.holdings.filter(h => !isPseudoCashOrEmpty(h));
    let invested = 0, current = 0;
    realHoldings.forEach(h => {
      const lots = h.lots || [{ shares: h.shares, costBasis: h.costBasis, commission: h.commission || 0 }];
      const totalCost = lots.reduce((s, l) => s + l.shares * l.costBasis + (l.commission || 0), 0);
      invested += convert(totalCost, h.currency, viewCurrency, data.trms);
      current += convert(h.shares * (h.currentPrice || h.costBasis), h.currency, viewCurrency, data.trms);
    });
    const realizedPL = (data.sales || []).reduce((s, sale) => s + convert(sale.realizedPL_native || 0, sale.currency, viewCurrency, data.trms), 0);
    const totalDivs = (data.dividends || []).reduce((s, d) => s + convert(d.amount, d.currency, viewCurrency, data.trms), 0);

    const cashflows = [];
    realHoldings.forEach(h => {
      (h.lots || []).forEach(lot => {
        const total = lot.shares * lot.costBasis + (lot.commission || 0);
        cashflows.push({ date: lot.purchaseDate, amount: -convert(total, h.currency, viewCurrency, data.trms) });
      });
    });
    (data.sales || []).forEach(s => {
      cashflows.push({ date: s.date, amount: convert(s.shares * s.sellPrice - (s.commission || 0), s.currency, viewCurrency, data.trms) });
    });
    (data.dividends || []).forEach(d => {
      cashflows.push({ date: d.date, amount: convert(d.amount, d.currency, viewCurrency, data.trms) });
    });
    if (current > 0) cashflows.push({ date: new Date().toISOString().split('T')[0], amount: current });
    cashflows.sort((a, b) => a.date.localeCompare(b.date));
    const mwr = cashflows.length >= 2 ? xirr(cashflows) : null;

    let maxDD = 0, peak = -Infinity;
    const snapKey = viewCurrency === 'USD' ? 'valueUSD' : viewCurrency === 'EUR' ? 'valueEUR' : 'valueCOP';
    snapshots.forEach(s => {
      const v = s[snapKey];
      if (v > peak) peak = v;
      const dd = peak > 0 ? ((v - peak) / peak) * 100 : 0;
      if (dd < maxDD) maxDD = dd;
    });

    let earliestDate = null;
    realHoldings.forEach(h => {
      (h.lots || []).forEach(lot => {
        if (lot.purchaseDate && (!earliestDate || lot.purchaseDate < earliestDate)) earliestDate = lot.purchaseDate;
      });
    });
    const totalReturn = current + (data.sales || []).reduce((s, sale) => s + convert(sale.shares * sale.sellPrice - (sale.commission || 0), sale.currency, viewCurrency, data.trms), 0) + totalDivs;
    const daysSinceStart = earliestDate ? daysBetween(earliestDate, new Date()) : 0;
    const cagrPortfolio = invested > 0 && daysSinceStart > 30 ? calcCAGR(invested, totalReturn, daysSinceStart) : null;

    return { invested, current, plLatent: current - invested, plPct: invested ? ((current - invested) / invested) * 100 : 0, realizedPL, totalDivs, mwr, maxDD, cagrPortfolio, daysSinceStart, earliestDate };
  }, [data, viewCurrency, snapshots]);

  /* Datos del gráfico, filtrados por rango */
  const chartData = useMemo(() => {
    const snapKey = viewCurrency === 'USD' ? 'valueUSD' : viewCurrency === 'EUR' ? 'valueEUR' : 'valueCOP';
    let all = snapshots.map(s => ({ date: s.date, value: s[snapKey] || 0 })).sort((a, b) => a.date.localeCompare(b.date));
    if (rangeFilter === 'all') return all;
    const daysMap = { '1M': 30, '3M': 90, '6M': 180, '1Y': 365 };
    const cutoff = new Date(Date.now() - (daysMap[rangeFilter] || 9999) * 86400000).toISOString().split('T')[0];
    return all.filter(d => d.date >= cutoff);
  }, [snapshots, viewCurrency, rangeFilter]);

  /* Capital aportado acumulado por fecha de snapshot */
  const contributionsData = useMemo(() => {
    if (!showContrib || chartData.length < 2) return null;
    /* Construir lista cronológica de aportes netos: compras (+) y ventas (-) */
    const events = [];
    data.holdings.forEach(h => {
      (h.lots || []).forEach(lot => {
        if (!lot.purchaseDate) return;
        const total = lot.shares * lot.costBasis + (lot.commission || 0);
        events.push({ date: lot.purchaseDate, amount: convert(total, h.currency, viewCurrency, data.trms) });
      });
    });
    (data.sales || []).forEach(s => {
      const total = s.shares * s.sellPrice - (s.commission || 0);
      events.push({ date: s.date, amount: -convert(total, s.currency, viewCurrency, data.trms) });
    });
    events.sort((a, b) => a.date.localeCompare(b.date));

    /* Para cada fecha de snapshot, sumar todos los aportes hasta esa fecha */
    return chartData.map(snap => {
      const acc = events.filter(e => e.date <= snap.date).reduce((s, e) => s + e.amount, 0);
      return { date: snap.date, value: Math.max(0, acc) };
    });
  }, [data, viewCurrency, chartData, showContrib]);

  /* Marcadores de eventos: compras, ventas y dividendos importantes en el rango */
  const chartEvents = useMemo(() => {
    if (!showEvents || chartData.length < 2) return null;
    const startDate = chartData[0].date;
    const endDate = chartData[chartData.length - 1].date;
    const evs = [];
    data.holdings.forEach(h => {
      (h.lots || []).forEach(lot => {
        if (lot.purchaseDate >= startDate && lot.purchaseDate <= endDate) {
          const amount = lot.shares * lot.costBasis;
          evs.push({
            date: lot.purchaseDate, type: 'buy',
            label: `${h.symbol} · ${fmt(lot.shares, 4)} @ ${fmtMoney(lot.costBasis, h.currency)}`
          });
        }
      });
    });
    (data.sales || []).forEach(s => {
      if (s.date >= startDate && s.date <= endDate) {
        evs.push({
          date: s.date, type: 'sell',
          label: `${s.symbol} · ${fmt(s.shares, 4)} @ ${fmtMoney(s.sellPrice, s.currency)}`
        });
      }
    });
    /* Solo dividendos > $20 USD equivalente para no saturar */
    (data.dividends || []).forEach(d => {
      if (d.date >= startDate && d.date <= endDate) {
        const usdAmount = convert(d.amount, d.currency, 'USD', data.trms);
        if (usdAmount >= 20) {
          evs.push({
            date: d.date, type: 'dividend',
            label: `${d.symbol || 'Div'} · ${fmtMoney(d.amount, d.currency)}`
          });
        }
      }
    });
    return evs.sort((a, b) => a.date.localeCompare(b.date));
  }, [data, chartData, showEvents]);

  /* Proyección futura basada en CAGR y ritmo de aportes */
  const projectionData = useMemo(() => {
    if (!showProjection || chartData.length < 2) return null;
    /* Calcular CAGR del periodo visible */
    const first = chartData[0], last = chartData[chartData.length - 1];
    const days = (new Date(last.date) - new Date(first.date)) / 86400000;
    if (days < 30) return null;
    const periodCagr = Math.pow(last.value / Math.max(first.value, 1), 365 / days) - 1;

    /* Ritmo de aportes mensual estimado */
    let monthlyContribution = 0;
    if (contributionsData && contributionsData.length >= 2) {
      const contribDelta = contributionsData[contributionsData.length - 1].value - contributionsData[0].value;
      const monthsCovered = days / 30.44;
      monthlyContribution = monthsCovered > 0 ? contribDelta / monthsCovered : 0;
    }

    /* Proyectar 36 meses adelante en pasos mensuales */
    const proj = [];
    let value = last.value;
    let valueLow = last.value;
    let valueHigh = last.value;
    const monthlyRate = Math.pow(1 + periodCagr, 1/12) - 1;
    /* Escenarios optimista (+50% rate) y pesimista (-50% rate) */
    const monthlyRateHigh = Math.pow(1 + periodCagr * 1.5, 1/12) - 1;
    const monthlyRateLow = Math.pow(1 + Math.max(periodCagr * 0.3, -0.1), 1/12) - 1;

    const startDate = new Date(last.date);
    for (let m = 1; m <= 36; m++) {
      const d = new Date(startDate);
      d.setMonth(d.getMonth() + m);
      value = value * (1 + monthlyRate) + monthlyContribution;
      valueHigh = valueHigh * (1 + monthlyRateHigh) + monthlyContribution;
      valueLow = valueLow * (1 + monthlyRateLow) + monthlyContribution;
      proj.push({
        date: d.toISOString().split('T')[0],
        value,
        lower: valueLow,
        upper: valueHigh
      });
    }
    return { points: proj, periodCagr, monthlyContribution };
  }, [chartData, contributionsData, showProjection]);

  /* Fecha estimada para alcanzar FIRE goal */
  const fireForecast = useMemo(() => {
    if (!fireGoal || fireGoal <= 0 || !projectionData) return null;
    const target = projectionData.points.find(p => p.value >= fireGoal);
    if (target) return { date: target.date, withinHorizon: true };
    /* Más allá de 36 meses: extrapolar de forma simple */
    const last = projectionData.points[projectionData.points.length - 1];
    if (last.value <= 0) return null;
    const ratio = fireGoal / last.value;
    const periodCagr = projectionData.periodCagr;
    if (periodCagr <= 0) return null;
    const yearsExtra = Math.log(ratio) / Math.log(1 + periodCagr);
    if (!isFinite(yearsExtra) || yearsExtra < 0) return null;
    const d = new Date(last.date);
    d.setFullYear(d.getFullYear() + Math.ceil(yearsExtra));
    return { date: d.toISOString().split('T')[0], withinHorizon: false };
  }, [fireGoal, projectionData]);

  /* Drawdown en el tiempo */
  const ddSeries = useMemo(() => {
    return riskStats.drawdownSeries(chartData.map(d => ({ date: d.date, value: d.value })));
  }, [chartData]);

  /* Distribución para donas */
  const diversification = useMemo(() => {
    const realHoldings = data.holdings.filter(h => !isPseudoCashOrEmpty(h));
    const bySector = {}, byCurrency = {}, byType = {};
    /* Heurística de tipo de activo a partir de la categoría */
    const typeOf = (cat) => {
      if (!cat) return 'Otros';
      if (cat === 'ETF') return 'ETF';
      if (cat === 'Crypto') return 'Cripto';
      if (cat === 'Commodities' || cat === 'Oro') return 'Materias primas';
      if (cat === 'Bonos/Renta fija') return 'Renta fija';
      return 'Acciones';
    };
    realHoldings.forEach(h => {
      const value = convert(h.shares * (h.currentPrice || h.costBasis), h.currency, viewCurrency, data.trms);
      const sector = h.category || 'Otros';
      bySector[sector] = (bySector[sector] || 0) + value;
      byCurrency[h.currency] = (byCurrency[h.currency] || 0) + value;
      const t = typeOf(h.category);
      byType[t] = (byType[t] || 0) + value;
    });
    const toArr = (obj) => Object.entries(obj).map(([label, value]) => ({ label, value, currency: viewCurrency })).sort((a, b) => b.value - a.value);
    return { sector: toArr(bySector), currency: toArr(byCurrency), type: toArr(byType) };
  }, [data, viewCurrency]);

  /* Cargar benchmark SPY + métricas de riesgo desde datos acumulados */
  const loadRiskAndBenchmark = async () => {
    setLoadingRisk(true);
    setRiskError(null);
    try {
      const priceHistory = phGetAll();
      const spyHistory = phGet('SPY').slice().sort((a, b) => a.date.localeCompare(b.date));

      /* 1. Benchmark SPY */
      if (spyHistory.length >= 2) {
        if (chartData.length >= 2) {
          const benchAligned = chartData.map(snap => {
            const match = spyHistory.reduce((best, pt) =>
              Math.abs(new Date(pt.date) - new Date(snap.date)) < Math.abs(new Date(best.date) - new Date(snap.date)) ? pt : best
            , spyHistory[0]);
            return { date: snap.date, value: match.close };
          });
          setBenchData(benchAligned);
        } else {
          setBenchData(spyHistory.map(p => ({ date: p.date, value: p.close })));
        }
      }

      /* 2. Métricas de riesgo */
      const realHoldings = data.holdings.filter(h => !isPseudoCashOrEmpty(h));
      const totalValue = realHoldings.reduce((s, h) => s + convert(h.shares * (h.currentPrice || h.costBasis), h.currency, 'USD', data.trms), 0);

      /* 2a. Intentar cálculo desde histórico acumulado (si hay suficientes días) */
      const symbolsWithHist = [];
      const symReturns = {};
      let minLen = Infinity;
      const failed = [];

      for (const h of realHoldings) {
        const hist = (priceHistory[h.symbol] || []).sort((a, b) => a.date.localeCompare(b.date));
        if (hist.length >= 10) {
          const returns = riskStats.dailyReturns(hist);
          if (returns.length >= 5) {
            symReturns[h.symbol] = returns;
            symbolsWithHist.push(h.symbol);
            if (returns.length < minLen) minLen = returns.length;
          } else {
            failed.push(h.symbol);
          }
        } else {
          failed.push(h.symbol);
        }
      }

      const spyReturns = riskStats.dailyReturns(spyHistory);
      if (spyReturns.length > 0) minLen = Math.min(minLen, spyReturns.length);

      /* 2b. Si tenemos suficientes datos acumulados, calcular métricas reales */
      if (symbolsWithHist.length > 0 && minLen >= 5) {
        const weights = {};
        symbolsWithHist.forEach(sym => {
          const h = realHoldings.find(x => x.symbol === sym);
          const v = convert(h.shares * (h.currentPrice || h.costBasis), h.currency, 'USD', data.trms);
          weights[sym] = totalValue > 0 ? v / totalValue : 0;
        });
        const weightSum = Object.values(weights).reduce((s, w) => s + w, 0) || 1;

        const portReturns = [];
        for (let i = 0; i < minLen; i++) {
          let r = 0;
          symbolsWithHist.forEach(sym => {
            const sr = symReturns[sym];
            r += (sr[sr.length - minLen + i] || 0) * (weights[sym] / weightSum);
          });
          portReturns.push(r);
        }
        const benchSlice = spyReturns.slice(-minLen);

        setRiskData({
          vol: riskStats.annualizedVol(portReturns),
          sharpe: riskStats.sharpe(portReturns),
          beta: benchSlice.length >= 5 ? riskStats.beta(portReturns, benchSlice) : null,
          benchVol: benchSlice.length >= 5 ? riskStats.annualizedVol(benchSlice) : null,
          coverage: symbolsWithHist.length,
          totalHoldings: realHoldings.length,
          daysUsed: minLen,
          failed,
          source: 'accumulated'
        });
      }
      /* 2c. Fallback: usar beta pre-calculado de fundamentales + vol de snapshots */
      else {
        const snapKey = viewCurrency === 'USD' ? 'valueUSD' : viewCurrency === 'EUR' ? 'valueEUR' : 'valueCOP';
        const snapValues = snapshots.map(s => s[snapKey] || 0).filter(v => v > 0);
        const snapReturns = [];
        for (let i = 1; i < snapValues.length; i++) {
          if (snapValues[i - 1] > 0) snapReturns.push((snapValues[i] - snapValues[i - 1]) / snapValues[i - 1]);
        }

        /* Beta promedio ponderado desde fundamentales cacheados */
        const fundamentals = loadFundamentals();
        let weightedBeta = 0, betaWeightSum = 0;
        realHoldings.forEach(h => {
          const f = fundamentals[h.symbol];
          if (f && f.beta !== null && f.beta !== undefined) {
            const w = convert(h.shares * (h.currentPrice || h.costBasis), h.currency, 'USD', data.trms);
            weightedBeta += f.beta * w;
            betaWeightSum += w;
          }
        });

        setRiskData({
          vol: snapReturns.length >= 2 ? riskStats.annualizedVol(snapReturns) : null,
          sharpe: snapReturns.length >= 2 ? riskStats.sharpe(snapReturns) : null,
          beta: betaWeightSum > 0 ? weightedBeta / betaWeightSum : null,
          benchVol: null,
          coverage: 0,
          totalHoldings: realHoldings.length,
          daysUsed: snapReturns.length,
          failed: realHoldings.map(h => h.symbol),
          source: 'snapshots'
        });
      }

      /* Mensaje informativo */
      const daysSPY = spyHistory.length;
      const daysNeeded = 30;
      if (daysSPY < 2) {
        setRiskError(`SPY benchmark necesita datos acumulados. Pulsa "Actualizar" diariamente — tienes ${daysSPY} día(s), necesitas ~${daysNeeded} para métricas fiables. Los datos se acumulan automáticamente con cada refresh.`);
      } else if (daysSPY < daysNeeded) {
        setRiskError(`Parcial: ${daysSPY} días de histórico acumulado (de ${daysNeeded} necesarios para métricas fiables). Sigue actualizando precios a diario.${failed.length > 0 ? ` Sin datos: ${failed.join(', ')}` : ''}`);
      } else if (failed.length > 0) {
        setRiskError(`Parcial: sin datos para ${failed.join(', ')}. Estos se acumularán con los próximos refreshes.`);
      }
    } catch (e) {
      setRiskError('Error: ' + e.message);
    }
    setLoadingRisk(false);
  };

  const RANGES = [
    { id: '1M', label: '1M' }, { id: '3M', label: '3M' }, { id: '6M', label: '6M' },
    { id: '1Y', label: '1A' }, { id: 'all', label: 'Todo' }
  ];

  return (
    <div className="space-y-4">
      {/* CAGR consolidado destacado */}
      <div className="bg-gradient-to-br from-indigo-950/60 to-purple-950/40 border border-indigo-700/40 rounded-xl p-4">
        <div className="flex items-center justify-between flex-wrap gap-3">
          <div className="flex items-center gap-3">
            <div className="bg-indigo-600/30 rounded-lg w-12 h-12 flex items-center justify-center">
              <i className="fa-solid fa-chart-line text-2xl text-indigo-300"></i>
            </div>
            <div>
              <div className="text-xs text-indigo-300 uppercase tracking-wider font-bold">CAGR Consolidado del Portafolio</div>
              <div className="text-xs text-slate-400">Rentabilidad anualizada buy-and-hold desde {kpis.earliestDate || '—'} · {kpis.daysSinceStart} días</div>
            </div>
          </div>
          <div className="text-right">
            {kpis.cagrPortfolio !== null ? (
              <>
                <div className={`text-3xl font-bold ${kpis.cagrPortfolio >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtPct(kpis.cagrPortfolio)}</div>
                <div className="text-xs text-slate-400">anualizado · incluye dividendos y ventas</div>
              </>
            ) : (
              <div className="text-2xl font-bold text-slate-500">— <span className="text-xs">(necesita &gt;30 días)</span></div>
            )}
          </div>
        </div>
      </div>

      {/* KPIs */}
      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-7 gap-1.5 md:gap-2">
        <div className="glass-card kpi-card p-2.5 md:p-3"><div className="text-[10px] md:text-xs text-slate-400">Invertido</div><div className="text-sm md:text-base font-bold truncate">{fmtMoney(kpis.invested, viewCurrency)}</div></div>
        <div className="glass-card kpi-card p-2.5 md:p-3"><div className="text-[10px] md:text-xs text-slate-400">Valor actual</div><div className="text-sm md:text-base font-bold truncate">{fmtMoney(kpis.current, viewCurrency)}</div></div>
        <div className="glass-card kpi-card p-2.5 md:p-3"><div className="text-[10px] md:text-xs text-slate-400">P/L Latente</div><div className={`text-sm md:text-base font-bold truncate ${kpis.plLatent >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtMoney(kpis.plLatent, viewCurrency)}</div></div>
        <div className="glass-card kpi-card p-2.5 md:p-3"><div className="text-[10px] md:text-xs text-slate-400">% Rentab.</div><div className={`text-sm md:text-base font-bold ${kpis.plPct >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtPct(kpis.plPct)}</div></div>
        <div className="glass-card kpi-card p-2.5 md:p-3"><div className="text-[10px] md:text-xs text-slate-400">P/L Realizado</div><div className={`text-sm md:text-base font-bold truncate ${kpis.realizedPL >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtMoney(kpis.realizedPL, viewCurrency)}</div></div>
        <div className="glass-card kpi-card p-2.5 md:p-3"><div className="text-[10px] md:text-xs text-slate-400">Dividendos</div><div className="text-sm md:text-base font-bold text-amber-400 truncate">{fmtMoney(kpis.totalDivs, viewCurrency)}</div></div>
        <div className="glass-card kpi-card p-2.5 md:p-3 col-span-2 sm:col-span-1"><div className="text-[10px] md:text-xs text-slate-400" title="Money-Weighted Return (XIRR)">MWR / IRR</div><div className={`text-sm md:text-base font-bold ${(kpis.mwr || 0) >= 0 ? 'text-green-400' : 'text-red-400'}`}>{kpis.mwr !== null ? fmtPct(kpis.mwr) : '—'}</div></div>
      </div>

      {/* Evolución con selector de rango + benchmark + nuevos toggles */}
      <div className="glass-card p-3">
        <div className="flex items-center justify-between flex-wrap gap-2 mb-2">
          <div className="text-xs text-slate-400 uppercase tracking-wider">
            <i className="fa-solid fa-chart-line mr-1"></i>Evolución patrimonio
            {chartMode === 'pct' ? ' (% retorno)' : benchData ? ' vs SPY' : ` (${viewCurrency})`}
          </div>
          <div className="flex gap-1">
            {RANGES.map(r => (
              <button key={r.id} onClick={() => setRangeFilter(r.id)} className={`px-2 py-0.5 rounded text-xs ${
                rangeFilter === r.id ? 'bg-cyan-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
              }`}>{r.label}</button>
            ))}
          </div>
        </div>

        {/* Controles del gráfico */}
        <div className="flex flex-wrap items-center gap-x-4 gap-y-2 mb-3 text-xs">
          <div className="flex gap-1 bg-slate-950 border border-slate-700 rounded p-0.5">
            <button onClick={() => setChartMode('absolute')} className={`px-2 py-0.5 rounded ${chartMode === 'absolute' ? 'bg-slate-700 text-white' : 'text-slate-400'}`}>$ Valor</button>
            <button onClick={() => setChartMode('pct')} className={`px-2 py-0.5 rounded ${chartMode === 'pct' ? 'bg-slate-700 text-white' : 'text-slate-400'}`}>% Retorno</button>
          </div>
          <label className="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" checked={showContrib} onChange={e => setShowContrib(e.target.checked)} className="w-3 h-3" />
            <span className="text-slate-300">Mostrar aportes</span>
          </label>
          <label className="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" checked={showEvents} onChange={e => setShowEvents(e.target.checked)} className="w-3 h-3" />
            <span className="text-slate-300">Marcadores de eventos</span>
          </label>
          <label className="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" checked={showProjection} onChange={e => setShowProjection(e.target.checked)} className="w-3 h-3" />
            <span className="text-slate-300">Proyección 3 años</span>
          </label>
        </div>

        <LineChart
          data={chartData}
          contributions={chartMode === 'absolute' ? contributionsData : null}
          benchmark={benchData}
          events={chartEvents}
          projection={projectionData ? projectionData.points : null}
          label="Patrimonio"
          benchmarkLabel="SPY"
          viewCurrency={viewCurrency}
          mode={chartMode}
        />

        {/* KPIs de aportes vs rentabilidad */}
        {chartMode === 'absolute' && contributionsData && contributionsData.length >= 2 && (
          <div className="grid grid-cols-3 gap-2 mt-3 text-xs">

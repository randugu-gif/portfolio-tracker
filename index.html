/* ============================================================
   SECCIÓN DE SEGURIDAD — gestión del cifrado local
   ============================================================ */
const SecuritySection = () => {
  const { showToast } = useToast();
  const [enabled, setEnabled] = useState(isEncrypted());
  const [mode, setMode] = useState(null); /* 'enable' | 'disable' */
  const [p1, setP1] = useState('');
  const [p2, setP2] = useState('');
  const [busy, setBusy] = useState(false);

  const reset = () => { setMode(null); setP1(''); setP2(''); setBusy(false); };

  const enable = async () => {
    if (p1.length < 8) { showToast('La passphrase debe tener al menos 8 caracteres', 'error'); return; }
    if (p1 !== p2) { showToast('Las passphrases no coinciden', 'error'); return; }
    setBusy(true);
    try {
      const salt = b64enc(crypto.getRandomValues(new Uint8Array(16)));
      const key = await deriveKey(p1, salt);
      /* Cifrar el estado actual (localStorage está en claro y al día) */
      const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      const s = JSON.parse(localStorage.getItem(SNAPSHOTS_KEY) || '[]');
      const encD = d ? await encryptJSON(key, d) : null;
      const encS = await encryptJSON(key, s);
      /* Commit atómico: solo tras cifrar con éxito */
      localStorage.setItem(ENC_SALT, salt);
      if (encD) localStorage.setItem(STORAGE_KEY, encD);
      localStorage.setItem(SNAPSHOTS_KEY, encS);
      localStorage.setItem(ENC_FLAG, '1');
      __encKey = key;
      if (d) __decryptedCache[STORAGE_KEY] = d;
      __decryptedCache[SNAPSHOTS_KEY] = s;
      setEnabled(true);
      reset();
      showToast('Cifrado activado. Tus datos están protegidos en reposo.', 'success');
    } catch (e) {
      showToast('Error activando cifrado: ' + e.message, 'error');
      setBusy(false);
    }
  };

  const disable = async () => {
    if (!p1) return;
    setBusy(true);
    try {
      const key = await deriveKey(p1, localStorage.getItem(ENC_SALT));
      const d = await decryptJSON(key, localStorage.getItem(STORAGE_KEY)); /* GCM valida la passphrase */
      const s = localStorage.getItem(SNAPSHOTS_KEY) ? await decryptJSON(key, localStorage.getItem(SNAPSHOTS_KEY)) : [];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
      localStorage.setItem(SNAPSHOTS_KEY, JSON.stringify(s));
      localStorage.removeItem(ENC_FLAG);
      localStorage.removeItem(ENC_SALT);
      __encKey = null;
      __decryptedCache = {};
      setEnabled(false);
      reset();
      showToast('Cifrado desactivado. Los datos vuelven a estar en claro.', 'success');
    } catch {
      showToast('Passphrase incorrecta', 'error');
      setBusy(false);
    }
  };

  return (
    <div className="border-t border-slate-800 pt-4">
      <h3 className="font-bold text-rose-400 text-sm uppercase tracking-wider mb-2"><i className="fa-solid fa-lock mr-1"></i>Cifrado local</h3>
      <div className="flex items-center justify-between flex-wrap gap-2">
        <div className="text-xs text-slate-400">
          {enabled
            ? <span><i className="fa-solid fa-shield-halved text-emerald-400 mr-1"></i>Activo: AES-256-GCM. Se pedirá la passphrase al abrir la app.</span>
            : <span>Tus posiciones están en texto plano en este navegador. Actívalo para cifrarlas en reposo.</span>}
        </div>
        {!mode && (
          enabled
            ? <button onClick={() => setMode('disable')} className="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded text-sm">Desactivar</button>
            : <button onClick={() => setMode('enable')} className="bg-rose-600 hover:bg-rose-500 px-3 py-2 rounded text-sm"><i className="fa-solid fa-lock mr-1"></i>Activar cifrado</button>
        )}
      </div>

      {mode === 'enable' && (
        <div className="mt-3 glass-card p-3 space-y-2">
          <div className="text-[11px] text-amber-300 bg-amber-400/10 border border-amber-800/30 rounded-lg p-2">
            <i className="fa-solid fa-triangle-exclamation mr-1"></i>
            <b>No hay recuperación de passphrase.</b> Si la olvidas, solo podrás restaurar desde un backup (Google Drive o JSON, que van sin cifrar). Haz un backup antes de continuar.
          </div>
          <input type="password" value={p1} onChange={e => setP1(e.target.value)} placeholder="Passphrase (mín. 8 caracteres)"
            className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
          <input type="password" value={p2} onChange={e => setP2(e.target.value)} placeholder="Repite la passphrase"
            onKeyDown={e => e.key === 'Enter' && enable()}
            className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
          <div className="flex gap-2">
            <button onClick={enable} disabled={busy} className="flex-1 bg-rose-600 hover:bg-rose-500 disabled:opacity-50 py-2 rounded-lg text-sm font-bold">
              {busy ? <i className="fa-solid fa-spinner fa-spin"></i> : 'Cifrar mis datos'}
            </button>
            <button onClick={reset} className="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg text-sm">Cancelar</button>
          </div>
        </div>
      )}

      {mode === 'disable' && (
        <div className="mt-3 glass-card p-3 space-y-2">
          <input type="password" value={p1} onChange={e => setP1(e.target.value)} placeholder="Passphrase actual"
            onKeyDown={e => e.key === 'Enter' && disable()} autoFocus
            className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
          <div className="flex gap-2">
            <button onClick={disable} disabled={busy || !p1} className="flex-1 bg-slate-600 hover:bg-slate-500 disabled:opacity-50 py-2 rounded-lg text-sm font-bold">
              {busy ? <i className="fa-solid fa-spinner fa-spin"></i> : 'Desactivar y guardar en claro'}
            </button>
            <button onClick={reset} className="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg text-sm">Cancelar</button>
          </div>
        </div>
      )}

      <div className="text-xs text-slate-500 mt-2">
        <i className="fa-solid fa-circle-info mr-1 text-cyan-400"></i>
        Cifra datos y snapshots con clave derivada de tu passphrase (PBKDF2, 310k iteraciones). La clave nunca se guarda. Los backups de Drive/JSON siguen en claro a propósito: son tu vía de recuperación. price_history y fundamentales (datos públicos de mercado) no se cifran.
      </div>
    </div>
  );
};

const App = () => {
  const [data, setData] = useState(loadData);
  const [snapshots, setSnapshots] = useState(loadSnapshots);
  const [fundamentals, setFundamentals] = useState(loadFundamentals);
  const [tab, setTab] = useState('portfolio');
  const [finnhubKey, setFinnhubKey] = useState(() => localStorage.getItem(FINNHUB_KEY_STORE) || '');
  const [claudeKey, setClaudeKey] = useState(() => localStorage.getItem(CLAUDE_KEY_STORE) || '');
  const [showSettings, setShowSettings] = useState(false);
  const [importDialog, setImportDialog] = useState({ open: false });
  const [hidden, setHidden] = useState(() => localStorage.getItem('privacy_hidden') === 'true');
  const fileInputRef = useRef(null);

  /* ===== Google Drive sync states ===== */
  const [gdriveReady, setGdriveReady] = useState(false); /* SDK cargado */
  const [gdriveConnected, setGdriveConnected] = useState(false); /* token activo */
  const [gdriveStatus, setGdriveStatus] = useState('idle'); /* idle | syncing | synced | error */
  const [gdriveLastSync, setGdriveLastSync] = useState(() => localStorage.getItem('gdrive_last_sync') || null);
  const [gdriveError, setGdriveError] = useState(null);
  const [gdriveAutoSync, setGdriveAutoSync] = useState(() => localStorage.getItem('gdrive_autosync') === 'true');
  const syncTimerRef = useRef(null);

  /* Esperar a que el SDK de Google cargue */
  useEffect(() => {
    let attempts = 0;
    const checkSDK = setInterval(() => {
      attempts++;
      if (window.google?.accounts?.oauth2) {
        const ok = gdrive.initTokenClient((token, err) => {
          if (err) {
            setGdriveError('Error de autorización: ' + err);
            setGdriveConnected(false);
            setGdriveStatus('error');
            return;
          }
          setGdriveConnected(true);
          setGdriveError(null);
          /* Tras conectar, hacer pull inicial */
          gdrivePull();
        });
        if (ok) { setGdriveReady(true); clearInterval(checkSDK); }
      }
      if (attempts > 40) clearInterval(checkSDK); /* timeout ~20s */
    }, 500);
    return () => clearInterval(checkSDK);
  // eslint-disable-next-line
  }, []);

  /* Conectar a Drive (dispara popup OAuth) */
  const gdriveConnect = () => {
    setGdriveError(null);
    setGdriveStatus('syncing');
    gdrive.requestAuth(true);
  };

  /* Desconectar */
  const gdriveDisconnect = () => {
    gdrive.signOut();
    setGdriveConnected(false);
    setGdriveStatus('idle');
    localStorage.setItem('gdrive_autosync', 'false');
    setGdriveAutoSync(false);
  };

  /* PUSH: subir datos locales a Drive */
  const gdrivePush = async () => {
    if (!gdrive.accessToken) { setGdriveError('No conectado a Drive'); return; }
    setGdriveStatus('syncing');
    try {
      const payload = {
        appVersion: APP_VERSION,
        savedAt: new Date().toISOString(),
        data,
        snapshots: loadSnapshots(),
        fundamentals: loadFundamentals()
      };
      await gdrive.writeFile(payload);
      const ts = new Date().toISOString();
      localStorage.setItem('gdrive_last_sync', ts);
      setGdriveLastSync(ts);
      setGdriveStatus('synced');
      setGdriveError(null);
    } catch (e) {
      setGdriveStatus('error');
      setGdriveError(e.message);
    }
  };

  /* PULL: descargar datos de Drive y aplicarlos */
  const gdrivePull = async () => {
    if (!gdrive.accessToken) return;
    setGdriveStatus('syncing');
    try {
      const remote = await gdrive.readFile();
      if (!remote || !remote.data) {
        /* No hay archivo en Drive aún: subimos el local como primer estado */
        await gdrivePush();
        return;
      }
      /* Resolución de conflicto: comparar timestamps */
      const remoteTime = new Date(remote.savedAt || 0).getTime();
      const localSyncTime = localStorage.getItem('gdrive_last_sync')
        ? new Date(localStorage.getItem('gdrive_last_sync')).getTime() : 0;

      const applyRemote = () => {
        if (remote.data) { setData(remote.data); persistData(remote.data); }
        if (remote.snapshots) { persistSnapshots(remote.snapshots); setSnapshots(remote.snapshots); }
        if (remote.fundamentals) { persistFundamentals(remote.fundamentals); setFundamentals(remote.fundamentals); }
        const ts = new Date().toISOString();
        localStorage.setItem('gdrive_last_sync', ts);
        setGdriveLastSync(ts);
        setGdriveStatus('synced');
      };

      if (remoteTime > localSyncTime) {
        /* Drive tiene datos más nuevos */
        const localHoldings = data.holdings?.length || 0;
        const remoteHoldings = remote.data.holdings?.length || 0;
        if (localHoldings > 0 && localHoldings !== remoteHoldings) {
          /* Posible conflicto: preguntar */
          if (confirm(`Google Drive tiene una versión más reciente (${remoteHoldings} posiciones) que la local (${localHoldings} posiciones).\n\n¿Cargar la versión de Drive? (Cancelar = mantener la local y subirla)`)) {
            applyRemote();
          } else {
            await gdrivePush();
          }
        } else {
          applyRemote();
        }
      } else {
        /* Local es igual o más nuevo: subir local */
        await gdrivePush();
      }
    } catch (e) {
      setGdriveStatus('error');
      setGdriveError(e.message);
    }
  };

  /* Auto-sync: si está activo, push 3s después de cada cambio en data */
  useEffect(() => {
    if (!gdriveAutoSync || !gdriveConnected) return;
    if (syncTimerRef.current) clearTimeout(syncTimerRef.current);
    syncTimerRef.current = setTimeout(() => { gdrivePush(); }, 3000);
    return () => { if (syncTimerRef.current) clearTimeout(syncTimerRef.current); };
  // eslint-disable-next-line
  }, [data, snapshots, fundamentals, gdriveAutoSync, gdriveConnected]);

  const toggleAutoSync = () => {
    setGdriveAutoSync(v => {
      const next = !v;
      localStorage.setItem('gdrive_autosync', String(next));
      return next;
    });
  };


  const toggleHidden = () => {
    setHidden(h => {
      const next = !h;
      localStorage.setItem('privacy_hidden', String(next));
      window.__privacy_hidden = next;
      return next;
    });
  };

  /* Inicializar flag global al cargar */
  useEffect(() => { window.__privacy_hidden = hidden; }, [hidden]);

  /* Sync snapshots desde localStorage cuando cambian */
  useEffect(() => {
    const id = setInterval(() => {
      const s = loadSnapshots();
      if (JSON.stringify(s) !== JSON.stringify(snapshots)) setSnapshots(s);
    }, 2000);
    return () => clearInterval(id);
  }, [snapshots]);

  useEffect(() => { localStorage.setItem(FINNHUB_KEY_STORE, finnhubKey); }, [finnhubKey]);
  useEffect(() => { localStorage.setItem(CLAUDE_KEY_STORE, claudeKey); }, [claudeKey]);

  useEffect(() => {
    const last = localStorage.getItem(LAST_BACKUP_STORE);
    if (data.holdings.length === 0) return;
    if (!last) { localStorage.setItem(LAST_BACKUP_STORE, new Date().toISOString()); return; }

      setTimeout(() => {
        if (confirm(`Han pasado ${Math.floor(days)} días sin backup. ¿Descargar?`)) downloadBackup(data);
        else localStorage.setItem(LAST_BACKUP_STORE, new Date().toISOString());
      }, 2000);
    }
  }, []);

  const updateTrm = (cur, val) => {
    const next = { ...data, trms: { ...data.trms, [cur]: parseFloat(val) || 0 } };
    setData(next); persistData(next);
  };

  const [fxRefreshing, setFxRefreshing] = useState(false);
  const [fxLastUpdate, setFxLastUpdate] = useState(() => localStorage.getItem('fx_last_update') || null);
  const [fxSource, setFxSource] = useState(() => localStorage.getItem('fx_source') || null);
  const [fxStatus, setFxStatus] = useState(null); /* { ok, msg, date } */

  const refreshFX = async (silent = false) => {

    }
    setData(next); persistData(next);
    setImportDialog({ open: false });
  };

  return (

                    <button onClick={() => refreshFX(false)} disabled={fxRefreshing} className="text-cyan-400 hover:text-cyan-300 disabled:opacity-50">
                      <i className={`fa-solid fa-rotate text-[10px] ${fxRefreshing ? 'fa-spin' : ''}`}></i>

                <button onClick={toggleHidden} title={hidden ? 'Mostrar valores' : 'Ocultar valores'} className={`px-2.5 py-1.5 rounded-lg text-xs font-medium ${hidden ? 'bg-amber-600/20 text-amber-400 border border-amber-600/30' : 'bg-slate-800/50 text-slate-400 border border-slate-700/50 hover:text-white'}`}>
                  <i className={`fa-solid ${hidden ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                  <span className="hidden sm:inline ml-1">{hidden ? 'Discreto' : 'Visible'}</span>

            <div className="border-t border-slate-800 pt-4">

              <div className="flex flex-wrap gap-2">
                <button onClick={() => downloadBackup(data)} className="bg-green-600 hover:bg-green-500 px-3 py-2 rounded text-sm"><i className="fa-solid fa-download mr-1"></i>Backup JSON (incl. snapshots)</button>
                <button onClick={() => fileInputRef.current?.click()} className="bg-blue-600 hover:bg-blue-500 px-3 py-2 rounded text-sm"><i className="fa-solid fa-upload mr-1"></i>Importar JSON</button>
                <button onClick={() => exportLedgerCSV(data, 'all')} className="bg-purple-600 hover:bg-purple-500 px-3 py-2 rounded text-sm"><i className="fa-solid fa-file-csv mr-1"></i>Libro contable completo</button>

                />

              </label>

                <>

                    <i className="fa-solid fa-info-circle mr-1 text-amber-400"></i>
                    Tienes <span className="font-bold text-amber-400">{data.holdings.filter(h => isPseudoCashOrEmpty(h)).length}</span> posición(es) ocultas (efectivo legacy o saldo cero). Siguen en el backup JSON.

                  <button onClick={() => {
                    const toDelete = data.holdings.filter(h => isPseudoCashOrEmpty(h));
                    if (!toDelete.length) return;
                    const list = toDelete.map(h => h.symbol || '(sin símbolo)').join(', ');
                    if (!confirm(`¿Eliminar PERMANENTEMENTE estas ${toDelete.length} posiciones?\n\n${list}\n\nEsta acción NO se puede deshacer (excepto restaurando un backup).`)) return;
                    const next = { ...data, holdings: data.holdings.filter(h => !isPseudoCashOrEmpty(h)) };
                    setData(next); persistData(next);
                    alert(`${toDelete.length} posición(es) eliminada(s) permanentemente.`);
                  }} className="mt-2 bg-red-700 hover:bg-red-600 px-3 py-1.5 rounded text-xs">

                  </button>

            <div className="border-t border-slate-800 pt-4">

                  <input type="password" value={claudeKey} onChange={e => setClaudeKey(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm" />

            <div className="border-t border-slate-800 pt-4">

                <button onClick={() => refreshFX(false)} disabled={fxRefreshing} className="bg-yellow-700 hover:bg-yellow-600 disabled:opacity-50 px-3 py-1 rounded text-xs font-bold">

                </div>
                <div>
                  <label className="text-xs text-slate-400 block mb-1">EUR/COP</label>
                  <input type="number" step="any" value={data.trms.EUR} onChange={e => updateTrm('EUR', e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm" />
                </div>
              </div>
              {fxLastUpdate && (
                <div className="text-xs text-slate-500 mt-2">
                  <i className="fa-solid fa-clock mr-1"></i>Última actualización: {new Date(fxLastUpdate).toLocaleString('es-ES')} {fxSource && <span className="text-cyan-400">· fuente: {fxSource}</span>}

                    <div className="text-xs text-slate-400">Posiciones: <span className="text-white">{importDialog.parsed.holdings.length}</span></div>

/* ============================================================
   PANTALLA DE DESBLOQUEO + GATE DE ARRANQUE
   App solo se monta tras descifrar — loadData() encuentra el caché listo.
   ============================================================ */
const UnlockScreen = ({ onUnlocked }) => {
  const [pass, setPass] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const tryUnlock = async () => {
    if (!pass || busy) return;
    setBusy(true); setError('');
    try {
      const key = await deriveKey(pass, localStorage.getItem(ENC_SALT));
      const rawData = localStorage.getItem(STORAGE_KEY);
      if (rawData) __decryptedCache[STORAGE_KEY] = await decryptJSON(key, rawData);
      const rawSnaps = localStorage.getItem(SNAPSHOTS_KEY);
      if (rawSnaps) __decryptedCache[SNAPSHOTS_KEY] = await decryptJSON(key, rawSnaps);
      __encKey = key;
      onUnlocked();
    } catch {
      setError('Passphrase incorrecta');
      setBusy(false);
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-4">
      <div className="glass-card p-8 max-w-sm w-full text-center animate-fade-in">
        <div className="text-4xl mb-3"><i className="fa-solid fa-lock text-cyan-400"></i></div>
        <h1 className="text-lg font-bold mb-1 bg-gradient-to-r from-cyan-400 to-blue-400 bg-clip-text text-transparent">Portfolio Cockpit</h1>
        <div className="text-xs text-slate-400 mb-5">Tus datos están cifrados localmente.</div>
        <input type="password" value={pass} onChange={e => setPass(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && tryUnlock()}
          autoFocus placeholder="Passphrase"
          className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-center mb-3 focus:border-cyan-600 outline-none" />
        {error && <div className="text-xs text-rose-400 mb-3"><i className="fa-solid fa-circle-xmark mr-1"></i>{error}</div>}
        <button onClick={tryUnlock} disabled={busy || !pass}
          className="w-full bg-cyan-600 hover:bg-cyan-500 disabled:opacity-50 py-2.5 rounded-lg text-sm font-bold transition-all">
          {busy ? <i className="fa-solid fa-spinner fa-spin"></i> : <span><i className="fa-solid fa-unlock mr-1.5"></i>Desbloquear</span>}
        </button>
        <div className="text-[10px] text-slate-600 mt-4">¿Olvidaste la passphrase? Limpia los datos del sitio y restaura desde tu backup de Google Drive o JSON.</div>
      </div>
    </div>
  );
};

const Root = () => {
  const [unlocked, setUnlocked] = useState(() => !isEncrypted());
  const [phReady, setPhReady] = useState(false);
  useEffect(() => { phInit().then(() => setPhReady(true)).catch(() => setPhReady(true)); }, []);
  if (!phReady) return (
    <div className="min-h-screen flex items-center justify-center">
      <i className="fa-solid fa-circle-notch fa-spin text-2xl text-cyan-600"></i>
    </div>
  );
  if (!unlocked) return <UnlockScreen onUnlocked={() => setUnlocked(true)} />;
  return <App />;
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Root />);
</script>

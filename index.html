/* ============================================================
   IMPORT IBKR — Parser de Activity Statement CSV (ES/EN)
   Secciones: Trades/Operaciones, Dividends/Dividendos,
   Open Positions/Posiciones abiertas, Transfers/Transferencias
   ============================================================ */
const parseIBKRcsv = (text) => {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l);
  const sections = { trades: [], dividends: [], openPositions: [], transfers: [] };
  const sectionHeaders = {};

  const parseCSVline = (line) => {
    const result = []; let current = ''; let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQuotes = !inQuotes; continue; }
      if (c === ',' && !inQuotes) { result.push(current.trim()); current = ''; continue; }
      current += c;
    }
    result.push(current.trim());
    return result;
  };

  /* Mapa de secciones: nombre CSV (lowercase) → clave interna */
  const sectionMap = {
    'trades': 'trades', 'operaciones': 'trades', 'transacciones': 'trades', 'ejecuciones': 'trades',
    'dividends': 'dividends', 'dividendos': 'dividends',
    'open positions': 'openPositions', 'posiciones abiertas': 'openPositions', 'posiciones': 'openPositions',
    'transfers': 'transfers', 'transferencias': 'transfers',
    'withholding tax': 'dividends', 'retención fiscal': 'dividends'
  };

  for (const line of lines) {
    const cols = parseCSVline(line);
    if (cols.length < 3) continue;
    const sectionRaw = cols[0].toLowerCase();
    const rowType = cols[1];
    const sectionKey = sectionMap[sectionRaw];
    if (!sectionKey) continue;

    if (rowType === 'Header' || rowType === 'Encabezado') {
      sectionHeaders[sectionKey] = cols.slice(2);
    } else if (rowType === 'Data' || rowType === 'Datos') {
      const thirdCol = (cols[2] || '').toLowerCase();
      if (thirdCol === 'total' || thirdCol.startsWith('total ') || thirdCol === 'totales' || thirdCol.startsWith('subtotal')) continue;
      const headers = sectionHeaders[sectionKey] || [];
      const row = {};
      cols.slice(2).forEach((v, i) => { if (headers[i]) row[headers[i]] = v; });
      sections[sectionKey].push(row);
    }
  }
  return sections;
};

/* Normaliza un trade (soporta columnas ES y EN) */
const normalizeIBKRtrade = (raw) => {
  const symbol = (raw['Symbol'] || raw['Símbolo'] || '').trim().toUpperCase();
  const dateRaw = raw['Date/Time'] || raw['Fecha/Hora'] || raw['TradeDate'] || '';
  const date = dateRaw.split(',')[0]?.trim() || dateRaw.split(' ')[0]?.trim() || '';
  const quantity = Math.abs(parseFloat(raw['Quantity'] || raw['Cantidad'] || 0));
  const price = Math.abs(parseFloat(raw['T. Price'] || raw['Precio T.'] || raw['Price'] || raw['Precio'] || 0));
  const commission = Math.abs(parseFloat(raw['Comm/Fee'] || raw['Comisión'] || raw['Com/Tarifa'] || 0));
  const currency = (raw['Currency'] || raw['Divisa'] || 'USD').trim().toUpperCase();
  const category = raw['Asset Category'] || raw['Categoría de activo'] || 'Stocks';
  const qtyRaw = parseFloat(raw['Quantity'] || raw['Cantidad'] || 0);
  const isBuy = qtyRaw > 0;
  return { symbol, date, quantity, price, commission, currency, category, isBuy, raw };
};

/* Normaliza un dividendo */
const normalizeIBKRdividend = (raw) => {
  const currency = (raw['Currency'] || raw['Divisa'] || 'USD').trim().toUpperCase();
  const date = (raw['Date'] || raw['Fecha'] || '').trim();
  const description = raw['Description'] || raw['Descripción'] || '';
  const amount = Math.abs(parseFloat(raw['Amount'] || raw['Cantidad'] || raw['Importe'] || 0));
  const symMatch = description.match(/^([A-Z0-9.]+)\s*[\s(]/);
  const symbol = symMatch ? symMatch[1].toUpperCase() : '';
  return { symbol, date, amount, currency, description, raw };
};

/* Normaliza una posición abierta */
const normalizeIBKRposition = (raw) => {
  const symbol = (raw['Symbol'] || raw['Símbolo'] || '').trim().toUpperCase();
  const quantity = Math.abs(parseFloat(raw['Quantity'] || raw['Cantidad'] || 0));
  const costBasis = Math.abs(parseFloat(raw['Cost Price'] || raw['Precio de coste'] || 0));
  const closePrice = Math.abs(parseFloat(raw['Close Price'] || raw['Precio de cierre'] || 0));
  const currency = (raw['Currency'] || raw['Divisa'] || 'USD').trim().toUpperCase();
  const category = raw['Asset Category'] || raw['Categoría de activo'] || 'Stocks';
  return { symbol, quantity, costBasis, closePrice, currency, category, raw };
};

/* Normaliza una transferencia */
const normalizeIBKRtransfer = (raw) => {
  const symbol = (raw['Symbol'] || raw['Símbolo'] || '').trim().toUpperCase();
  const date = (raw['Date'] || raw['Fecha'] || '').trim();
  const quantity = Math.abs(parseFloat(raw['Quantity'] || raw['Cant.'] || 0));
  const direction = (raw['Direction'] || raw['Dirección'] || '').trim().toLowerCase();
  const currency = (raw['Currency'] || raw['Divisa'] || 'USD').trim().toUpperCase();
  const marketValue = Math.abs(parseFloat(raw['Market Value'] || raw['Valor de mercado'] || 0));
  const category = raw['Asset Category'] || raw['Categoría de activo'] || 'Stocks';
  const isIncoming = direction === 'in' || direction === 'en' || direction === 'entrada';
  return { symbol, date, quantity, currency, category, marketValue, isIncoming, raw };
};

];
const calcRSI = (prices, period = 14) => {
  if (!prices || prices.length < period + 1) return null;
  const sorted = [...prices].sort((a, b) => a.date.localeCompare(b.date));
  const closes = sorted.map(p => p.close);
  const changes = [];
  for (let i = 1; i < closes.length; i++) changes.push(closes[i] - closes[i - 1]);
  if (changes.length < period) return null;
  let avgGain = 0, avgLoss = 0;
  for (let i = 0; i < period; i++) { if (changes[i] > 0) avgGain += changes[i]; else avgLoss += Math.abs(changes[i]); }
  avgGain /= period; avgLoss /= period;
  for (let i = period; i < changes.length; i++) {
    const gain = changes[i] > 0 ? changes[i] : 0;
    const loss = changes[i] < 0 ? Math.abs(changes[i]) : 0;
    avgGain = (avgGain * (period - 1) + gain) / period;
    avgLoss = (avgLoss * (period - 1) + loss) / period;
  }
  if (avgLoss === 0) return 100;
  return 100 - (100 / (1 + avgGain / avgLoss));
};
const getSectorRSIData = () => {
  const history = phGetAll();
  return SECTORS.map(sec => {
    const prices = history[sec.etf] || [];
    const rsi = calcRSI(prices);
    const sorted = [...prices].sort((a, b) => a.date.localeCompare(b.date));
    const lastClose = sorted.length > 0 ? sorted[sorted.length - 1].close : null;
    const prevClose = sorted.length > 1 ? sorted[sorted.length - 2].close : null;
    const dayChange = lastClose && prevClose ? ((lastClose - prevClose) / prevClose) * 100 : null;
    return { ...sec, rsi, dataPoints: prices.length, dayChange };
  }).sort((a, b) => (b.rsi || 0) - (a.rsi || 0));
};
const rsiColor = (rsi) => {
  if (rsi >= 70) return { bar: '#34d399', label: 'text-emerald-400' };
  if (rsi >= 50) return { bar: '#34d399', label: 'text-emerald-400' };
  if (rsi >= 30) return { bar: '#f59e0b', label: 'text-amber-400' };
  return { bar: '#f43f5e', label: 'text-rose-400' };
};
/* Fetch inteligente de ETFs sectoriales — reutilizable */
const fetchSectorETFs = async (finnhubKey) => {
  const today = new Date().toISOString().split('T')[0];
  let fetched = 0;
  for (const etf of SECTOR_ETFS_LIST) {
    try {
      if (phGet(etf).some(p => p.date === today)) continue; /* ya tenemos hoy */
      const eq = await finnhub.quote(etf, finnhubKey);
      if (eq && eq.c > 0 && phAppend(etf, today, eq.c)) fetched++;
      await new Promise(r => setTimeout(r, 60));
    } catch {}
  }
  return fetched;
};

/* ============================================================
   VISTA FISCAL ANUAL
   Resumen de plusvalías, minusvalías, dividendos y base imponible
   por año, con desglose por activo y exportación CSV.
   ============================================================ */
const FiscalSection = ({ data, viewCurrency }) => {
  /* Años disponibles a partir de ventas y dividendos */
  const availableYears = useMemo(() => {
    const years = new Set();
    (data.sales || []).forEach(s => { if (s.date) years.add(s.date.slice(0, 4)); });
    (data.dividends || []).forEach(d => { if (d.date) years.add(d.date.slice(0, 4)); });
    /* Añadir año actual siempre */
    years.add(new Date().getFullYear().toString());
    return [...years].sort().reverse();
  }, [data]);

  const [year, setYear] = useState(() => new Date().getFullYear().toString());

  /* Ventas del año seleccionado */
  const yearSales = useMemo(() => {
    return (data.sales || []).filter(s => s.date && s.date.startsWith(year)).map(s => {
      const plView = convert(s.realizedPL_native || 0, s.currency, viewCurrency, data.trms);
      const proceeds = convert(s.shares * s.sellPrice - (s.commission || 0), s.currency, viewCurrency, data.trms);
      /* Determinar si es largo plazo (>365 días desde compra) */
      const holdingDays = s.purchaseDate ? daysBetween(s.purchaseDate, s.date) : 0;
      const isLongTerm = holdingDays > 365;
      return { ...s, plView, proceeds, holdingDays, isLongTerm };
    });
  }, [data, year, viewCurrency]);

  /* Dividendos del año seleccionado */
  const yearDividends = useMemo(() => {
    return (data.dividends || []).filter(d => d.date && d.date.startsWith(year)).map(d => ({
      ...d, amountView: convert(d.amount, d.currency, viewCurrency, data.trms)
    }));
  }, [data, year, viewCurrency]);

  /* KPIs fiscales */
  const kpis = useMemo(() => {
    const gains = yearSales.filter(s => s.plView >= 0).reduce((sum, s) => sum + s.plView, 0);
    const losses = yearSales.filter(s => s.plView < 0).reduce((sum, s) => sum + s.plView, 0);
    const netPL = gains + losses;
    const totalDivs = yearDividends.reduce((sum, d) => sum + d.amountView, 0);
    const taxableBase = Math.max(0, netPL) + totalDivs; /* En España, las pérdidas compensan ganancias pero no dividendos directamente */
    const compensable = Math.min(0, losses); /* Pérdidas que se pueden compensar con ganancias futuras (4 años) */

    /* Plusvalías por activo */
    const bySymbol = {};
    yearSales.forEach(s => {
      if (!bySymbol[s.symbol]) bySymbol[s.symbol] = { symbol: s.symbol, gains: 0, losses: 0, operations: 0 };
      if (s.plView >= 0) bySymbol[s.symbol].gains += s.plView;
      else bySymbol[s.symbol].losses += s.plView;
      bySymbol[s.symbol].operations++;
    });
    const bySymbolArr = Object.values(bySymbol).sort((a, b) => (b.gains + b.losses) - (a.gains + a.losses));

    /* Dividendos por activo */
    const divBySymbol = {};
    yearDividends.forEach(d => {
      if (!divBySymbol[d.symbol]) divBySymbol[d.symbol] = { symbol: d.symbol, total: 0, count: 0 };
      divBySymbol[d.symbol].total += d.amountView;
      divBySymbol[d.symbol].count++;
    });
    const divBySymbolArr = Object.values(divBySymbol).sort((a, b) => b.total - a.total);

    /* Plusvalías latentes (no realizadas) */
    const realHoldings = data.holdings.filter(h => !isPseudoCashOrEmpty(h));
    let unrealizedGains = 0, unrealizedLosses = 0;
    realHoldings.forEach(h => {
      const lots = h.lots || [];
      const costTotal = lots.reduce((s, l) => s + l.shares * l.costBasis + (l.commission || 0), 0);
      const valueTotal = h.shares * (h.currentPrice || h.costBasis);
      const pl = convert(valueTotal - costTotal, h.currency, viewCurrency, data.trms);
      if (pl >= 0) unrealizedGains += pl;
      else unrealizedLosses += pl;
    });

    /* Estimación de impuestos (tramos España 2025-2026 base del ahorro) */
    const estimateTax = (base) => {
      if (base <= 0) return 0;
      let tax = 0, remaining = base;
      const brackets = [
        { limit: 6000, rate: 0.19 },
        { limit: 44000, rate: 0.21 },
        { limit: 150000, rate: 0.23 },
        { limit: 100000, rate: 0.27 },
        { limit: Infinity, rate: 0.28 }
      ];
      for (const b of brackets) {
        const taxable = Math.min(remaining, b.limit);
        tax += taxable * b.rate;
        remaining -= taxable;
        if (remaining <= 0) break;
      }
      return tax;
    };

    const estimatedTax = estimateTax(taxableBase);

    return { gains, losses, netPL, totalDivs, taxableBase, compensable, bySymbolArr, divBySymbolArr, unrealizedGains, unrealizedLosses, estimatedTax };
  }, [yearSales, yearDividends, data, viewCurrency]);

  /* Exportar resumen fiscal como CSV */
  const exportFiscalCSV = () => {
    const rows = [
      ['Resumen Fiscal ' + year, '', '', ''],
      ['Concepto', 'Valor (' + viewCurrency + ')', '', ''],
      ['Plusvalías realizadas', kpis.gains.toFixed(2)],
      ['Minusvalías realizadas', kpis.losses.toFixed(2)],
      ['P/L neto realizado', kpis.netPL.toFixed(2)],
      ['Dividendos recibidos', kpis.totalDivs.toFixed(2)],
      ['Base imponible estimada', kpis.taxableBase.toFixed(2)],
      ['Impuesto estimado (España)', kpis.estimatedTax.toFixed(2)],
      ['', '', '', ''],
      ['Detalle de ventas', '', '', ''],
      ['Fecha', 'Símbolo', 'Acciones', 'P/L (' + viewCurrency + ')'],
      ...yearSales.map(s => [s.date, s.symbol, s.shares, s.plView.toFixed(2)]),
      ['', '', '', ''],
      ['Detalle de dividendos', '', '', ''],
      ['Fecha', 'Símbolo', 'Monto (' + viewCurrency + ')', ''],
      ...yearDividends.map(d => [d.date, d.symbol, d.amountView.toFixed(2), ''])
    ];
    const csv = rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
    downloadBlob(csv, `fiscal_${year}_${viewCurrency}.csv`, 'text/csv');
  };

  return (
    <div className="space-y-4">
      {/* Header con selector de año */}
      <div className="flex items-center justify-between flex-wrap gap-2">
        <div className="flex items-center gap-3">
          <div className="bg-gradient-to-br from-emerald-900/40 to-teal-900/30 border border-emerald-700/40 rounded-lg px-4 py-2">
            <i className="fa-solid fa-landmark text-emerald-400 text-xl mr-2"></i>
            <span className="text-sm font-bold text-emerald-300">Vista Fiscal</span>
          </div>
          <select value={year} onChange={e => setYear(e.target.value)} className="bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm font-mono">
            {availableYears.map(y => <option key={y} value={y}>{y}</option>)}
          </select>
        </div>
        <button onClick={exportFiscalCSV} className="bg-emerald-700 hover:bg-emerald-600 px-3 py-1.5 rounded text-sm">
          <i className="fa-solid fa-file-csv mr-1"></i>Exportar CSV fiscal
        </button>
      </div>

      {/* KPIs fiscales principales */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
        <div className="bg-slate-900 border border-green-800/40 rounded-lg p-3">
          <div className="text-[10px] text-slate-400 uppercase">Plusvalías realizadas</div>
          <div className="text-lg font-bold text-green-400 font-mono">{fmtMoney(kpis.gains, viewCurrency)}</div>
          <div className="text-[10px] text-slate-500">{yearSales.filter(s => s.plView >= 0).length} operaciones</div>
        </div>
        <div className="bg-slate-900 border border-red-800/40 rounded-lg p-3">
          <div className="text-[10px] text-slate-400 uppercase">Minusvalías realizadas</div>
          <div className="text-lg font-bold text-red-400 font-mono">{fmtMoney(kpis.losses, viewCurrency)}</div>
          <div className="text-[10px] text-slate-500">{yearSales.filter(s => s.plView < 0).length} operaciones</div>
        </div>
        <div className="bg-slate-900 border border-amber-800/40 rounded-lg p-3">
          <div className="text-[10px] text-slate-400 uppercase">Dividendos recibidos</div>
          <div className="text-lg font-bold text-amber-400 font-mono">{fmtMoney(kpis.totalDivs, viewCurrency)}</div>
          <div className="text-[10px] text-slate-500">{yearDividends.length} pagos</div>
        </div>
        <div className="bg-slate-900 border border-emerald-800/40 rounded-lg p-3">
          <div className="text-[10px] text-slate-400 uppercase">Base imponible est.</div>
          <div className="text-lg font-bold text-emerald-400 font-mono">{fmtMoney(kpis.taxableBase, viewCurrency)}</div>
          <div className="text-[10px] text-slate-500">P/L neto + dividendos</div>
        </div>
      </div>

      {/* Estimación impositiva España */}
      <div className="bg-gradient-to-br from-slate-900 to-slate-950 border border-slate-700 rounded-xl p-4">
        <div className="text-xs text-slate-400 uppercase tracking-wider mb-3"><i className="fa-solid fa-calculator mr-1 text-emerald-400"></i>Estimación impositiva (España — Base del ahorro)</div>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div>
            <div className="text-xs text-slate-400">P/L neto realizado</div>
            <div className={`text-xl font-bold font-mono ${kpis.netPL >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtMoney(kpis.netPL, viewCurrency)}</div>
          </div>
          <div>
            <div className="text-xs text-slate-400">Impuesto estimado</div>
            <div className="text-xl font-bold font-mono text-amber-400">{fmtMoney(kpis.estimatedTax, viewCurrency)}</div>
            <div className="text-[10px] text-slate-500">Tramos: 19% / 21% / 23% / 27% / 28%</div>
          </div>
          <div>
            <div className="text-xs text-slate-400">Tasa efectiva</div>
            <div className="text-xl font-bold font-mono text-slate-200">
              {kpis.taxableBase > 0 ? `${((kpis.estimatedTax / kpis.taxableBase) * 100).toFixed(1)}%` : '0%'}
            </div>
          </div>
        </div>
        {kpis.compensable < 0 && (
          <div className="mt-3 pt-3 border-t border-slate-800 text-xs text-slate-400">
            <i className="fa-solid fa-rotate-left mr-1 text-cyan-400"></i>
            Minusvalías compensables: <span className="text-red-400 font-bold">{fmtMoney(kpis.compensable, viewCurrency)}</span> — en España puedes compensar con plusvalías de los próximos 4 años.
          </div>
        )}
        <div className="mt-2 text-[10px] text-slate-600 italic">
          Estimación orientativa. Consulta a un asesor fiscal para tu situación específica. Los tramos aplican a la base del ahorro del IRPF español (régimen general, no Beckham).
        </div>
      </div>

      {/* Plusvalías por activo */}
      {kpis.bySymbolArr.length > 0 && (
        <div className="glass-card overflow-hidden">
          <div className="p-2.5 border-b border-slate-800 text-xs font-bold text-slate-300">
            <i className="fa-solid fa-chart-bar mr-1 text-green-400"></i>P/L realizado por activo ({year})
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-xs">
              <thead className="text-slate-500">
                <tr>
                  <th className="text-left p-2">Símbolo</th>
                  <th className="text-right p-2">Plusvalías</th>
                  <th className="text-right p-2">Minusvalías</th>
                  <th className="text-right p-2">Neto</th>
                  <th className="text-right p-2">Operaciones</th>
                </tr>
              </thead>
              <tbody>
                {kpis.bySymbolArr.map((s, i) => (
                  <tr key={i} className="border-t border-slate-800">
                    <td className="p-2 font-bold">{s.symbol}</td>
                    <td className="text-right p-2 font-mono text-green-400">{s.gains > 0 ? fmtMoney(s.gains, viewCurrency) : '—'}</td>
                    <td className="text-right p-2 font-mono text-red-400">{s.losses < 0 ? fmtMoney(s.losses, viewCurrency) : '—'}</td>
                    <td className={`text-right p-2 font-mono font-bold ${(s.gains + s.losses) >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtMoney(s.gains + s.losses, viewCurrency)}</td>
                    <td className="text-right p-2 text-slate-400">{s.operations}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* Dividendos por activo */}
      {kpis.divBySymbolArr.length > 0 && (
        <div className="glass-card overflow-hidden">
          <div className="p-2.5 border-b border-slate-800 text-xs font-bold text-slate-300">
            <i className="fa-solid fa-coins mr-1 text-amber-400"></i>Dividendos por activo ({year})
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-xs">
              <thead className="text-slate-500">
                <tr>
                  <th className="text-left p-2">Símbolo</th>
                  <th className="text-right p-2">Total</th>
                  <th className="text-right p-2">Pagos</th>
                </tr>
              </thead>
              <tbody>
                {kpis.divBySymbolArr.map((d, i) => (
                  <tr key={i} className="border-t border-slate-800">
                    <td className="p-2 font-bold">{d.symbol}</td>
                    <td className="text-right p-2 font-mono text-amber-400">{fmtMoney(d.total, viewCurrency)}</td>
                    <td className="text-right p-2 text-slate-400">{d.count}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* Detalle de operaciones realizadas */}
      {yearSales.length > 0 && (
        <div className="glass-card overflow-hidden">
          <div className="p-2.5 border-b border-slate-800 text-xs font-bold text-slate-300">
            <i className="fa-solid fa-list mr-1 text-cyan-400"></i>Detalle de operaciones ({year})
          </div>
          <div className="overflow-x-auto max-h-64 overflow-y-auto">
            <table className="w-full text-xs">
              <thead className="text-slate-500 sticky top-0 bg-slate-900">
                <tr>
                  <th className="text-left p-2">Fecha</th>
                  <th className="text-left p-2">Símbolo</th>
                  <th className="text-right p-2">Acciones</th>
                  <th className="text-right p-2">Precio venta</th>
                  <th className="text-right p-2">P/L</th>
                  <th className="text-center p-2">Plazo</th>
                </tr>
              </thead>
              <tbody>
                {yearSales.map((s, i) => (
                  <tr key={i} className="border-t border-slate-800">
                    <td className="p-2">{s.date}</td>
                    <td className="p-2 font-bold">{s.symbol}</td>
                    <td className="text-right p-2 font-mono">{fmt(s.shares, 4)}</td>
                    <td className="text-right p-2 font-mono">{fmtMoney(s.sellPrice, s.currency)}</td>
                    <td className={`text-right p-2 font-mono font-bold ${s.plView >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtMoney(s.plView, viewCurrency)}</td>
                    <td className="text-center p-2">
                      <span className={`text-[10px] px-1.5 py-0.5 rounded ${s.isLongTerm ? 'bg-green-900/40 text-green-400' : 'bg-amber-900/40 text-amber-400'}`}>
                        {s.isLongTerm ? 'L/P' : 'C/P'} ({s.holdingDays}d)
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* Plusvalías latentes (no realizadas) */}
      <div className="glass-card p-3">
        <div className="text-xs text-slate-400 uppercase tracking-wider mb-2">
          <i className="fa-solid fa-hourglass-half mr-1 text-purple-400"></i>Plusvalías latentes (si vendieras todo hoy)
        </div>
        <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
          <div className="bg-slate-950/50 rounded-lg p-2.5">
            <div className="text-[10px] text-slate-400 uppercase">Ganancias latentes</div>
            <div className="text-lg font-bold text-green-400 font-mono">{fmtMoney(kpis.unrealizedGains, viewCurrency)}</div>
          </div>
          <div className="bg-slate-950/50 rounded-lg p-2.5">
            <div className="text-[10px] text-slate-400 uppercase">Pérdidas latentes</div>
            <div className="text-lg font-bold text-red-400 font-mono">{fmtMoney(kpis.unrealizedLosses, viewCurrency)}</div>
          </div>
          <div className="bg-slate-950/50 rounded-lg p-2.5 col-span-2 md:col-span-1">
            <div className="text-[10px] text-slate-400 uppercase">Impuesto si vendieras hoy</div>
            <div className="text-lg font-bold text-amber-400 font-mono">
              {fmtMoney((() => {
                const base = Math.max(0, kpis.unrealizedGains + kpis.unrealizedLosses);
                let tax = 0, rem = base;
                const br = [{ l: 6000, r: 0.19 }, { l: 44000, r: 0.21 }, { l: 150000, r: 0.23 }, { l: 100000, r: 0.27 }, { l: Infinity, r: 0.28 }];
                for (const b of br) { const t = Math.min(rem, b.l); tax += t * b.r; rem -= t; if (rem <= 0) break; }
                return tax;
              })(), viewCurrency)}
            </div>
          </div>
        </div>
        <div className="text-[10px] text-slate-600 mt-2 italic">
          Estimación si se vendiera todo al precio actual. No incluye exenciones, deducciones ni régimen Beckham.
        </div>
      </div>

      {/* Sin datos */}
      {yearSales.length === 0 && yearDividends.length === 0 && (
        <div className="glass-card p-8 text-center text-sm text-slate-500">
          <i className="fa-solid fa-folder-open text-2xl mb-2"></i>
          <div>Sin operaciones realizadas ni dividendos registrados en {year}.</div>
          <div className="text-xs mt-1">Registra ventas o dividendos para ver el resumen fiscal.</div>
        </div>
      )}
    </div>
  );
};

const ImportIBKRSection = ({ data, setData, viewCurrency }) => {
  const { showToast } = useToast();
  const [parsed, setParsed] = useState(null);
  const [importing, setImporting] = useState(false);
  const [importLog, setImportLog] = useState([]);
  const [fetchTrms, setFetchTrms] = useState(true);
  const [progress, setProgress] = useState(0);
  const [selected, setSelected] = useState({}); /* { id: true/false } */

  const toggleSelect = (id) => setSelected(s => ({ ...s, [id]: !s[id] }));
  const selectAll = (items) => {
    const upd = {};
    items.forEach(it => { upd[it._id] = true; });
    setSelected(s => ({ ...s, ...upd }));
  };
  const deselectAll = (items) => {
    const upd = {};
    items.forEach(it => { upd[it._id] = false; });
    setSelected(s => ({ ...s, ...upd }));
  };
  const countSelected = (items) => items.filter(it => selected[it._id]).length;

  const handleFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const text = ev.target.result;
        const sections = parseIBKRcsv(text);
        const trades = sections.trades.map(normalizeIBKRtrade).filter(t => t.symbol && t.quantity > 0);
        const dividends = sections.dividends.map(normalizeIBKRdividend).filter(d => d.symbol && d.amount > 0);
        const openPos = sections.openPositions.map(normalizeIBKRposition).filter(p => p.symbol && p.quantity > 0);
        const transfers = sections.transfers.map(normalizeIBKRtransfer).filter(t => t.symbol && t.quantity > 0 && t.isIncoming);

        const existingSymbols = new Set(data.holdings.map(h => h.symbol));
        const existingHashes = new Set();
        data.holdings.forEach(h => {
          (h.lots || []).forEach(lot => {
            if (lot.shares != null && lot.costBasis != null) {
              existingHashes.add(`${h.symbol}_${lot.purchaseDate || ''}_${Number(lot.shares).toFixed(4)}_${Number(lot.costBasis).toFixed(4)}_B`);
            }
          });
        });
        const existingDivHashes = new Set();
        (data.dividends || []).forEach(d => {
          if (d.symbol && d.date && d.amount != null) {
            existingDivHashes.add(`${(d.symbol || '').toUpperCase()}_${d.date}_${Number(d.amount).toFixed(2)}`);
          }
        });

        /* Asignar IDs internos y marcar duplicados */
        let idx = 0;
        const buys = trades.filter(t => t.isBuy).map(t => ({ ...t, _id: `b${idx++}`, isDuplicate: existingHashes.has(tradeHash(t)) }));
        const sells = trades.filter(t => !t.isBuy).map(t => ({ ...t, _id: `s${idx++}` }));
        const divs = dividends.map(d => ({ ...d, _id: `d${idx++}`, isDuplicate: existingDivHashes.has(divHash(d)) }));
        const positions = openPos.map(p => ({ ...p, _id: `p${idx++}`, isDuplicate: existingSymbols.has(p.symbol) }));
        const xfers = transfers.map(t => ({ ...t, _id: `x${idx++}`, isDuplicate: existingSymbols.has(t.symbol) }));

        const totalItems = buys.length + sells.length + divs.length + positions.length + xfers.length;
        if (totalItems === 0) {
          showToast('El archivo no contiene operaciones importables.', 'error');
          return;
        }

        /* Pre-seleccionar: nuevos = seleccionados, duplicados = no */
        const sel = {};
        [...buys, ...sells, ...divs, ...positions, ...xfers].forEach(it => {
          sel[it._id] = !it.isDuplicate;
        });
        setSelected(sel);

        setParsed({ buys, sells, dividends: divs, openPos: positions, transfers: xfers, fileName: file.name });
        setImportLog([]);
        showToast(`Parseado: ${buys.length} compras, ${sells.length} ventas, ${divs.length} dividendos, ${positions.length} posiciones, ${xfers.length} transferencias`, 'success');
      } catch (err) {
        showToast('Error: ' + err.message, 'error');
      }
    };
    reader.readAsText(file);
  };

  const handleDrop = (e) => {
    e.preventDefault();
    const file = e.dataTransfer?.files?.[0];
    if (file) handleFile({ target: { files: [file] } });
  };

  /* Render helper para tablas de preview (no es componente React separado para evitar re-mount) */
  const renderPreviewTable = (title, icon, color, items, columns) => {
    if (!items || items.length === 0) return null;
    const selCount = countSelected(items);
    return (
      <div className="glass-card overflow-hidden">
        <div className="px-3 py-2 border-b border-slate-800/50 flex items-center justify-between">
          <span className={`text-xs font-bold ${color}`}><i className={`fa-solid ${icon} mr-1.5`}></i>{title} ({items.length})</span>
          <div className="flex items-center gap-2 text-[10px]">
            <span className="text-slate-400">{selCount} de {items.length}</span>
            <button onClick={() => selectAll(items)} className="text-cyan-400 hover:text-cyan-300">Todos</button>
            <button onClick={() => deselectAll(items)} className="text-slate-400 hover:text-white">Ninguno</button>
          </div>
        </div>
        <div className="overflow-x-auto max-h-48 overflow-y-auto">
          <table className="w-full text-xs">
            <thead className="text-slate-500 sticky top-0 bg-slate-900/95 backdrop-blur">
              <tr>
                <th className="w-8 p-1.5 text-center">
                  <input type="checkbox" checked={selCount === items.length && items.length > 0}
                    onChange={() => selCount === items.length ? deselectAll(items) : selectAll(items)} className="w-3 h-3" />
                </th>
                {columns.map((col, ci) => (
                  <th key={ci} className={`p-1.5 ${col.align === 'right' ? 'text-right' : 'text-left'}`}>{col.header}</th>
                ))}
                <th className="text-center p-1.5">Estado</th>
              </tr>
            </thead>
            <tbody>
              {items.map(item => (
                <tr key={item._id} className={`border-t border-slate-800/50 transition-opacity ${!selected[item._id] ? 'opacity-35' : ''}`}>
                  <td className="p-1.5 text-center">
                    <input type="checkbox" checked={!!selected[item._id]} onChange={() => toggleSelect(item._id)} className="w-3 h-3" />
                  </td>
                  {columns.map((col, ci) => (
                    <td key={ci} className={`p-1.5 ${col.align === 'right' ? 'text-right font-mono' : ''} ${col.bold ? 'font-bold' : ''} ${col.className || ''}`}>
                      {col.render ? col.render(item) : ''}
                    </td>
                  ))}
                  <td className="text-center p-1.5">
                    {item.isDuplicate ?
                      <span className="text-amber-400 text-[10px] bg-amber-400/10 px-1.5 py-0.5 rounded">Dup</span> :
                      <span className="text-emerald-400 text-[10px] bg-emerald-400/10 px-1.5 py-0.5 rounded">Nuevo</span>
                    }
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    );
  };

  const performImport = async () => {
    if (!parsed) return;
    setImporting(true);
    setProgress(0);
    const log = [];
    try {
    let nextData = { ...data, holdings: [...data.holdings], dividends: [...(data.dividends || [])], sales: [...(data.sales || [])] };

    /* Contar total seleccionados */
    const selBuys = parsed.buys.filter(t => selected[t._id]);
    const selSells = parsed.sells.filter(t => selected[t._id]);
    const selDivs = parsed.dividends.filter(d => selected[d._id]);
    const selPos = parsed.openPos.filter(p => selected[p._id]);
    const selXfers = parsed.transfers.filter(t => selected[t._id]);
    const totalOps = selBuys.length + selSells.length + selDivs.length + selPos.length + selXfers.length;
    if (totalOps === 0) { setImporting(false); showToast('Nada seleccionado', 'warn'); return; }
    let count = 0;
    const tick = () => { count++; setProgress(Math.round((count / totalOps) * 100)); };

    /* 1. Compras */
    for (const trade of selBuys) {
      let holdingIdx = nextData.holdings.findIndex(h => h.symbol === trade.symbol && h.type !== 'cash');
      if (holdingIdx < 0) {
        nextData.holdings.push({
          id: `imp_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
          symbol: trade.symbol, type: 'asset', currency: trade.currency,
          shares: 0, currentPrice: trade.price, costBasis: trade.price,
          category: trade.category === 'Stocks' || trade.category === 'Acciones' ? 'Otros' : trade.category,
          lots: [], notes: 'IBKR import'
        });
        holdingIdx = nextData.holdings.length - 1;
      }
      let txSnapshot = { USD: trade.quantity * trade.price, EUR: 0, COP: 0 };
      let txTrms = { ...nextData.trms };
      if (fetchTrms && trade.date) {
        try {
          const r1 = await fetch(`https://api.frankfurter.app/${trade.date}?from=USD&to=COP`);
          if (r1.ok) { const d = await r1.json(); if (d.rates?.COP) { txTrms.USD = d.rates.COP; txSnapshot.COP = trade.quantity * trade.price * d.rates.COP; } }
          const r2 = await fetch(`https://api.frankfurter.app/${trade.date}?from=USD&to=EUR`);
          if (r2.ok) { const d = await r2.json(); if (d.rates?.EUR) { txTrms.EUR = 1 / d.rates.EUR; txSnapshot.EUR = trade.quantity * trade.price * d.rates.EUR; } }
          await new Promise(r => setTimeout(r, 120));
        } catch {}
      }
      const lot = { id: `lot_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`, shares: trade.quantity, costBasis: trade.price, commission: trade.commission, purchaseDate: trade.date, txSnapshot, txTrms };
      const h = nextData.holdings[holdingIdx];
      h.lots = [...(h.lots || []), lot].sort((a, b) => (a.purchaseDate || '').localeCompare(b.purchaseDate || ''));
      h.shares = h.lots.reduce((s, l) => s + l.shares, 0);
      h.currentPrice = trade.price;
      tick();
      log.push(`✅ Compra: ${trade.symbol} × ${fmt(trade.quantity, 4)} @ ${fmtMoney(trade.price, trade.currency)} [${trade.date}]`);
    }

    /* 2. Ventas */
    for (const trade of selSells) {
      nextData.sales.push({
        id: `sale_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
        symbol: trade.symbol, date: trade.date, shares: trade.quantity,
        sellPrice: trade.price, commission: trade.commission, currency: trade.currency,
        realizedPL_native: 0, notes: 'IBKR import'
      });
      tick();
      log.push(`📤 Venta: ${trade.symbol} × ${fmt(trade.quantity, 4)} @ ${fmtMoney(trade.price, trade.currency)} [${trade.date}]`);
    }

    /* 3. Dividendos */
    for (const div of selDivs) {
      nextData.dividends.push({
        id: `div_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
        symbol: div.symbol, date: div.date, amount: div.amount,
        currency: div.currency, notes: div.description
      });
      tick();
      log.push(`💰 Dividendo: ${div.symbol} ${fmtMoney(div.amount, div.currency)} [${div.date}]`);
    }

    /* 4. Posiciones abiertas */
    for (const pos of selPos) {
      if (nextData.holdings.findIndex(h => h.symbol === pos.symbol) < 0) {
        const lot = { id: `lot_pos_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`, shares: pos.quantity, costBasis: pos.costBasis, commission: 0, purchaseDate: new Date().toISOString().split('T')[0], txSnapshot: { USD: pos.quantity * pos.costBasis, EUR: 0, COP: 0 }, txTrms: { ...nextData.trms } };
        nextData.holdings.push({
          id: `imp_pos_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
          symbol: pos.symbol, type: 'asset', currency: pos.currency, shares: pos.quantity,
          currentPrice: pos.closePrice || pos.costBasis, costBasis: pos.costBasis,
          category: 'Otros', lots: [lot], notes: 'IBKR posición abierta'
        });
        log.push(`📊 Posición: ${pos.symbol} × ${fmt(pos.quantity, 4)} @ ${fmtMoney(pos.costBasis, pos.currency)}`);
      }
    }

    /* 5. Transferencias */
    for (const xfer of selXfers) {
      let holdingIdx = nextData.holdings.findIndex(h => h.symbol === xfer.symbol);
      const priceEst = xfer.marketValue && xfer.quantity ? xfer.marketValue / xfer.quantity : 0;
      if (holdingIdx < 0) {
        nextData.holdings.push({
          id: `imp_xfer_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
          symbol: xfer.symbol, type: 'asset', currency: xfer.currency, shares: 0,
          currentPrice: priceEst, costBasis: priceEst, category: 'Otros', lots: [], notes: 'IBKR transferencia'
        });
        holdingIdx = nextData.holdings.length - 1;
      }
      const lot = { id: `lot_xfer_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`, shares: xfer.quantity, costBasis: priceEst, commission: 0, purchaseDate: xfer.date, txSnapshot: { USD: xfer.marketValue, EUR: 0, COP: 0 }, txTrms: { ...nextData.trms } };
      const h = nextData.holdings[holdingIdx];
      h.lots = [...(h.lots || []), lot].sort((a, b) => (a.purchaseDate || '').localeCompare(b.purchaseDate || ''));
      h.shares = h.lots.reduce((s, l) => s + l.shares, 0);
      log.push(`📥 Transfer: ${xfer.symbol} × ${fmt(xfer.quantity, 4)} [${xfer.date}]`);
    }

    nextData.holdings = consolidateHoldings(nextData.holdings);
    setData(nextData); persistData(nextData);
    setImportLog(log);
    setImporting(false);
    setProgress(100);
    showToast(`Importados: ${selBuys.length} compras, ${selSells.length} ventas, ${selDivs.length} dividendos, ${selPos.length} posiciones, ${selXfers.length} transferencias`, 'success');
    } catch (err) {
      console.error('[IBKR Import]', err);
      setImporting(false);
      setImportLog(log);
      showToast('Error durante importación: ' + (err.message || err), 'error');
    }
  };

  /* Conteo total seleccionado */
  const totalSelected = parsed ? [
    ...parsed.buys, ...parsed.sells, ...parsed.dividends, ...parsed.openPos, ...parsed.transfers
  ].filter(it => selected[it._id]).length : 0;

  return (
    <div className="space-y-4 animate-fade-in">
      {/* Zona de subida */}
      {!parsed && (
        <div onDragOver={e => e.preventDefault()} onDrop={handleDrop}
          className="border-2 border-dashed border-slate-700/50 rounded-2xl p-10 text-center hover:border-cyan-600/50 transition-all cursor-pointer group"
          onClick={() => document.getElementById('ibkr-file-input').click()}>
          <i className="fa-solid fa-file-csv text-4xl text-cyan-400/60 group-hover:text-cyan-400 transition-colors mb-4"></i>
          <div className="text-sm text-slate-300">Arrastra tu Activity Statement CSV de IBKR</div>
          <div className="text-xs text-slate-500 mt-1">o haz click para seleccionar</div>
          <div className="text-[10px] text-slate-600 mt-4">
            Client Portal → Performance & Reports → Statements → Activity → CSV
          </div>
          <input id="ibkr-file-input" type="file" accept=".csv,.CSV" onChange={handleFile} className="hidden" />
        </div>
      )}

      {/* Preview con selección */}
      {parsed && !importing && importLog.length === 0 && (
        <div className="space-y-3">
          <div className="flex items-center justify-between">
            <div className="text-sm font-bold text-cyan-400">
              <i className="fa-solid fa-file-csv mr-1.5"></i>{parsed.fileName}
            </div>
            <button onClick={() => setParsed(null)} className="text-slate-400 hover:text-white text-xs glass-card px-2 py-1">
              <i className="fa-solid fa-xmark mr-1"></i>Cerrar
            </button>
          </div>

          {/* Resumen */}
          <div className="glass-card p-3">
            <div className="flex items-center justify-between flex-wrap gap-2">
              <div className="flex gap-3 text-xs">
                <span className="text-emerald-400"><i className="fa-solid fa-arrow-trend-up mr-1"></i>{countSelected(parsed.buys)}/{parsed.buys.length} compras</span>
                <span className="text-rose-400"><i className="fa-solid fa-arrow-trend-down mr-1"></i>{countSelected(parsed.sells)}/{parsed.sells.length} ventas</span>
                <span className="text-amber-400"><i className="fa-solid fa-coins mr-1"></i>{countSelected(parsed.dividends)}/{parsed.dividends.length} dividendos</span>
                <span className="text-cyan-400"><i className="fa-solid fa-briefcase mr-1"></i>{countSelected(parsed.openPos)}/{parsed.openPos.length} posiciones</span>
                <span className="text-purple-400"><i className="fa-solid fa-right-left mr-1"></i>{countSelected(parsed.transfers)}/{parsed.transfers.length} transferencias</span>
              </div>
              <div className="text-xs text-white font-bold">{totalSelected} seleccionados</div>
            </div>
          </div>

          {/* Tablas de preview con checkboxes */}
          {renderPreviewTable('Compras', 'fa-arrow-trend-up', 'text-emerald-400', parsed.buys, [
            { header: 'Fecha', render: t => t.date || '—' },
            { header: 'Símbolo', render: t => t.symbol, bold: true },

/* ============================================================
   SINCRONIZAR DESDE CLAUDE (pegar snapshot IBKR)
   ============================================================ */
const SyncIBKRSection = ({ data, setData }) => {
  const { showToast } = useToast();
  const [jsonText, setJsonText] = useState('');
  const [preview, setPreview] = useState(null);
  const [synced, setSynced] = useState(false);

  const parseSnapshot = () => {
    try {
      const snap = JSON.parse(jsonText);
      if (!snap.positions || !Array.isArray(snap.positions)) throw new Error('JSON inválido: falta "positions"');
      const ibkrMap = {};
      snap.positions.forEach(p => { ibkrMap[p.contract_description] = p; });
      const appMap = {};
      data.holdings.filter(h => !isPseudoCashOrEmpty(h)).forEach(h => { appMap[h.symbol] = h; });

      const allSymbols = [...new Set([...Object.keys(ibkrMap), ...Object.keys(appMap)])].sort();

      const rows = allSymbols.map(sym => {
        const ibkr = ibkrMap[sym];
        const app = appMap[sym];
        let action = 'match';
        if (ibkr && !app) action = 'add';
        else if (!ibkr && app) action = 'orphan';
        else if (ibkr && app) {
          if (Math.abs(ibkr.position - app.shares) > 0.001 || Math.abs(ibkr.average_price - (app.costBasis || 0)) > 0.01) action = 'update';
        }
        return {
          symbol: sym, action,
          ibkrShares: ibkr?.position || 0, ibkrCost: ibkr?.average_price || 0,
          ibkrPrice: ibkr?.market_price || 0, ibkrValue: ibkr?.market_value || 0,
          ibkrPL: ibkr?.unrealized_pnl || 0, ibkrCurrency: ibkr?.currency || 'USD',
          appShares: app?.shares || 0, appCost: app?.costBasis || 0,
          appPrice: app?.currentPrice || 0, appCategory: app?.category || 'Otros',
          appNotes: app?.notes || ''
        };
      });

      const cash = snap.balances || [];
      setPreview({ rows, cash, summary: snap });
    } catch (err) {
      showToast('Error: ' + err.message, 'error');
    }
  };

  const performSync = () => {
    if (!preview) return;
    let nextData = { ...data, holdings: [...data.holdings] };
    let added = 0, updated = 0;
    const today = new Date().toISOString().split('T')[0];

    for (const row of preview.rows) {
      if (row.action === 'add') {
        const lot = { id: `lot_sync_${Date.now()}_${Math.random().toString(36).slice(2,6)}`, shares: row.ibkrShares, costBasis: row.ibkrCost, commission: 0, purchaseDate: today, txSnapshot: { USD: row.ibkrValue, EUR: 0, COP: 0 }, txTrms: { ...nextData.trms } };
        nextData.holdings.push({
          id: `sync_${Date.now()}_${Math.random().toString(36).slice(2,6)}`,
          symbol: row.symbol, type: 'asset', currency: row.ibkrCurrency,
          shares: row.ibkrShares, currentPrice: row.ibkrPrice, costBasis: row.ibkrCost,
          category: 'Otros', lots: [lot], notes: 'Sync IBKR'
        });
        added++;
      } else if (row.action === 'update') {
        nextData.holdings = nextData.holdings.map(h => {
          if (h.symbol !== row.symbol || isPseudoCashOrEmpty(h)) return h;
          const updated = { ...h, shares: row.ibkrShares, currentPrice: row.ibkrPrice, costBasis: row.ibkrCost };
          /* Si no tiene lotes, crear uno con cost basis de IBKR */
          if (!updated.lots || updated.lots.length === 0) {
            updated.lots = [{ id: `lot_sync_${Date.now()}_${Math.random().toString(36).slice(2,6)}`, shares: row.ibkrShares, costBasis: row.ibkrCost, commission: 0, purchaseDate: today, txSnapshot: { USD: row.ibkrValue, EUR: 0, COP: 0 }, txTrms: { ...data.trms } }];
          } else {
            /* Ajustar shares totales */
            const totalLotShares = updated.lots.reduce((s, l) => s + l.shares, 0);
            if (Math.abs(totalLotShares - row.ibkrShares) > 0.001) {
              const ratio = row.ibkrShares / (totalLotShares || 1);
              updated.lots = updated.lots.map(l => ({ ...l, shares: l.shares * ratio }));
            }
          }
          return updated;
        });
        updated++;
      }
    }
    nextData.holdings = consolidateHoldings(nextData.holdings);
    setData(nextData); persistData(nextData);
    setSynced(true);
    showToast(`Sync: ${added} agregados, ${updated} actualizados`, 'success');
  };

  const actionBadge = (action) => {
    const map = { add: ['Nuevo', 'text-emerald-400 bg-emerald-400/10'], update: ['Actualizar', 'text-cyan-400 bg-cyan-400/10'], match: ['OK', 'text-slate-500 bg-slate-500/10'], orphan: ['Solo App', 'text-amber-400 bg-amber-400/10'] };
    const [label, cls] = map[action] || ['?', ''];
    return <span className={`text-[10px] px-1.5 py-0.5 rounded ${cls}`}>{label}</span>;
  };

  return (
    <div className="space-y-4 animate-fade-in">
      <div className="glass-card p-4">
        <div className="text-sm font-bold text-cyan-400 mb-2"><i className="fa-solid fa-plug mr-1.5"></i>Sincronizar desde Claude</div>
        <div className="text-xs text-slate-400 mb-3">Pide a Claude: <span className="text-white font-mono">"jala mis posiciones de IBKR"</span> → copia el JSON → pégalo aquí.</div>
        {!preview && !synced && (
          <div>
            <textarea value={jsonText} onChange={e => setJsonText(e.target.value)}
              placeholder='{"positions":[...], "balances":[...]}'
              className="w-full h-28 bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs font-mono text-slate-300 placeholder:text-slate-700 resize-none" />
            <button onClick={parseSnapshot} disabled={!jsonText.trim()}
              className={`mt-2 w-full py-2 rounded-lg text-xs font-bold ${jsonText.trim() ? 'bg-cyan-600 hover:bg-cyan-500 text-white' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`}>
              <i className="fa-solid fa-magnifying-glass-chart mr-1.5"></i>Analizar snapshot
            </button>
          </div>
        )}
      </div>

      {/* Preview de sincronización */}
      {preview && !synced && (
        <div className="space-y-3">
          {/* Resumen */}
          <div className="glass-card p-3">
            <div className="flex gap-3 text-xs flex-wrap">
              <span className="text-emerald-400"><i className="fa-solid fa-plus mr-1"></i>{preview.rows.filter(r => r.action === 'add').length} nuevos</span>
              <span className="text-cyan-400"><i className="fa-solid fa-arrows-rotate mr-1"></i>{preview.rows.filter(r => r.action === 'update').length} actualizar</span>
              <span className="text-slate-500"><i className="fa-solid fa-check mr-1"></i>{preview.rows.filter(r => r.action === 'match').length} sin cambios</span>
              <span className="text-amber-400"><i className="fa-solid fa-question mr-1"></i>{preview.rows.filter(r => r.action === 'orphan').length} solo en app</span>
            </div>
          </div>

          {/* Tabla comparativa */}
          <div className="glass-card overflow-x-auto">
            <table className="w-full text-xs">
              <thead className="text-[10px] text-slate-500 uppercase sticky top-0 bg-slate-900/95 backdrop-blur">
                <tr>
                  <th className="text-left p-2">Símbolo</th>
                  <th className="text-right p-2">IBKR Cant.</th>
                  <th className="text-right p-2">App Cant.</th>
                  <th className="text-right p-2">IBKR Cost</th>
                  <th className="text-right p-2">App Cost</th>
                  <th className="text-right p-2">P/L</th>
                  <th className="text-center p-2">Acción</th>
                </tr>
              </thead>
              <tbody>
                {preview.rows.map(r => (
                  <tr key={r.symbol} className={`border-t border-slate-800/50 ${r.action === 'orphan' ? 'opacity-50' : ''}`}>
                    <td className="p-2 font-bold">{r.symbol}</td>
                    <td className="text-right p-2 font-mono">{r.ibkrShares > 0 ? fmt(r.ibkrShares, 4) : '—'}</td>
                    <td className={`text-right p-2 font-mono ${r.action === 'update' && Math.abs(r.ibkrShares - r.appShares) > 0.001 ? 'text-amber-400' : ''}`}>
                      {r.appShares > 0 ? fmt(r.appShares, 4) : '—'}
                    </td>
                    <td className="text-right p-2 font-mono">{r.ibkrCost > 0 ? fmtMoney(r.ibkrCost, r.ibkrCurrency) : '—'}</td>
                    <td className={`text-right p-2 font-mono ${r.action === 'update' && Math.abs(r.ibkrCost - r.appCost) > 0.01 ? 'text-amber-400' : ''}`}>
                      {r.appCost > 0 ? fmtMoney(r.appCost, r.ibkrCurrency) : '—'}
                    </td>
                    <td className={`text-right p-2 font-mono ${r.ibkrPL >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                      {r.ibkrPL !== 0 ? `${r.ibkrPL >= 0 ? '+' : ''}${fmtMoney(r.ibkrPL, r.ibkrCurrency)}` : '—'}
                    </td>
                    <td className="text-center p-2">{actionBadge(r.action)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Cash balances */}
          {preview.cash.length > 0 && (
            <div className="glass-card p-3">
              <div className="text-[10px] text-slate-500 uppercase mb-1">Efectivo IBKR</div>
              <div className="flex gap-3 text-xs">
                {preview.cash.filter(c => c.currency !== 'BASE').map(c => (
                  <span key={c.currency} className="font-mono text-slate-300">{c.currency}: {fmtMoney(c.cash_balance, c.currency)}</span>
                ))}
              </div>
            </div>
          )}

          <div className="flex gap-2">
            <button onClick={performSync} className="flex-1 bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded-lg text-sm font-bold">
              <i className="fa-solid fa-arrows-rotate mr-1.5"></i>
              Sincronizar {preview.rows.filter(r => r.action === 'add' || r.action === 'update').length} posiciones
            </button>
            <button onClick={() => { setPreview(null); setJsonText(''); }} className="bg-slate-800 hover:bg-slate-700 px-4 py-2.5 rounded-lg text-sm">Cancelar</button>
          </div>
        </div>
      )}

      {synced && (
        <div className="glass-card p-4 border-emerald-800/30 text-center">
          <i className="fa-solid fa-circle-check text-2xl text-emerald-400 mb-2"></i>
          <div className="text-sm font-bold text-emerald-400">Sincronización completada</div>
          <div className="text-xs text-slate-400 mt-1">Tus posiciones ahora reflejan el estado real de IBKR.</div>
          <button onClick={() => { setPreview(null); setJsonText(''); setSynced(false); }} className="mt-3 text-xs text-slate-400 hover:text-white">Cerrar</button>
        </div>
      )}
    </div>
  );
};

/* ============================================================
   COCKPIT ESPAÑA — planificación fiscal de la mudanza CO→ES
   ============================================================ */
const ES_SAVINGS_BRACKETS = [
  { upTo: 6000, rate: 0.19 },
  { upTo: 50000, rate: 0.21 },
  { upTo: 200000, rate: 0.23 },
  { upTo: 300000, rate: 0.27 },
  { upTo: Infinity, rate: 0.28 }
];
const taxSpainSavings = (gainEUR) => {
  if (gainEUR <= 0) return 0;
  let tax = 0, prev = 0;
  for (const b of ES_SAVINGS_BRACKETS) {
    const taxable = Math.min(gainEUR, b.upTo) - prev;
    if (taxable > 0) tax += taxable * b.rate;
    prev = b.upTo;
    if (gainEUR <= b.upTo) break;
  }
  return tax;
};

  const [beckham, setBeckham] = useState(localStorage.getItem('spain_beckham') !== '0');
  const [rateST, setRateST] = useState(Number(localStorage.getItem('spain_co_rate_st')) || 33);
  const [selected, setSelected] = useState({});
  const [checklist, setChecklist] = useState(() => {
    try { const s = JSON.parse(localStorage.getItem('spain_checklist')); if (Array.isArray(s) && s.length > 0) return s; } catch {}
    return SPAIN_CHECKLIST_DEFAULT;
  });

  useEffect(() => { localStorage.setItem('spain_move_date', moveDate); }, [moveDate]);
  useEffect(() => { localStorage.setItem('spain_beckham', beckham ? '1' : '0'); }, [beckham]);
  useEffect(() => { localStorage.setItem('spain_co_rate_st', String(rateST)); }, [rateST]);
  useEffect(() => { localStorage.setItem('spain_checklist', JSON.stringify(checklist)); }, [checklist]);

  const today = new Date();
  const todayStr = today.toISOString().split('T')[0];
  const trms = data.trms || { USD: 4000, EUR: 4400 };

  /* ===== Countdown y regla de los 183 días ===== */
  const moveD = new Date(moveDate + 'T00:00:00');
  const daysToMove = Math.ceil((moveD - today) / 86400000);
  const moveYear = moveD.getFullYear();
  const endOfMoveYear = new Date(moveYear, 11, 31);
  const daysInSpainMoveYear = Math.max(0, Math.round((endOfMoveYear - moveD) / 86400000) + 1);
  const residentFromMoveYear = daysInSpainMoveYear >= 183;
  const spainResidencyYear = residentFromMoveYear ? moveYear : moveYear + 1;

  /* ===== Análisis por posición y lote ===== */
  const positions = useMemo(() => {
    return data.holdings.filter(h => !isPseudoCashOrEmpty(h)).map(h => {
      let plLT = 0, plST = 0, valueNative = (h.currentPrice || 0) * (h.shares || 0);
      const lots = h.lots && h.lots.length > 0 ? h.lots : [{ shares: h.shares, costBasis: h.costBasis || 0, purchaseDate: todayStr }];
      let oldestDate = todayStr;
      lots.forEach(lot => {
        const pl = ((h.currentPrice || 0) - (lot.costBasis || 0)) * (lot.shares || 0);
        const age = daysBetween(lot.purchaseDate || todayStr, todayStr);
        if (age >= 730) plLT += pl; else plST += pl;
        if ((lot.purchaseDate || todayStr) < oldestDate) oldestDate = lot.purchaseDate;
      });
      const plTotal = plLT + plST;
      return {
        id: h.id, symbol: h.symbol, currency: h.currency, category: h.category,
        valueNative, plLT, plST, plTotal,
        valueEUR: convert(valueNative, h.currency, 'EUR', trms),
        plLT_EUR: convert(plLT, h.currency, 'EUR', trms),
        plST_EUR: convert(plST, h.currency, 'EUR', trms),
        plTotal_EUR: convert(plTotal, h.currency, 'EUR', trms),
        plTotal_USD: convert(plTotal, h.currency, 'USD', trms),
        oldestDate
      };
    }).sort((a, b) => b.plTotal_EUR - a.plTotal_EUR);
  }, [data.holdings, trms, todayStr]);

  const toggleSel = (id) => setSelected(s => ({ ...s, [id]: !s[id] }));
  const selectGroup = (filterFn) => {
    const next = {};
    positions.forEach(p => { next[p.id] = filterFn(p); });
    setSelected(next);
  };

  const sel = positions.filter(p => selected[p.id]);

  /* ===== Cálculo de los 3 escenarios sobre la selección ===== */

    let gainsLT = 0, lossesLT = 0, gainsST = 0, lossesST = 0;
    sel.forEach(p => {

      if (p.plST_EUR >= 0) gainsST += p.plST_EUR; else lossesST += Math.abs(p.plST_EUR);
    });
    const netEUR = gainsLT + gainsST - lossesLT - lossesST;
    const netUSD = convert(netEUR, 'EUR', 'USD', trms);

    /* Colombia: pérdidas compensan primero ST (mayor tasa), luego LT */
    let lossPool = lossesLT + lossesST;
    const taxableST = Math.max(0, gainsST - lossPool);
    lossPool = Math.max(0, lossPool - gainsST);
    const taxableLT = Math.max(0, gainsLT - lossPool);
    const taxCO = taxableST * (rateST / 100) + taxableLT * 0.15;

    /* España general: neto integrado en base del ahorro */
    const taxES = taxSpainSavings(netEUR);

    /* España Beckham: plusvalías de fuente extranjera no tributan */
    const taxBK = 0;

              <div className="text-[9px] text-slate-500 uppercase">días</div>
            </div>
          </div>
        </div>
        {/* Regla de los 183 días */}
        <div className={`mt-3 p-2.5 rounded-lg text-xs ${residentFromMoveYear ? 'bg-amber-400/10 border border-amber-800/30 text-amber-300' : 'bg-emerald-400/10 border border-emerald-800/30 text-emerald-300'}`}>

            : `Llegando el ${moveDate} pasarías ${daysInSpainMoveYear} días en España en ${moveYear} (<183) → seguirías siendo residente fiscal colombiano TODO ${moveYear}. España aplicaría desde ${spainResidencyYear}. Tienes hasta el 31/12/${moveYear} para realizar ganancias bajo régimen colombiano.`}
        </div>

      {/* ===== Simulador de venta ===== */}
      <div className="glass-card p-4">
        <div className="flex items-center justify-between flex-wrap gap-2 mb-3">
          <div className="text-sm font-bold text-white"><i className="fa-solid fa-scale-balanced text-cyan-400 mr-1.5"></i>Simulador: ¿dónde conviene vender?</div>
          <div className="flex gap-1.5 text-[10px]">
            <button onClick={() => selectGroup(() => true)} className="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700">Todas</button>

                  <td className={`text-right p-2 font-mono ${p.plST_EUR >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{p.plST_EUR !== 0 ? fmt(p.plST_EUR, 0) : '—'}</td>

            <div className="border-t border-slate-800/50 pt-2 mt-2 space-y-1.5">

/* ============================================================
   MARKET PULSE (sin cambios sustanciales vs v2.1)
   ============================================================ */
const MarketPulseTab = ({ data, finnhubKey }) => {
  const { showToast } = useToast();
  const [quotes, setQuotes] = useState({});
  const [macroData, setMacroData] = useState(() => {
    try { return JSON.parse(localStorage.getItem('macro_cache') || '{}'); } catch { return {}; }
  });
  const [earnings, setEarnings] = useState([]);
  const [loading, setLoading] = useState(false);
  const [lastUpdate, setLastUpdate] = useState(null);
  const [errors, setErrors] = useState([]);

  const symbols = useMemo(() => [...new Set(data.holdings.filter(h => !isPseudoCashOrEmpty(h)).map(h => h.symbol))], [data]);

  const fetchWithTimeout = async (url, ms = 6000) => {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms);
    try { const r = await fetch(url, { signal: controller.signal }); clearTimeout(timer); return r; }
    catch (e) { clearTimeout(timer); throw e; }
  };

  const fetchMacroItem = async (key, primary, stooqSym) => {
    if (primary) { try { const r = await primary(); if (r && r.close > 0) return { ...r, source: 'live' }; } catch {} }
    if (stooqSym) {
      try {
        const r = await fetchWithTimeout('https://stooq.com/q/l/?s=' + stooqSym + '&f=sd2t2ohlcv&h&e=csv', 5000);
        if (r.ok) { const text = await r.text(); const lines = text.trim().split('\n');
          if (lines.length >= 2) { const cols = lines[1].split(','); const close = parseFloat(cols[6]), open = parseFloat(cols[3]);
            if (close > 0) return { close, change: close - open, changePct: ((close - open) / open) * 100, source: 'stooq' }; } }
      } catch {}
    }
    const cached = macroData[key];
    if (cached && cached.close > 0) return { ...cached, source: 'cache' };
    return null;
  };

  const loadAll = async () => {
    if (!finnhubKey) { showToast('Configura Finnhub API key en Config', 'error'); return; }
    setLoading(true);
    const errs = [];
    const newQ = {};
    for (const sym of symbols) {
      try { const q = await finnhub.quote(sym, finnhubKey); if (q && q.c > 0) newQ[sym] = q; else errs.push(sym); await new Promise(r => setTimeout(r, 100)); }
      catch { errs.push(sym); }
    }
    /* Guardar precios fetched en price_history para acumular sparklines */
    const today = new Date().toISOString().split('T')[0];
    symbols.forEach(sym => {
      const q = newQ[sym];
      if (q && q.c > 0) phAppend(sym, today, q.c);
    });
    setQuotes(newQ);

    const [vix, dxy, us10y, gold, eurusd, btc] = await Promise.all([
      fetchMacroItem('vix', null, '^vix'),
      fetchMacroItem('dxy', null, 'dx.f'),
      fetchMacroItem('us10y', null, '10usy.b'),
      fetchMacroItem('gold', async () => {
        const r = await fetchWithTimeout('https://finnhub.io/api/v1/quote?symbol=OANDA:XAU_USD&token=' + finnhubKey, 5000);
        if (r.ok) { const j = await r.json(); if (j.c > 0) return { close: j.c, change: j.d, changePct: j.dp }; } return null;
      }, 'xauusd'),
      fetchMacroItem('eurusd', async () => {
        const r = await fetchWithTimeout('https://api.frankfurter.app/latest?from=EUR&to=USD', 5000);
        if (r.ok) { const j = await r.json(); if (j.rates?.USD) {
          const rate = j.rates.USD;
          try { const y = new Date(Date.now() - 86400000).toISOString().split('T')[0];
            const r2 = await fetchWithTimeout('https://api.frankfurter.app/' + y + '?from=EUR&to=USD', 4000);
            if (r2.ok) { const j2 = await r2.json(); const prev = j2.rates?.USD || rate; return { close: rate, change: rate - prev, changePct: ((rate - prev) / prev) * 100 }; }
          } catch {} return { close: rate, change: 0, changePct: 0 }; } } return null;
      }, 'eurusd'),
      fetchMacroItem('btc', async () => {
        const r = await fetchWithTimeout('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true', 5000);
        if (r.ok) { const j = await r.json(); const p = j.bitcoin; if (p) return { close: p.usd, changePct: p.usd_24h_change || 0, change: 0 }; } return null;
      }, null)
    ]);

    const newMacro = { vix, dxy, us10y, gold, eurusd, btc };
    setMacroData(newMacro);
    localStorage.setItem('macro_cache', JSON.stringify(newMacro));

    try { const e = await finnhub.earnings(finnhubKey, 30);
      setEarnings((e.earningsCalendar || []).filter(x => symbols.includes(x.symbol)).sort((a, b) => a.date.localeCompare(b.date)));
    } catch {}

    setErrors(errs); setLastUpdate(new Date()); setLoading(false);
    showToast('Market Pulse actualizado' + (errs.length > 0 ? ' (' + errs.length + ' sin datos)' : ''), errs.length > 0 ? 'warning' : 'success');

    /* Actualización inteligente: acumular ETFs sectoriales */
    fetchSectorETFs(finnhubKey).catch(() => {});
  };

  useEffect(() => { if (symbols.length && finnhubKey) loadAll(); }, []);

  const sparkData = useMemo(() => {
    const result = {};
    symbols.forEach(sym => {
      const h = phGet(sym).slice().sort((a, b) => a.date.localeCompare(b.date)).slice(-30);
      if (h.length >= 2) result[sym] = h.map(p => p.close);
    });
    return result;
  }, [symbols, quotes]);

  const MacroCard = ({ label, value, unit = '' }) => {
    const isCache = value && value.source === 'cache';
    if (!value) return (<div className="glass-card kpi-card p-3"><div className="text-[10px] text-slate-400 uppercase">{label}</div><div className="text-slate-600 text-sm">Sin datos</div></div>);
    return (
      <div className={`glass-card kpi-card p-3 ${isCache ? 'opacity-60' : ''}`}>
        <div className="text-[10px] text-slate-400 uppercase flex items-center gap-1">{label}{isCache && <span className="text-amber-500" title="Dato cacheado">\u23f3</span>}</div>
        <div className="text-lg font-bold font-mono">{fmt(value.close)}{unit}</div>
        <div className={`text-xs font-mono ${value.changePct >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{value.changePct >= 0 ? '\u25b2' : '\u25bc'}{Math.abs(value.changePct).toFixed(2)}%</div>
      </div>
    );
  };

  return (
    <div className="space-y-4 animate-fade-in">
      <div className="flex justify-between items-center flex-wrap gap-2">
        <div className="flex items-center gap-3">
          <h2 className="text-lg font-bold tracking-tight"><i className="fa-solid fa-wave-square text-cyan-400 mr-2"></i>Market Pulse</h2>
          {lastUpdate && (<span className="text-[10px] text-slate-500 flex items-center gap-1"><span className="pulse-dot inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span>{lastUpdate.toLocaleTimeString('es-ES')}</span>)}
        </div>
        <button onClick={loadAll} disabled={loading} className="bg-cyan-600 hover:bg-cyan-500 disabled:opacity-50 px-3 py-1.5 rounded-lg text-xs font-medium"><i className={`fa-solid fa-rotate ${loading ? 'fa-spin' : ''} mr-1`}></i>Actualizar</button>
      </div>
      {errors.length > 0 && (<div className="text-[10px] text-amber-400"><i className="fa-solid fa-triangle-exclamation mr-1"></i>Sin datos: {errors.join(', ')}</div>)}

      {/* Macro cards — full width */}
      <div>
        <div className="text-[10px] text-slate-500 mb-2 uppercase tracking-widest font-medium">Macro</div>
        <div className="grid grid-cols-3 md:grid-cols-6 gap-2">
          <MacroCard label="VIX" value={macroData.vix} />
          <MacroCard label="DXY" value={macroData.dxy} />
          <MacroCard label="US10Y" value={macroData.us10y} unit="%" />
          <MacroCard label="Oro" value={macroData.gold} />
          <MacroCard label="EUR/USD" value={macroData.eurusd} />
          <MacroCard label="BTC" value={macroData.btc} />
        </div>
      </div>

      {/* === GRID: Tickers + Earnings (izquierda) | RSI Sectorial (derecha) === */}
      <div className="grid grid-cols-1 lg:grid-cols-5 gap-4">

        {/* Columna izquierda: Tickers + Earnings */}
        <div className="lg:col-span-3 space-y-4">
          <div>
            <div className="text-[10px] text-slate-500 mb-2 uppercase tracking-widest font-medium">Tickers</div>
            <div className="glass-card overflow-x-auto">
              <table className="w-full text-xs">
                <thead className="text-[10px] text-slate-500 uppercase">
                  <tr><th className="text-left p-2.5">Símbolo</th><th className="text-right p-2.5">Precio</th><th className="text-right p-2.5">% Día</th><th className="text-right p-2.5 hidden md:table-cell">H / L</th><th className="text-center p-2.5">Tendencia</th></tr>
                </thead>
                <tbody>
                  {symbols.map(sym => {
                    const q = quotes[sym]; const spark = sparkData[sym];
                    return (
                      <tr key={sym} className="border-t border-slate-800/50">

const NewsTab = ({ data, finnhubKey }) => {
  const { showToast } = useToast();
  const [news, setNews] = useState([]);
  const [earnings, setEarnings] = useState([]);
  const [loading, setLoading] = useState(false);
  const [lastUpdate, setLastUpdate] = useState(null);
  const [filter, setFilter] = useState('all'); /* all, positive, negative, neutral */

  const symbols = useMemo(() => {
    const realH = data.holdings.filter(h => !isPseudoCashOrEmpty(h));
    const totalVal = realH.reduce((s, h) => s + h.shares * (h.currentPrice || h.costBasis || 0), 0);
    return realH.map(h => ({
      symbol: h.symbol,
      weight: totalVal > 0 ? (h.shares * (h.currentPrice || h.costBasis || 0)) / totalVal : 0
    })).sort((a, b) => b.weight - a.weight);
  }, [data]);

  /* Clasificador de sentimiento local (sin API, gratis) */
  const classifySentiment = (headline) => {
    const h = (headline || '').toLowerCase();
    const pos = ['beats','surges','surge','growth','upgrade','upgraded','rally','record high','partnership','acquisition','acquires',
      'dividend','expansion','expands','bullish','outperform','buy rating','raises guidance','strong','soars','jumps','gains',
      'breakthrough','launches','approved','profit','revenue beat','tops estimates','exceeds','positive','higher','increases',
      'accelerat','momentum','innovative','deal','agrees to buy','all-time high','ipo','upside'];
    const neg = ['misses','drops','drop','decline','downgrade','downgraded','lawsuit','investigation','cuts','layoff','layoffs',
      'warning','recall','bearish','underperform','sell rating','lowers guidance','weak','plunges','falls','loses','loss',
      'bankruptcy','probe','fraud','fine','fined','crash','concerns','risk','lower','decreases','slows','disappoints',
      'shortfall','deficit','debt','default','sanctions','tariff','ban','blocked','fails','negative','worst','selloff'];

    let score = 0;
    pos.forEach(w => { if (h.includes(w)) score += 1; });
    neg.forEach(w => { if (h.includes(w)) score -= 1; });

    if (score >= 1) return { label: 'Positivo', color: 'text-emerald-400', bg: 'bg-emerald-400/10 border-emerald-500/30', icon: '\u25b2', score };
    if (score <= -1) return { label: 'Negativo', color: 'text-rose-400', bg: 'bg-rose-400/10 border-rose-500/30', icon: '\u25bc', score };
    return { label: 'Neutral', color: 'text-slate-400', bg: 'bg-slate-400/10 border-slate-500/30', icon: '\u25cf', score: 0 };
  };

  const loadAll = async () => {
    if (!finnhubKey) { showToast('Configura Finnhub API key en Config', 'error'); return; }
    setLoading(true);

    /* Top 15 holdings por peso */
    const topSymbols = symbols.slice(0, 15);
    const allNews = [];
    const today = new Date();
    const weekAgo = new Date(today - 7 * 86400000);
    const fmtD = (d) => d.toISOString().split('T')[0];

    for (const { symbol, weight } of topSymbols) {
      try {
        const r = await fetch('https://finnhub.io/api/v1/company-news?symbol=' + symbol + '&from=' + fmtD(weekAgo) + '&to=' + fmtD(today) + '&token=' + finnhubKey);
        if (r.ok) {
          const items = await r.json();
          (items || []).slice(0, 5).forEach(item => {
            const sentiment = classifySentiment(item.headline);
            allNews.push({
              symbol, weight,
              headline: item.headline,
              summary: item.summary,
              source: item.source,
              url: item.url,
              date: item.datetime ? new Date(item.datetime * 1000).toISOString().split('T')[0] : '',
              image: item.image,
              sentiment,
              impactScore: Math.abs(sentiment.score) * weight /* peso x sentimiento */
            });
          });
        }
        await new Promise(r => setTimeout(r, 120));
      } catch {}
    }

    /* Ordenar por impacto (peso en cartera * fuerza del sentimiento) */
    allNews.sort((a, b) => b.impactScore - a.impactScore || b.weight - a.weight);
    setNews(allNews);

    /* Earnings calendar */
    try {
      const e = await fetch('https://finnhub.io/api/v1/calendar/earnings?from=' + fmtD(today) + '&to=' + fmtD(new Date(today.getTime() + 30 * 86400000)) + '&token=' + finnhubKey);
      if (e.ok) {
        const j = await e.json();
        const myEarnings = (j.earningsCalendar || []).filter(x => symbols.some(s => s.symbol === x.symbol));
        setEarnings(myEarnings.sort((a, b) => a.date.localeCompare(b.date)));
      }
    } catch {}

    setLastUpdate(new Date());
    setLoading(false);
    showToast('News actualizado: ' + allNews.length + ' noticias de ' + topSymbols.length + ' activos', 'success');
  };

  useEffect(() => { if (symbols.length && finnhubKey) loadAll(); }, []);

  const filtered = filter === 'all' ? news :
    filter === 'positive' ? news.filter(n => n.sentiment.score > 0) :
    filter === 'negative' ? news.filter(n => n.sentiment.score < 0) :
    news.filter(n => n.sentiment.score === 0);

  const stats = useMemo(() => ({
    total: news.length,
    positive: news.filter(n => n.sentiment.score > 0).length,
    negative: news.filter(n => n.sentiment.score < 0).length,
    neutral: news.filter(n => n.sentiment.score === 0).length
  }), [news]);

  return (
    <div className="space-y-4 animate-fade-in">
      <div className="flex justify-between items-center flex-wrap gap-2">
        <div className="flex items-center gap-3">
          <h2 className="text-lg font-bold tracking-tight"><i className="fa-solid fa-newspaper text-cyan-400 mr-2"></i>News & Catalysts</h2>
          {lastUpdate && (<span className="text-[10px] text-slate-500"><span className="pulse-dot inline-block w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1"></span>{lastUpdate.toLocaleTimeString('es-ES')}</span>)}
        </div>
        <button onClick={loadAll} disabled={loading} className="bg-cyan-600 hover:bg-cyan-500 disabled:opacity-50 px-3 py-1.5 rounded-lg text-xs font-medium">
          <i className={`fa-solid fa-rotate ${loading ? 'fa-spin' : ''} mr-1`}></i>Actualizar
        </button>
      </div>

      {/* Earnings calendar */}
      {earnings.length > 0 && (

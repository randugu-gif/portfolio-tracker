<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ============================================================
   CONSTANTES / VERSIÓN
   ============================================================ */
/* ============================================================
   PRICE HISTORY STORE — IndexedDB + caché en memoria
   Lecturas síncronas desde caché; escrituras async por símbolo.
   Migra automáticamente desde localStorage la primera vez.
   ============================================================ */
const PH_DB = 'portfolio_cockpit_idb';
const PH_STORE = 'price_history';
let __phCache = {};
let __phDB = null;
let __phUseLS = false;

const phMergeSeries = (a, b) => {
  const byDate = {};
  [...(a || []), ...(b || [])].forEach(p => { if (p && p.date && p.close > 0) byDate[p.date] = p.close; });
  return Object.keys(byDate).sort().map(date => ({ date, close: byDate[date] })).slice(-500);
};

const phOpenDB = () => new Promise((resolve, reject) => {
  if (typeof indexedDB === 'undefined') return reject(new Error('IndexedDB no disponible'));
  const req = indexedDB.open(PH_DB, 1);
  req.onupgradeneeded = () => {
    const db = req.result;
    if (!db.objectStoreNames.contains(PH_STORE)) db.createObjectStore(PH_STORE, { keyPath: 'symbol' });
  };
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error);
});

const phInit = async () => {
  try {
    __phDB = await phOpenDB();
    __phCache = await new Promise((resolve, reject) => {
      const req = __phDB.transaction(PH_STORE, 'readonly').objectStore(PH_STORE).getAll();
      req.onsuccess = () => {
        const map = {};
        (req.result || []).forEach(r => { map[r.symbol] = r.points || []; });
        resolve(map);
      };
      req.onerror = () => reject(req.error);
    });
    /* Migración única desde localStorage */
    const legacy = localStorage.getItem('price_history');
    if (legacy) {
      try {
        const old = JSON.parse(legacy);
        const tx = __phDB.transaction(PH_STORE, 'readwrite');
        const store = tx.objectStore(PH_STORE);
        Object.keys(old).forEach(sym => {
          __phCache[sym] = phMergeSeries(__phCache[sym], old[sym]);
          store.put({ symbol: sym, points: __phCache[sym] });
        });
        await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
        localStorage.removeItem('price_history');
        console.log(`[ph] Migrados ${Object.keys(old).length} símbolos a IndexedDB`);
      } catch (e) { console.warn('[ph] Migración falló; localStorage intacto', e); }
    }
  } catch (e) {
    console.warn('[ph] Sin IndexedDB; fallback a localStorage', e);
    __phUseLS = true;
    try { __phCache = JSON.parse(localStorage.getItem('price_history') || '{}'); } catch { __phCache = {}; }
  }
};

const phWriteSymbol = (symbol) => {
  if (__phUseLS || !__phDB) {
    try { localStorage.setItem('price_history', JSON.stringify(__phCache)); } catch (e) { console.warn('[ph] LS lleno', e); }
    return;
  }
  try {
    __phDB.transaction(PH_STORE, 'readwrite').objectStore(PH_STORE).put({ symbol, points: __phCache[symbol] || [] });
  } catch (e) { console.warn('[ph] write fail', symbol, e); }
};

/* API pública */
const phGetAll = () => __phCache;
const phGet = (symbol) => __phCache[symbol] || [];
const phAppend = (symbol, date, close) => {
  if (!symbol || !date || !(close > 0)) return false;
  if (!__phCache[symbol]) __phCache[symbol] = [];
  if (__phCache[symbol].some(p => p.date === date)) return false;
  __phCache[symbol].push({ date, close });
  if (__phCache[symbol].length > 500) __phCache[symbol] = __phCache[symbol].slice(-500);
  phWriteSymbol(symbol);
  return true;
};

const STORAGE_KEY = 'portfolio_cockpit_v2';
const SNAPSHOTS_KEY = 'portfolio_snapshots_v2';
const FUNDAMENTALS_KEY = 'portfolio_fundamentals_v2';
const FINNHUB_KEY_STORE = 'finnhub_api_key';
const CLAUDE_KEY_STORE = 'claude_api_key';
const LAST_BACKUP_STORE = 'last_backup_date';

/* ============================================================
   CIFRADO LOCAL — AES-GCM 256 + PBKDF2 (Web Crypto API)
   La clave vive solo en memoria (__encKey). Nunca se persiste.
   ============================================================ */
const ENC_FLAG = 'enc_v1_enabled';
const ENC_SALT = 'enc_v1_salt';
let __encKey = null;
let __decryptedCache = {};

const b64enc = (buf) => {
  const bytes = new Uint8Array(buf);
  let bin = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  return btoa(bin);
};
const b64dec = (str) => Uint8Array.from(atob(str), c => c.charCodeAt(0));

const deriveKey = async (passphrase, saltB64) => {
  const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64dec(saltB64), iterations: 310000, hash: 'SHA-256' },
    baseKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
};

const encryptJSON = async (key, obj) => {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({ __enc: 1, iv: b64enc(iv), ct: b64enc(ct) });
};

const decryptJSON = async (key, raw) => {
  const blob = JSON.parse(raw);
  if (!blob || blob.__enc !== 1) return blob; /* dato en claro */
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64dec(blob.iv) }, key, b64dec(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
};

const isEncrypted = () => localStorage.getItem(ENC_FLAG) === '1';

/* Escritura segura: cifra async si está activo; el caché en memoria
   garantiza lecturas consistentes mientras se escribe. */
const secureWrite = (storageKey, obj) => {
  if (isEncrypted() && __encKey) {
    __decryptedCache[storageKey] = obj;
    encryptJSON(__encKey, obj)
      .then(blob => localStorage.setItem(storageKey, blob))
      .catch(e => console.error('[enc] write fail', e));
  } else {
    localStorage.setItem(storageKey, JSON.stringify(obj));
  }
};
const APP_VERSION = '3.0.0';
/* Google Drive sync - Client ID OAuth */
const GOOGLE_CLIENT_ID = '662425658697-6f6f4m8e6cumflp6kjo9qn0grv6627v8.apps.googleusercontent.com';
const GDRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const GDRIVE_FILENAME = 'portfolio_cockpit_data.json';

const DEFAULT_DATA = {
  version: APP_VERSION,
  holdings: [],
  sales: [],
  dividends: [],
  trms: { USD: 4000, EUR: 4300 },
  targetAllocation: {},
  categoryMap: {}
};

/* ============================================================
   HELPERS
   ============================================================ */
const fmt = (n, dec = 2) => {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('es-CO', { minimumFractionDigits: dec, maximumFractionDigits: dec });
};
const fmtPct = (n) => {
  if (isNaN(n)) return '—';
  if (typeof window !== 'undefined' && window.__privacy_hidden) return '••%';
  return `${n >= 0 ? '+' : ''}${n.toFixed(2)}%`;
};
const fmtMoney = (n, c = 'USD') => {
  const sym = c === 'USD' ? '$' : c === 'EUR' ? '€' : '';
  const suffix = c === 'COP' ? ' COP' : '';
  if (typeof window !== 'undefined' && window.__privacy_hidden) {
    return `${sym}•••${suffix}`;
  }
  return `${sym}${fmt(n)}${suffix}`;
};

const convert = (amount, from, to, trms) => {
  if (from === to) return amount;
  let cop;
  if (from === 'COP') cop = amount;
  else if (from === 'USD') cop = amount * trms.USD;
  else if (from === 'EUR') cop = amount * trms.EUR;
  else cop = amount;
  if (to === 'COP') return cop;
  if (to === 'USD') return cop / trms.USD;
  if (to === 'EUR') return cop / trms.EUR;
  return amount;
};

const snapshotMultiCurrency = (amount, nativeCurrency, trms) => ({
  USD: convert(amount, nativeCurrency, 'USD', trms),
  EUR: convert(amount, nativeCurrency, 'EUR', trms),
  COP: convert(amount, nativeCurrency, 'COP', trms)
});

/* CAGR: (end/start)^(1/años) - 1 */
const calcCAGR = (startValue, endValue, days) => {
  if (!startValue || startValue <= 0 || !endValue || days <= 0) return null;
  const years = days / 365.25;
  if (years < 0.08) return null; /* <30 días no es significativo */
  return (Math.pow(endValue / startValue, 1 / years) - 1) * 100;
};

const daysBetween = (a, b) => {
  const ms = new Date(b).getTime() - new Date(a).getTime();
  return Math.max(0, Math.floor(ms / 86400000));
};

/* XIRR via Newton-Raphson — para MWR */
const xirr = (cashflows /* [{date, amount}] */, guess = 0.1) => {
  if (cashflows.length < 2) return null;
  const t0 = new Date(cashflows[0].date).getTime();
  const years = cashflows.map(cf => (new Date(cf.date).getTime() - t0) / (365.25 * 86400000));
  const npv = (r) => cashflows.reduce((s, cf, i) => s + cf.amount / Math.pow(1 + r, years[i]), 0);
  const dnpv = (r) => cashflows.reduce((s, cf, i) => s - years[i] * cf.amount / Math.pow(1 + r, years[i] + 1), 0);

  let r = guess;
  for (let i = 0; i < 100; i++) {
    const v = npv(r), d = dnpv(r);
    if (Math.abs(d) < 1e-12) break;
    const next = r - v / d;
    if (Math.abs(next - r) < 1e-8) return next * 100;
    if (!isFinite(next) || next < -0.99) return null;
    r = next;
  }
  return null;
};

/* ============================================================
   TOAST
   ============================================================ */
const ToastContext = React.createContext({ showToast: () => {} });

/* PRIVACY CONTEXT: oculta valores monetarios con *** */
const PrivacyContext = React.createContext({ hidden: false, toggleHidden: () => {} });
const usePrivacy = () => React.useContext(PrivacyContext);
const maskValue = (s, hidden) => hidden ? s.replace(/[\d.,]+/g, '•••') : s;
const ToastProvider = ({ children }) => {
  const [toasts, setToasts] = useState([]);
  const showToast = useCallback((msg, type = 'info') => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3500);
  }, []);
  return (
    <ToastContext.Provider value={{ showToast }}>
      {children}
      <div className="fixed top-4 right-4 z-[100] space-y-2">
        {toasts.map(t => (
          <div key={t.id} className={`px-4 py-2 rounded-lg shadow-xl animate-fade-in text-sm font-medium ${
            t.type === 'error' ? 'bg-red-600' : t.type === 'success' ? 'bg-green-600' : 'bg-slate-700'
          }`}>{t.msg}</div>
        ))}
      </div>
    </ToastContext.Provider>
  );
};
const useToast = () => React.useContext(ToastContext);

/* ============================================================
   PERSISTENCIA + MIGRACIÓN v2.1 → v2.2
   ============================================================ */
const loadData = () => {
  try {
    let parsed;
    if (isEncrypted()) {
      parsed = __decryptedCache[STORAGE_KEY];
      if (parsed === undefined || parsed === null) return DEFAULT_DATA;
    } else {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return DEFAULT_DATA;
      parsed = JSON.parse(raw);
    }
    const merged = { ...DEFAULT_DATA, ...parsed };
    /* Migración v2.1→v2.2: añadir lotes FIFO si faltan + normalizar símbolo */
    merged.holdings = merged.holdings.map(h => {
      /* Normalizar símbolo SIEMPRE a uppercase trim */
      if (h.symbol) h.symbol = String(h.symbol).trim().toUpperCase();
      if (!h.lots && h.type !== 'cash') {
        h.lots = [{
          id: `lot_${h.id}_0`,
          shares: h.shares,
          costBasis: h.costBasis,
          commission: h.commission || 0,
          purchaseDate: h.purchaseDate,
          txSnapshot: h.txSnapshot,
          txTrms: h.txTrms
        }];
      }
      return h;
    });

    /* Consolidación idempotente: siempre se ejecuta. Si no hay duplicados, no cambia nada. */
    merged.holdings = consolidateHoldings(merged.holdings);
    merged.version = APP_VERSION;
    return merged;
  } catch { return DEFAULT_DATA; }
};

/* Función reutilizable de consolidación por símbolo+type */
/* Detecta holdings que deben ocultarse en v2.7+ por ser "pseudo-cash" o vacíos:
   - type === 'cash' (legacy explícito)
   - símbolos típicos de efectivo (EFECTIVO, CASH, EURO, USD, COP) sin shares reales
   - holdings con shares === 0 o sin lotes activos
   NOTA: respeta la flag showLegacyCash en localStorage si el usuario quiere verlos. */
const CASH_SYMBOLS = ['EFECTIVO', 'CASH', 'EURO', 'EUR', 'USD', 'COP', 'DOLAR', 'DÓLAR', 'PESOS'];

const isPseudoCashOrEmpty = (h) => {
  if (!h) return true;
  /* Legacy explícito */
  if (h.type === 'cash') return true;
  /* Símbolo típico de cash */
  const sym = (h.symbol || '').trim().toUpperCase();
  if (CASH_SYMBOLS.includes(sym)) return true;
  /* Sin lotes o cantidad cero */
  const totalShares = (h.lots || []).reduce((s, l) => s + (l.shares || 0), 0);
  if (totalShares <= 0.0001 && !h.shares) return true;
  if (h.shares !== undefined && Math.abs(h.shares) < 0.0001) return true;
  return false;
};

const consolidateHoldings = (holdings) => {
  const consolidated = [];
  const bySymbol = {};
  holdings.forEach(h => {
    const symbolKey = (h.symbol || '').trim().toUpperCase();
    if (!symbolKey) return;
    const key = `${symbolKey}__${h.type}`;
    if (!bySymbol[key]) {
      bySymbol[key] = { ...h, symbol: symbolKey, lots: [...(h.lots || [])] };
      consolidated.push(bySymbol[key]);
    } else {
      const existing = bySymbol[key];
      existing.lots = [...existing.lots, ...(h.lots || [])];
      existing.shares = existing.lots.reduce((s, l) => s + l.shares, 0);
      if (h.currentPrice && !existing.currentPrice) existing.currentPrice = h.currentPrice;
      if (h.category && (!existing.category || existing.category === 'Otros')) existing.category = h.category;
      if (h.notes && existing.notes !== h.notes && !(existing.notes || '').includes(h.notes)) {
        existing.notes = (existing.notes ? existing.notes + ' | ' : '') + h.notes;
      }
    }
  });
  /* Ordenar lotes por fecha asc (FIFO) y asegurar ids únicos */
  consolidated.forEach(h => {
    if (h.lots) {
      h.lots.sort((a, b) => (a.purchaseDate || '').localeCompare(b.purchaseDate || ''));
      const seen = new Set();
      h.lots.forEach((l, i) => {
        if (!l.id || seen.has(l.id)) l.id = `lot_${h.id}_${i}_${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
        seen.add(l.id);
      });
    }
  });
  return consolidated;
};
const persistData = (d) => secureWrite(STORAGE_KEY, d);

const loadSnapshots = () => {
  if (isEncrypted()) return __decryptedCache[SNAPSHOTS_KEY] || [];
  try { return JSON.parse(localStorage.getItem(SNAPSHOTS_KEY) || '[]'); }
  catch { return []; }
};
const persistSnapshots = (s) => secureWrite(SNAPSHOTS_KEY, s);

const loadFundamentals = () => {
  try { return JSON.parse(localStorage.getItem(FUNDAMENTALS_KEY) || '{}'); }
  catch { return {}; }
};
const persistFundamentals = (f) => localStorage.setItem(FUNDAMENTALS_KEY, JSON.stringify(f));

/* Normaliza la respuesta de Finnhub /stock/metric a un objeto plano con los 15 ratios elegidos */
const normalizeMetrics = (raw) => {
  if (!raw || !raw.metric) return null;
  const m = raw.metric;
  return {
    /* Valoración */
    per: m.peNormalizedAnnual ?? m.peTTM ?? m.peBasicExclExtraTTM ?? null,
    peg: m.pegRatio ?? null,
    ps: m.psTTM ?? null,
    pb: m.pbAnnual ?? m.pbQuarterly ?? null,
    evEbitda: m['enterpriseValueOverEBITDATTM'] ?? null,
    /* Calidad */
    roe: m.roeTTM ?? m.roeRfy ?? null,
    roic: m.roicTTM ?? m.roiTTM ?? null,
    marginOp: m.operatingMarginTTM ?? null,
    debtToEquity: m['totalDebt/totalEquityAnnual'] ?? m['totalDebt/totalEquityQuarterly'] ?? null,
    currentRatio: m.currentRatioAnnual ?? m.currentRatioQuarterly ?? null,
    /* Crecimiento */
    revGrowth: m.revenueGrowthTTMYoy ?? m.revenueGrowth5Y ?? null,
    epsGrowth: m.epsGrowthTTMYoy ?? m.epsGrowth5Y ?? null,
    divYield: m.dividendYieldIndicatedAnnual ?? m.currentDividendYieldTTM ?? null,
    payoutRatio: m.payoutRatioAnnual ?? m.payoutRatioTTM ?? null,
    beta: m.beta ?? null,
    /* Adicional: 52W range */
    week52High: m['52WeekHigh'] ?? null,
    week52Low: m['52WeekLow'] ?? null,
    /* Meta */
    fetchedAt: Date.now()
  };
};

/* ============================================================
   BACKUP / EXPORT
   ============================================================ */
const downloadBlob = (content, filename, type) => {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

const downloadBackup = (data) => {
  const payload = {
    appVersion: APP_VERSION,
    exportedAt: new Date().toISOString(),
    data,
    snapshots: loadSnapshots(),
    fundamentals: loadFundamentals()
  };
  downloadBlob(JSON.stringify(payload, null, 2), `portfolio_backup_${new Date().toISOString().split('T')[0]}.json`, 'application/json');
  localStorage.setItem(LAST_BACKUP_STORE, new Date().toISOString());
};

const csvRow = (arr) => arr.map(c => {
  const s = String(c ?? '');
  return s.includes(',') || s.includes('"') ? `"${s.replace(/"/g, '""')}"` : s;
}).join(',');

const exportLedgerCSV = (data, kind = 'all') => {
  const rows = [];
  rows.push(csvRow([
    'Fecha', 'Tipo', 'Símbolo', 'Cantidad', 'Precio Unit. Nativo', 'Moneda Nativa',
    'Comisión Nativa', 'Total Nativo',
    'Total USD', 'Total EUR', 'Total COP',
    'TRM USD/COP', 'TRM EUR/COP',
    'Categoría', 'Notas'
  ]));

  if (kind === 'all' || kind === 'buys') {
    data.holdings.forEach(h => {
      if (h.type === 'cash') return;
      (h.lots || [{ shares: h.shares, costBasis: h.costBasis, commission: h.commission, purchaseDate: h.purchaseDate, txSnapshot: h.txSnapshot, txTrms: h.txTrms }]).forEach(lot => {
        const totalNativo = lot.shares * lot.costBasis + (lot.commission || 0);
        const snap = lot.txSnapshot || { USD: 0, EUR: 0, COP: 0 };
        const trms = lot.txTrms || data.trms;
        rows.push(csvRow([
          lot.purchaseDate || '', 'COMPRA', h.symbol, lot.shares, lot.costBasis, h.currency,
          lot.commission || 0, totalNativo.toFixed(2),
          (snap.USD || 0).toFixed(2), (snap.EUR || 0).toFixed(2), (snap.COP || 0).toFixed(2),
          trms.USD || '', trms.EUR || '', h.category || '', h.notes || ''
        ]));
      });
    });
  }
  if (kind === 'all' || kind === 'sales') {
    (data.sales || []).forEach(s => {
      const totalNativo = s.shares * s.sellPrice - (s.commission || 0);
      const snap = s.txSnapshot || { USD: 0, EUR: 0, COP: 0 };
      const trms = s.txTrms || data.trms;
      rows.push(csvRow([
        s.date || '', 'VENTA', s.symbol, s.shares, s.sellPrice, s.currency || 'USD',
        s.commission || 0, totalNativo.toFixed(2),
        (snap.USD || 0).toFixed(2), (snap.EUR || 0).toFixed(2), (snap.COP || 0).toFixed(2),
        trms.USD || '', trms.EUR || '', '', s.notes || ''
      ]));
    });
  }
  if (kind === 'all' || kind === 'dividends') {
    (data.dividends || []).forEach(d => {
      const snap = d.txSnapshot || { USD: 0, EUR: 0, COP: 0 };
      const trms = d.txTrms || data.trms;
      rows.push(csvRow([
        d.date || '', 'DIVIDENDO', d.symbol, '', '', d.currency || 'USD', '',
        (d.amount || 0).toFixed(2),
        (snap.USD || 0).toFixed(2), (snap.EUR || 0).toFixed(2), (snap.COP || 0).toFixed(2),
        trms.USD || '', trms.EUR || '', '', d.notes || ''
      ]));
    });
  }

  const filename = `libro_contable_${kind}_${new Date().toISOString().split('T')[0]}.csv`;
  downloadBlob('\ufeff' + rows.join('\n'), filename, 'text/csv;charset=utf-8');
};

const validateBackup = (parsed) => {

  if (!d.trms) return { ok: false, err: 'Falta campo "trms"' };

};

/* ============================================================
   GOOGLE DRIVE SYNC
   Usa Google Identity Services (GIS) para OAuth + Drive API v3.
   Scope drive.file: la app solo ve archivos que ella misma crea.
   ============================================================ */
const gdrive = {
  tokenClient: null,
  accessToken: null,
  fileId: null,

  /* Inicializa el cliente de tokens. Se llama una vez que GIS cargó. */
  initTokenClient(onToken) {
    if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
      console.warn('[gdrive] SDK de Google no cargado todavía');
      return false;
    }
    try {
      this.tokenClient = window.google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: GDRIVE_SCOPE,
        callback: (resp) => {
          if (resp.error) {
            console.error('[gdrive] Token callback error:', resp);
            onToken(null, resp.error_description || resp.error);
            return;
          }
          this.accessToken = resp.access_token;
          onToken(resp.access_token, null);
        },
        error_callback: (err) => {
          /* Capturar errores antes de llegar al callback (popup cerrado, OAuth rechazado, etc.) */
          console.error('[gdrive] OAuth error_callback:', err);
          const msg = err.type === 'popup_closed' ? 'Popup cerrado antes de autorizar'
            : err.type === 'popup_failed_to_open' ? 'Popup bloqueado por el navegador'
            : `Error OAuth: ${err.type || 'desconocido'} - ${err.message || ''}`;
          onToken(null, msg);
        }
      });
      console.log('[gdrive] tokenClient inicializado correctamente');
      return true;
    } catch (e) {
      console.error('[gdrive] Error inicializando tokenClient:', e);
      return false;
    }
  },

  /* Solicita autorización (abre popup de Google la primera vez) */
  requestAuth(interactive = true) {
    if (!this.tokenClient) {
      console.error('[gdrive] tokenClient no inicializado');
      return;
    }
    /* prompt vacío: usa caché de Google si está autorizado. prompt:'consent' fuerza re-autorización. */
    this.tokenClient.requestAccessToken({ prompt: interactive ? '' : '' });
  },

  /* Revoca el token (desconectar) */
  signOut() {
    if (this.accessToken && window.google?.accounts?.oauth2) {
      window.google.accounts.oauth2.revoke(this.accessToken, () => {});
    }
    this.accessToken = null;
    this.fileId = null;
  },

  /* Busca el archivo de datos en Drive. Devuelve el fileId o null. */
  async findFile() {
    if (!this.accessToken) throw new Error('Sin autorización');
    const q = encodeURIComponent(`name='${GDRIVE_FILENAME}' and trashed=false`);
    const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name,modifiedTime)`, {
      headers: { Authorization: `Bearer ${this.accessToken}` }
    });
    if (!r.ok) throw new Error(`Drive search error ${r.status}`);
    const j = await r.json();
    if (j.files && j.files.length > 0) {
      this.fileId = j.files[0].id;
      return { id: j.files[0].id, modifiedTime: j.files[0].modifiedTime };
    }
    return null;
  },

  /* Lee el contenido del archivo de datos */
  async readFile() {
    if (!this.fileId) {
      const found = await this.findFile();
      if (!found) return null;
    }
    const r = await fetch(`https://www.googleapis.com/drive/v3/files/${this.fileId}?alt=media`, {
      headers: { Authorization: `Bearer ${this.accessToken}` }
    });
    if (!r.ok) throw new Error(`Drive read error ${r.status}`);
    return r.json();
  },

  /* Guarda (crea o actualiza) el archivo de datos */
  async writeFile(payload) {
    if (!this.accessToken) throw new Error('Sin autorización');
    const content = JSON.stringify(payload, null, 2);
    const metadata = { name: GDRIVE_FILENAME, mimeType: 'application/json' };

    if (!this.fileId) {
      await this.findFile(); /* intenta localizar uno existente */
    }

    if (this.fileId) {
      /* Actualizar archivo existente (multipart) */
      const boundary = 'pf_boundary_' + Date.now();
      const body =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` +
        `${JSON.stringify({ name: GDRIVE_FILENAME })}\r\n` +
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n` +
        `${content}\r\n--${boundary}--`;
      const r = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${this.fileId}?uploadType=multipart`, {
        method: 'PATCH',
        headers: {
          Authorization: `Bearer ${this.accessToken}`,
          'Content-Type': `multipart/related; boundary=${boundary}`
        },
        body
      });
      if (!r.ok) throw new Error(`Drive update error ${r.status}`);
      return r.json();
    } else {
      /* Crear archivo nuevo (multipart) */
      const boundary = 'pf_boundary_' + Date.now();
      const body =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` +
        `${JSON.stringify(metadata)}\r\n` +
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n` +
        `${content}\r\n--${boundary}--`;
      const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: {
          Authorization: `Bearer ${this.accessToken}`,
          'Content-Type': `multipart/related; boundary=${boundary}`
        },
        body
      });
      if (!r.ok) throw new Error(`Drive create error ${r.status}`);
      const j = await r.json();
      this.fileId = j.id;
      return j;
    }
  }
};

const fxRates = {
  /* Devuelve { USD: cop_per_usd, EUR: cop_per_eur } */
  fetchCOP: async () => {
    try {
      /* USD→COP y EUR→COP en una sola llamada */
      const r = await fetch('https://api.frankfurter.app/latest?from=USD&to=COP,EUR');
      if (!r.ok) throw new Error('frankfurter error');
      const j = await r.json();
      const usdCop = j.rates?.COP;
      const usdEur = j.rates?.EUR;
      if (!usdCop || !usdEur) throw new Error('rates missing');
      /* EUR→COP = (USD→COP) / (USD→EUR) */
      const eurCop = usdCop / usdEur;
      return { USD: usdCop, EUR: eurCop, source: 'BCE', date: j.date };
    } catch (e) {
      /* Fallback: exchangerate.host */
      try {
        const r = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
        if (!r.ok) throw new Error('fallback error');
        const j = await r.json();
        return { USD: j.rates?.COP, EUR: j.rates?.COP / j.rates?.EUR, source: 'fallback', date: j.date };
      } catch { return null; }
    }
  }
};

/* ============================================================
   ANÁLISIS DE RIESGO: estadística sobre series de retornos
   ============================================================ */
const riskStats = {
  /* Retornos diarios a partir de serie de precios [{date, close}] */
  dailyReturns: (series) => {
    if (!series || series.length < 2) return [];
    const rets = [];
    for (let i = 1; i < series.length; i++) {
      const prev = series[i - 1].close, cur = series[i].close;
      if (prev > 0) rets.push((cur - prev) / prev);
    }
    return rets;
  },
  mean: (arr) => arr.length ? arr.reduce((s, x) => s + x, 0) / arr.length : 0,
  std: (arr) => {
    if (arr.length < 2) return 0;
    const m = riskStats.mean(arr);
    const variance = arr.reduce((s, x) => s + (x - m) ** 2, 0) / (arr.length - 1);
    return Math.sqrt(variance);
  },
  /* Volatilidad anualizada (252 días bursátiles) */
  annualizedVol: (returns) => riskStats.std(returns) * Math.sqrt(252) * 100,
  /* Sharpe ratio anualizado. rf = tasa libre de riesgo anual (decimal) */
  sharpe: (returns, rf = 0.04) => {
    if (returns.length < 2) return null;
    const annualReturn = riskStats.mean(returns) * 252;
    const annualVol = riskStats.std(returns) * Math.sqrt(252);
    if (annualVol === 0) return null;
    return (annualReturn - rf) / annualVol;
  },
  /* Beta vs benchmark: covarianza(port, bench) / varianza(bench) */
  beta: (portReturns, benchReturns) => {
    const n = Math.min(portReturns.length, benchReturns.length);
    if (n < 2) return null;
    const p = portReturns.slice(-n), b = benchReturns.slice(-n);
    const mp = riskStats.mean(p), mb = riskStats.mean(b);
    let cov = 0, varB = 0;
    for (let i = 0; i < n; i++) {
      cov += (p[i] - mp) * (b[i] - mb);
      varB += (b[i] - mb) ** 2;
    }
    if (varB === 0) return null;
    return cov / varB;
  },
  /* Serie de drawdown a partir de serie de valores [{date, value}] */
  drawdownSeries: (series) => {
    let peak = -Infinity;
    return series.map(pt => {
      if (pt.value > peak) peak = pt.value;
      const dd = peak > 0 ? ((pt.value - peak) / peak) * 100 : 0;
      return { date: pt.date, drawdown: dd };
    });
  }
};

const Sparkline = ({ data, width = 80, height = 24 }) => {
  if (!data || data.length < 2) return <div style={{ width, height }} className="text-slate-600 text-xs">—</div>;
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;
  const pts = data.map((v, i) => ({
    x: (i / (data.length - 1)) * width,
    y: height - ((v - min) / range) * (height - 2) - 1
  }));
  /* Curva suave con bezier cúbico */
  let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) {
    const prev = pts[i - 1], curr = pts[i];
    const cpx = (prev.x + curr.x) / 2;
    d += ` C ${cpx.toFixed(1)} ${prev.y.toFixed(1)}, ${cpx.toFixed(1)} ${curr.y.toFixed(1)}, ${curr.x.toFixed(1)} ${curr.y.toFixed(1)}`;
  }
  const stroke = data[data.length - 1] >= data[0] ? '#34d399' : '#f43f5e';
  return (
    <svg width={width} height={height}>
      <path d={d} fill="none" stroke={stroke} strokeWidth="1.5" strokeLinecap="round" opacity="0.4" style={{ filter: 'blur(2px)' }} />
      <path d={d} fill="none" stroke={stroke} strokeWidth="1.5" strokeLinecap="round" />
    </svg>
  );
};

/* Semáforo para ratios fundamentales.
   Rangos basados en consensos de análisis fundamental para empresas growth/tech US.
   Devuelve: 'good' (verde), 'neutral' (gris), 'warn' (amarillo), 'bad' (rojo) */
const scoreRatio = (key, value) => {
  if (value === null || value === undefined || isNaN(value)) return 'neutral';
  const v = Number(value);
  switch (key) {
    case 'per':
      if (v < 0) return 'bad'; /* pérdidas */
      if (v < 15) return 'good';
      if (v < 30) return 'neutral';
      if (v < 50) return 'warn';
      return 'bad';
    case 'peg':
      if (v < 0) return 'bad';
      if (v < 1) return 'good';
      if (v < 2) return 'neutral';
      return 'warn';
    case 'ps':
      if (v < 2) return 'good';
      if (v < 8) return 'neutral';
      if (v < 15) return 'warn';
      return 'bad';
    case 'pb':
      if (v < 1.5) return 'good';
      if (v < 4) return 'neutral';
      return 'warn';
    case 'evEbitda':
      if (v < 10) return 'good';
      if (v < 20) return 'neutral';
      if (v < 35) return 'warn';
      return 'bad';
    case 'roe':
      if (v > 20) return 'good';
      if (v > 10) return 'neutral';
      if (v > 0) return 'warn';
      return 'bad';
    case 'roic':
      if (v > 15) return 'good';
      if (v > 8) return 'neutral';
      if (v > 0) return 'warn';
      return 'bad';
    case 'marginOp':
      if (v > 20) return 'good';
      if (v > 10) return 'neutral';
      if (v > 0) return 'warn';
      return 'bad';
    case 'debtToEquity':
      if (v < 0.5) return 'good';
      if (v < 1.5) return 'neutral';
      if (v < 3) return 'warn';
      return 'bad';
    case 'currentRatio':
      if (v > 2) return 'good';
      if (v > 1) return 'neutral';
      return 'bad';
    case 'revGrowth':
      if (v > 20) return 'good';
      if (v > 5) return 'neutral';
      if (v > 0) return 'warn';
      return 'bad';
    case 'epsGrowth':
      if (v > 15) return 'good';
      if (v > 0) return 'neutral';
      return 'bad';
    case 'divYield':
      if (v > 3) return 'good';
      if (v > 1) return 'neutral';
      return 'warn';
    case 'payoutRatio':
      if (v > 0 && v < 60) return 'good';
      if (v < 80) return 'neutral';
      return 'warn';
    case 'beta':
      if (v < 1) return 'good';
      if (v < 1.5) return 'neutral';
      if (v < 2) return 'warn';
      return 'bad';
    default: return 'neutral';
  }
};

/* DONUT CHART - SVG, para distribución de diversificación */
const DonutChart = ({ data, title, size = 180 }) => {
  const [hover, setHover] = useState(null);
  if (!data || !data.length) return null;
  const total = data.reduce((s, d) => s + d.value, 0);
  if (total <= 0) return null;

  const radius = size / 2;
  const innerRadius = radius * 0.58;
  const cx = radius, cy = radius;

  /* Paleta consistente */
  const palette = ['#22d3ee', '#a78bfa', '#f59e0b', '#34d399', '#f87171', '#60a5fa', '#fbbf24', '#c084fc', '#4ade80', '#fb7185'];

  let angleStart = -Math.PI / 2; /* empezar arriba */
  const segments = data.map((d, i) => {
    const fraction = d.value / total;
    const angleEnd = angleStart + fraction * 2 * Math.PI;
    const largeArc = fraction > 0.5 ? 1 : 0;
    const x1 = cx + radius * Math.cos(angleStart);
    const y1 = cy + radius * Math.sin(angleStart);
    const x2 = cx + radius * Math.cos(angleEnd);
    const y2 = cy + radius * Math.sin(angleEnd);
    const x3 = cx + innerRadius * Math.cos(angleEnd);
    const y3 = cy + innerRadius * Math.sin(angleEnd);
    const x4 = cx + innerRadius * Math.cos(angleStart);
    const y4 = cy + innerRadius * Math.sin(angleStart);
    const path = `M ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} L ${x3} ${y3} A ${innerRadius} ${innerRadius} 0 ${largeArc} 0 ${x4} ${y4} Z`;
    const seg = { ...d, path, color: palette[i % palette.length], fraction, pct: fraction * 100 };
    angleStart = angleEnd;
    return seg;
  });

  return (
    <div className="glass-card p-3">
      <div className="text-xs text-slate-400 mb-2 uppercase tracking-wider text-center">{title}</div>
      <div className="flex flex-col items-center gap-3">
        <div className="relative" style={{ width: size, height: size }}>
          <svg width={size} height={size}>
            {segments.map((s, i) => (
              <path key={i} d={s.path} fill={s.color}
                stroke="#020617" strokeWidth="2"
                opacity={hover === null || hover === i ? 1 : 0.35}
                style={{ transition: 'opacity 0.15s', cursor: 'pointer' }}
                onMouseEnter={() => setHover(i)}
                onMouseLeave={() => setHover(null)} />
            ))}
          </svg>
          {/* Centro: total o item en hover */}
          <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
            {hover !== null ? (
              <>
                <div className="text-sm font-bold text-white">{segments[hover].pct.toFixed(1)}%</div>
                <div className="text-[10px] text-slate-400 max-w-[80px] text-center truncate">{segments[hover].label}</div>
              </>
            ) : (
              <>
                <div className="text-[10px] text-slate-500">Total</div>
                <div className="text-xs font-bold text-white">{fmtMoney(total, data[0]?.currency || 'USD')}</div>
              </>
            )}
          </div>
        </div>
        {/* Leyenda */}
        <div className="w-full space-y-1">
          {segments.map((s, i) => (
            <div key={i}
              className="flex items-center justify-between text-xs px-1 py-0.5 rounded cursor-pointer"
              style={{ background: hover === i ? 'rgba(255,255,255,0.05)' : 'transparent' }}
              onMouseEnter={() => setHover(i)}
              onMouseLeave={() => setHover(null)}>
              <div className="flex items-center gap-1.5 min-w-0">
                <span className="w-2.5 h-2.5 rounded-sm flex-shrink-0" style={{ background: s.color }}></span>
                <span className="text-slate-300 truncate">{s.label}</span>
              </div>
              <span className="font-mono text-slate-400 flex-shrink-0 ml-2">{s.pct.toFixed(1)}%</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

/* TREEMAP profesional - DIVs HTML posicionados, texto que respeta el contenedor, responsive */
const Treemap = ({ items, height = 400, viewCurrency = 'USD' }) => {
  const [hover, setHover] = useState(null);
  const [dims, setDims] = useState({ w: 1000, h: height });
  const containerRef = useRef(null);

  /* Medir el ancho real del contenedor (responsive) */
  useEffect(() => {
    const measure = () => {
      if (containerRef.current) {
        const w = containerRef.current.clientWidth;
        setDims({ w: Math.max(100, w), h: height });
      }
    };
    measure();
    window.addEventListener('resize', measure);
    return () => window.removeEventListener('resize', measure);
  }, [height]);

  if (!items.length) return <div className="text-center text-slate-500 py-12 text-sm">Sin datos para visualizar.</div>;
  const filtered = items.filter(it => it.value > 0);
  if (!filtered.length) return null;

  /* Squarified treemap simplificado y robusto */
  const sorted = [...filtered].sort((a, b) => b.value - a.value);
  const total = sorted.reduce((s, x) => s + x.value, 0);
  const layout = [];
  const totalArea = dims.w * dims.h;
  const scale = totalArea / total;

  const worstAspect = (row, sideLen) => {
    if (!row.length) return Infinity;
    const sum = row.reduce((s, r) => s + r.value, 0) * scale;
    const rowMin = Math.min(...row.map(r => r.value)) * scale;
    const rowMax = Math.max(...row.map(r => r.value)) * scale;
    const w2 = sideLen * sideLen;
    return Math.max((w2 * rowMax) / (sum * sum), (sum * sum) / (w2 * rowMin));
  };

  const placeRow = (row, rect) => {
    const sum = row.reduce((s, r) => s + r.value, 0) * scale;
    const isHoriz = rect.w >= rect.h;
    if (isHoriz) {
      const rowW = sum / rect.h;
      let off = 0;
      row.forEach(it => {
        const h = it.value * scale / rowW;
        layout.push({ ...it, x: rect.x, y: rect.y + off, w: rowW, h });
        off += h;
      });
      return { x: rect.x + rowW, y: rect.y, w: Math.max(0, rect.w - rowW), h: rect.h };
    } else {
      const rowH = sum / rect.w;
      let off = 0;
      row.forEach(it => {
        const w = it.value * scale / rowH;
        layout.push({ ...it, x: rect.x + off, y: rect.y, w, h: rowH });
        off += w;
      });
      return { x: rect.x, y: rect.y + rowH, w: rect.w, h: Math.max(0, rect.h - rowH) };
    }
  };

  let rect = { x: 0, y: 0, w: dims.w, h: dims.h };
  let row = [];
  let remaining = [...sorted];
  while (remaining.length) {
    const sideLen = Math.min(rect.w, rect.h);
    if (sideLen <= 0) break;
    const next = remaining[0];
    const trial = [...row, next];
    if (row.length === 0 || worstAspect(trial, sideLen) <= worstAspect(row, sideLen)) {
      row.push(next);
      remaining.shift();
    } else {
      rect = placeRow(row, rect);
      row = [];
    }
  }
  if (row.length) placeRow(row, rect);

  /* HSL gradient continuo: P/L total largo plazo. Rango ±50% */
  const colorFor = (pct) => {
    const clamped = Math.max(-50, Math.min(50, pct || 0));
    const intensity = Math.abs(clamped) / 50;
    if (Math.abs(clamped) < 1) return { fill: '#334155', stroke: '#475569' };
    if (clamped > 0) {
      const lightness = 30 - intensity * 10;
      const saturation = 45 + intensity * 35;
      return { fill: `hsl(142, ${saturation}%, ${lightness}%)`, stroke: `hsl(142, ${saturation}%, ${lightness + 12}%)` };
    }
    const lightness = 34 - intensity * 10;
    const saturation = 55 + intensity * 30;
    return { fill: `hsl(0, ${saturation}%, ${lightness}%)`, stroke: `hsl(0, ${saturation}%, ${lightness + 12}%)` };
  };

  const handleMove = (e, b) => {
    const r = containerRef.current?.getBoundingClientRect();
    if (!r) return;
    setHover({ ...b, mouseX: e.clientX - r.left, mouseY: e.clientY - r.top });
  };

  return (
    <div ref={containerRef} style={{ width: '100%', height, position: 'relative', background: '#020617', borderRadius: 6, overflow: 'hidden' }} onMouseLeave={() => setHover(null)}>
      {layout.map((b, i) => {
        const c = colorFor(b.plPct || 0);
        /* Tipografía adaptativa basada en dimensión más corta */
        const minSide = Math.min(b.w, b.h);
        const fs = Math.max(8, Math.min(22, minSide / 4.5));
        /* Decidir qué mostrar según área */
        const showSymbol = b.w > 30 && b.h > 18;
        const showPct = b.w > 50 && b.h > 38;
        const showWeight = b.w > 70 && b.h > 60;
        const isHovered = hover && hover.symbol === b.symbol;
        return (
          <div key={i}
            onMouseMove={e => handleMove(e, b)}
            onMouseEnter={e => handleMove(e, b)}
            style={{
              position: 'absolute',
              left: b.x + 1, top: b.y + 1,
              width: Math.max(0, b.w - 2), height: Math.max(0, b.h - 2),
              background: `linear-gradient(to bottom, ${c.stroke}, ${c.fill})`,
              border: isHovered ? '2px solid #fff' : '1px solid #020617',
              borderRadius: 4,
              cursor: 'pointer',
              display: 'flex',
              flexDirection: 'column',
              alignItems: 'center',
              justifyContent: 'center',
              overflow: 'hidden',
              padding: 2,
              boxSizing: 'border-box',
              transition: 'border 0.15s',
              userSelect: 'none'
            }}>
            {showSymbol && (
              <div style={{
                fontSize: fs,
                fontWeight: 700,
                color: '#fff',
                textShadow: '0 1px 2px rgba(0,0,0,0.7)',
                lineHeight: 1.05,
                maxWidth: '100%',
                overflow: 'hidden',
                textOverflow: 'ellipsis',
                whiteSpace: 'nowrap',
                textAlign: 'center'
              }}>{b.symbol}</div>
            )}
            {showPct && (
              <div style={{
                fontSize: fs * 0.55,
                fontWeight: 500,
                color: '#fff',
                opacity: 0.95,
                textShadow: '0 1px 2px rgba(0,0,0,0.7)',
                fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace',
                whiteSpace: 'nowrap'
              }}>{fmtPct(b.plPct || 0)}</div>
            )}
            {showWeight && (
              <div style={{
                fontSize: fs * 0.45,
                color: '#fff',
                opacity: 0.75,
                textShadow: '0 1px 2px rgba(0,0,0,0.7)',
                fontFamily: 'ui-monospace, monospace',
                whiteSpace: 'nowrap'
              }}>{(b.weight * 100).toFixed(1)}%</div>
            )}
          </div>
        );
      })}
      {hover && (
        <div className="absolute pointer-events-none bg-slate-950/95 border border-slate-600 rounded-lg shadow-2xl px-3 py-2 text-xs z-20 min-w-[170px]"
          style={{
            left: Math.min(hover.mouseX + 14, dims.w - 190),
            top: Math.min(hover.mouseY + 14, height - 140)
          }}>
          <div className="font-bold text-cyan-400 text-sm mb-1">{hover.symbol}</div>
          <div className="space-y-0.5">
            <div className="flex justify-between gap-3"><span className="text-slate-400">Valor:</span><span className="font-mono text-white">{fmtMoney(hover.value, viewCurrency)}</span></div>
            <div className="flex justify-between gap-3"><span className="text-slate-400">P/L total:</span><span className={`font-mono ${(hover.plPct || 0) >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtPct(hover.plPct || 0)}</span></div>
            {hover.cagr !== null && hover.cagr !== undefined && <div className="flex justify-between gap-3"><span className="text-slate-400">CAGR:</span><span className={`font-mono ${(hover.cagr || 0) >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtPct(hover.cagr)}</span></div>}
            <div className="flex justify-between gap-3"><span className="text-slate-400">% Día:</span><span className={`font-mono ${(hover.changePct || 0) >= 0 ? 'text-green-400' : 'text-red-400'}`}>{fmtPct(hover.changePct || 0)}</span></div>
            <div className="flex justify-between gap-3"><span className="text-slate-400">% Portfolio:</span><span className="font-mono text-white">{(hover.weight * 100).toFixed(2)}%</span></div>
            {hover.category && <div className="flex justify-between gap-3"><span className="text-slate-400">Categoría:</span><span className="text-slate-300">{hover.category}</span></div>}
          </div>
        </div>
      )}
      <div className="absolute bottom-2 left-2 flex items-center gap-2 text-[10px] bg-slate-950/80 backdrop-blur rounded px-2 py-1">
        <span className="text-slate-400">P/L:</span>
        <div className="flex items-center gap-0.5">
          <span style={{ background: 'hsl(0, 85%, 24%)' }} className="w-4 h-3 rounded-sm"></span>
          <span style={{ background: 'hsl(0, 65%, 30%)' }} className="w-4 h-3"></span>
          <span style={{ background: '#334155' }} className="w-4 h-3"></span>
          <span style={{ background: 'hsl(142, 60%, 25%)' }} className="w-4 h-3"></span>
          <span style={{ background: 'hsl(142, 80%, 20%)' }} className="w-4 h-3 rounded-sm"></span>
        </div>
        <span className="text-slate-500">−50%</span><span className="text-slate-500">0</span><span className="text-slate-500">+50%</span>
      </div>
    </div>
  );
};

/* GRÁFICO DE LÍNEA - patrimonio en el tiempo, con benchmark opcional.
   data: [{date, value}]  ·  benchmark: [{date, value}] opcional
   Cuando hay benchmark, ambas series se normalizan a base 100 para comparar rendimiento. */
/* GRÁFICO DE LÍNEA enriquecido:
   - data: [{date, value}]  patrimonio total
   - contributions: [{date, value}]  capital aportado acumulado (opcional)
   - benchmark: [{date, value}]  benchmark normalizado (opcional)
   - events: [{date, type, label}]  marcadores en el gráfico (compra/venta/dividendo)
   - projection: [{date, value, lower, upper}]  proyección futura con banda (opcional)
   - viewCurrency: para formatear valores
   - mode: 'absolute' (valores monetarios) | 'pct' (% retorno acumulado base 0) */
const LineChart = ({
  data, contributions = null, benchmark = null, events = null, projection = null,
  width = 800, height = 300,
  label = 'Patrimonio', benchmarkLabel = 'SPY',
  viewCurrency = 'USD', mode = 'absolute'
}) => {
  const [hoverEvent, setHoverEvent] = useState(null);
  const [hoverIdx, setHoverIdx] = useState(null);
  const svgRef = useRef(null);

  if (!data || data.length < 2) {
    return <div className="text-center text-slate-500 py-16 text-sm"><i className="fa-solid fa-chart-line text-3xl text-slate-700 mb-3"></i><br/>Acumulando datos... Necesitas al menos 2 snapshots.</div>;
  }
  const padding = { top: 28, right: 24, bottom: 36, left: 70 };
  const innerW = width - padding.left - padding.right;
  const innerH = height - padding.top - padding.bottom;

  const hasBench = benchmark && benchmark.length >= 2;
  const hasContrib = contributions && contributions.length >= 2 && mode === 'absolute';
  const hasProjection = projection && projection.length >= 1 && mode === 'absolute';

  const transform = (series) => {
    if (mode === 'pct' && series && series.length > 0) {
      const base = series[0].value || 1;
      return series.map(d => ({ date: d.date, value: ((d.value - base) / base) * 100 }));
    }
    return series;
  };

  let series1 = transform(data);
  let series2 = null;
  let seriesContrib = hasContrib ? contributions : null;
  let seriesProj = hasProjection ? projection : null;

  if (hasBench) {
    if (mode === 'pct') {
      const base = benchmark[0].value || 1;
      series2 = benchmark.map(d => ({ date: d.date, value: ((d.value - base) / base) * 100 }));
    } else {
      const base1 = data[0].value || 1;
      series1 = data.map(d => ({ date: d.date, value: (d.value / base1) * 100 }));
      const base2 = benchmark[0].value || 1;
      series2 = benchmark.map(d => ({ date: d.date, value: (d.value / base2) * 100 }));
      seriesContrib = null;
      seriesProj = null;
    }
  }

  const allValues = [
    ...series1.map(d => d.value),
    ...(series2 ? series2.map(d => d.value) : []),
    ...(seriesContrib ? seriesContrib.map(d => d.value) : []),
    ...(seriesProj ? seriesProj.flatMap(d => [d.value, d.lower, d.upper].filter(v => v !== undefined)) : [])
  ];
  let min = Math.min(...allValues), max = Math.max(...allValues);
  if (mode === 'pct') { if (min > 0) min = 0; if (max < 0) max = 0; }
  const range = max - min || 1;

  const allDates = [...series1.map(d => d.date)];
  if (seriesProj) seriesProj.forEach(p => allDates.push(p.date));
  const uniqueDates = [...new Set(allDates)].sort();
  const dateToX = (date) => {
    const idx = uniqueDates.indexOf(date);
    if (idx === -1) return padding.left;
    return padding.left + (idx / Math.max(1, uniqueDates.length - 1)) * innerW;
  };
  const valToY = (v) => padding.top + innerH - ((v - min) / range) * innerH;

  const toPoints = (series) => series.map(d => ({ x: dateToX(d.date), y: valToY(d.value), ...d }));

  /* Curva suave con bezier cúbico */
  const smoothPath = (pts) => {
    if (pts.length < 2) return '';
    let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
    for (let i = 1; i < pts.length; i++) {
      const prev = pts[i - 1], curr = pts[i];
      const cpx = (prev.x + curr.x) / 2;
      d += ` C ${cpx.toFixed(1)} ${prev.y.toFixed(1)}, ${cpx.toFixed(1)} ${curr.y.toFixed(1)}, ${curr.x.toFixed(1)} ${curr.y.toFixed(1)}`;
    }
    return d;
  };

  const points1 = toPoints(series1);
  const points2 = series2 ? toPoints(series2) : null;
  const pointsContrib = seriesContrib ? toPoints(seriesContrib) : null;

  const path1 = smoothPath(points1);
  const straightPath = (pts) => pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
  const areaPath1 = `${straightPath(points1)} L ${points1[points1.length - 1].x.toFixed(1)} ${padding.top + innerH} L ${padding.left} ${padding.top + innerH} Z`;

  const first = series1[0].value, last = series1[series1.length - 1].value;
  const up = last >= first;
  const color = up ? '#34d399' : '#f43f5e';
  const colorGlow = up ? 'rgba(52, 211, 153, 0.3)' : 'rgba(244, 63, 94, 0.3)';

  const yTicks = 5;
  const tickValues = Array.from({ length: yTicks + 1 }, (_, i) => min + (range * i / yTicks));
  const fmtTick = (v) => {
    if (mode === 'pct') return `${v >= 0 ? '+' : ''}${v.toFixed(1)}%`;
    if (hasBench) return v.toFixed(0);
    if (Math.abs(v) >= 1000000) return `${(v / 1000000).toFixed(1)}M`;
    if (Math.abs(v) >= 1000) return `${(v / 1000).toFixed(0)}k`;
    return fmt(v, 0);
  };

  let alpha = null;
  if (hasBench && !hasContrib) {
    const portReturn = series1[series1.length - 1].value - (mode === 'pct' ? 0 : 100);
    const benchReturn = series2[series2.length - 1].value - (mode === 'pct' ? 0 : 100);
    alpha = portReturn - benchReturn;
  }

  /* Proyección */
  let projAreaPath = null, projLinePath = null;
  const pointsProj = seriesProj ? seriesProj.map(d => ({
    x: dateToX(d.date), y: valToY(d.value),
    yLow: d.lower !== undefined ? valToY(d.lower) : null,
    yHigh: d.upper !== undefined ? valToY(d.upper) : null, ...d
  })) : null;
  if (pointsProj && pointsProj.length > 0 && pointsProj[0].yHigh !== null) {
    const topPath = pointsProj.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.yHigh.toFixed(1)}`).join(' ');
    const bottomPath = [...pointsProj].reverse().map(p => `L ${p.x.toFixed(1)} ${p.yLow.toFixed(1)}`).join(' ');
    projAreaPath = `${topPath} ${bottomPath} Z`;
    const lastReal = points1[points1.length - 1];
    projLinePath = `M ${lastReal.x.toFixed(1)} ${lastReal.y.toFixed(1)} ` + pointsProj.map(p => `L ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
  }

  /* Eventos */
  const eventMarkers = (events || []).map(ev => {
    const x = dateToX(ev.date);
    const closest = data.reduce((best, d) =>
      Math.abs(new Date(d.date) - new Date(ev.date)) < Math.abs(new Date(best.date) - new Date(ev.date)) ? d : best, data[0]);
    const val = mode === 'pct' ? ((closest.value - data[0].value) / data[0].value) * 100 : (hasBench ? (closest.value / data[0].value) * 100 : closest.value);
    return { ...ev, x, y: valToY(val) };
  }).filter(m => m.x >= padding.left - 2 && m.x <= width - padding.right + 2);

  const eventColors = { buy: '#34d399', sell: '#f43f5e', dividend: '#f59e0b' };

  /* Hover handler */
  const handleMouseMove = (e) => {
    const rect = svgRef.current?.getBoundingClientRect();
    if (!rect) return;
    const mouseX = ((e.clientX - rect.left) / rect.width) * width;
    let closest = 0, closestDist = Infinity;
    points1.forEach((p, i) => {
      const dist = Math.abs(p.x - mouseX);
      if (dist < closestDist) { closestDist = dist; closest = i; }
    });
    setHoverIdx(closestDist < 40 ? closest : null);
  };

  /* Fechas para eje X */
  const xLabelCount = Math.min(6, series1.length);
  const xLabels = [];
  for (let i = 0; i < xLabelCount; i++) {
    const idx = Math.round(i * (series1.length - 1) / (xLabelCount - 1));
    xLabels.push({ x: points1[idx].x, label: series1[idx].date.slice(5) }); /* MM-DD */
  }

  return (
    <div>
      <svg ref={svgRef} width="100%" height={height} viewBox={`0 0 ${width} ${height}`}
        onMouseMove={handleMouseMove} onMouseLeave={() => setHoverIdx(null)} style={{ cursor: 'crosshair' }}>
        <defs>
          <linearGradient id="gradEvo3" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.20" />
            <stop offset="60%" stopColor={color} stopOpacity="0.05" />
            <stop offset="100%" stopColor={color} stopOpacity="0" />
          </linearGradient>
          <linearGradient id="gradReturn3" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stopColor="#34d399" stopOpacity="0.12" />
            <stop offset="100%" stopColor="#34d399" stopOpacity="0" />
          </linearGradient>
          <filter id="glow3">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>

        {/* Grid */}
        {tickValues.map((v, i) => {
          const y = valToY(v);
          const isZero = mode === 'pct' && Math.abs(v) < 0.01;
          return (
            <g key={i}>
              <line x1={padding.left} x2={width - padding.right} y1={y} y2={y}
                stroke={isZero ? '#475569' : '#1e293b'} strokeWidth={isZero ? 1 : 0.5} strokeDasharray={isZero ? '6 3' : '3 6'} />
              <text x={padding.left - 10} y={y + 3} textAnchor="end" fill="#475569" fontSize="10" fontFamily="'JetBrains Mono', monospace">
                {fmtTick(v)}
              </text>
            </g>
          );
        })}

        {/* Eje X labels */}
        {xLabels.map((xl, i) => (
          <text key={i} x={xl.x} y={height - 8} textAnchor="middle" fill="#475569" fontSize="9" fontFamily="'JetBrains Mono', monospace">{xl.label}</text>
        ))}

        {/* Área aportes↔patrimonio */}
        {pointsContrib && (() => {
          const top = straightPath(points1);
          const bottom = [...pointsContrib].reverse().map(p => `L ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
          return <path d={`${top} ${bottom} Z`} fill="url(#gradReturn3)" />;
        })()}

        {/* Proyección banda */}
        {projAreaPath && <path d={projAreaPath} fill="#475569" opacity="0.1" />}

        {/* Área principal */}
        {!pointsContrib && <path d={areaPath1} fill="url(#gradEvo3)" />}

        {/* Línea de aportes */}
        {pointsContrib && <path d={smoothPath(pointsContrib)} fill="none" stroke="#475569" strokeWidth="1.5" strokeDasharray="4 3" />}

        {/* Benchmark */}
        {points2 && <path d={smoothPath(points2)} fill="none" stroke="#64748b" strokeWidth="1.5" strokeDasharray="6 4" opacity="0.7" />}

        {/* Proyección línea */}
        {projLinePath && <path d={projLinePath} fill="none" stroke={color} strokeWidth="1.5" strokeDasharray="4 4" opacity="0.5" />}

        {/* Línea principal con glow */}
        <path d={path1} fill="none" stroke={color} strokeWidth="1" opacity="0.4" filter="url(#glow3)" />
        <path d={path1} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" />

        {/* Punto final destacado */}
        <circle cx={points1[points1.length - 1].x} cy={points1[points1.length - 1].y} r="4" fill={color} stroke="#020617" strokeWidth="2" />

        {/* Crosshair + tooltip on hover */}
        {hoverIdx !== null && points1[hoverIdx] && (
          <g>
            <line x1={points1[hoverIdx].x} x2={points1[hoverIdx].x}
              y1={padding.top} y2={padding.top + innerH}
              stroke="#475569" strokeWidth="0.5" strokeDasharray="3 3" />
            <circle cx={points1[hoverIdx].x} cy={points1[hoverIdx].y} r="5" fill={color} stroke="#020617" strokeWidth="2" />
            {/* Tooltip box */}
            <rect x={Math.min(points1[hoverIdx].x + 10, width - 140)} y={Math.max(points1[hoverIdx].y - 38, 4)}
              width="130" height="34" rx="6" fill="#0f172a" stroke="#334155" strokeWidth="0.5" opacity="0.95" />
            <text x={Math.min(points1[hoverIdx].x + 10, width - 140) + 8} y={Math.max(points1[hoverIdx].y - 38, 4) + 14}
              fill="#94a3b8" fontSize="9" fontFamily="'JetBrains Mono', monospace">{series1[hoverIdx].date}</text>
            <text x={Math.min(points1[hoverIdx].x + 10, width - 140) + 8} y={Math.max(points1[hoverIdx].y - 38, 4) + 27}
              fill="#e2e8f0" fontSize="11" fontWeight="600" fontFamily="'JetBrains Mono', monospace">
              {mode === 'pct' ? `${series1[hoverIdx].value >= 0 ? '+' : ''}${series1[hoverIdx].value.toFixed(2)}%` : (hasBench ? series1[hoverIdx].value.toFixed(1) : fmtTick(series1[hoverIdx].value))}
            </text>
          </g>
        )}

        {/* Marcadores de eventos */}
        {eventMarkers.map((ev, i) => (
          <g key={i} style={{ cursor: 'pointer' }}
            onMouseEnter={() => { setHoverEvent(ev); setHoverIdx(null); }}
            onMouseLeave={() => setHoverEvent(null)}>
            {ev.type === 'dividend' ? (
              <polygon points={`${ev.x},${ev.y-5} ${ev.x+1.5},${ev.y-1.5} ${ev.x+5},${ev.y-1.5} ${ev.x+2},${ev.y+1.5} ${ev.x+3},${ev.y+5} ${ev.x},${ev.y+2.5} ${ev.x-3},${ev.y+5} ${ev.x-2},${ev.y+1.5} ${ev.x-5},${ev.y-1.5} ${ev.x-1.5},${ev.y-1.5}`}
                fill={eventColors.dividend} stroke="#020617" strokeWidth="0.5" />
            ) : (
              <circle cx={ev.x} cy={ev.y} r="4" fill={eventColors[ev.type]} stroke="#020617" strokeWidth="1.5" />
            )}
          </g>
        ))}

        {/* Event tooltip */}
        {hoverEvent && (
          <g pointerEvents="none">
            <rect x={Math.min(hoverEvent.x + 8, width - 180)} y={Math.max(hoverEvent.y - 30, 4)}
              width="170" height="38" rx="6" fill="#0f172a" stroke="#334155" strokeWidth="0.5" opacity="0.95" />
            <text x={Math.min(hoverEvent.x + 8, width - 180) + 8} y={Math.max(hoverEvent.y - 30, 4) + 14}
              fill={eventColors[hoverEvent.type]} fontSize="10" fontWeight="bold">
              {hoverEvent.type === 'buy' ? '↑ Compra' : hoverEvent.type === 'sell' ? '↓ Venta' : '★ Dividendo'} · {hoverEvent.date}
            </text>
            <text x={Math.min(hoverEvent.x + 8, width - 180) + 8} y={Math.max(hoverEvent.y - 30, 4) + 28}
              fill="#94a3b8" fontSize="9">{hoverEvent.label}</text>
          </g>
        )}
      </svg>

      {/* Leyenda */}
      <div className="flex items-center justify-center gap-4 text-[10px] mt-1.5 flex-wrap text-slate-400">
        <span className="flex items-center gap-1.5">
          <span className="w-5 h-0.5 rounded" style={{ background: color }}></span>
          <span>{label}{(hasBench && mode === 'absolute') ? ' (base 100)' : mode === 'pct' ? ' (%)' : ''}</span>
        </span>
        {pointsContrib && (
          <span className="flex items-center gap-1.5">
            <span className="w-5 border-t border-dashed border-slate-500"></span>
            <span>Aportes</span>
          </span>
        )}
        {points2 && (
          <span className="flex items-center gap-1.5">
            <span className="w-5 border-t border-dashed border-slate-500"></span>
            <span>{benchmarkLabel}</span>
          </span>
        )}
        {seriesProj && (
          <span className="flex items-center gap-1.5">
            <span className="w-5 border-t border-dotted border-slate-500"></span>
            <span>Proyección</span>
          </span>
        )}
        {events && events.length > 0 && (
          <span className="flex items-center gap-2">
            <span className="flex items-center gap-0.5"><span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>Compra</span>
            <span className="flex items-center gap-0.5"><span className="w-1.5 h-1.5 rounded-full bg-rose-400"></span>Venta</span>
            <span className="flex items-center gap-0.5"><span className="text-amber-400 text-[8px]">★</span>Div</span>
          </span>
        )}
        {alpha !== null && (
          <span className={`font-bold font-mono ${alpha >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
            α {alpha >= 0 ? '+' : ''}{alpha.toFixed(1)}
          </span>
        )}
      </div>
    </div>
  );
};

/* GRÁFICO DE DRAWDOWN mejorado */
const DrawdownChart = ({ series, width = 800, height = 150 }) => {
  const [hoverIdx, setHoverIdx] = useState(null);
  const svgRef = useRef(null);

  if (!series || series.length < 2) {
    return <div className="text-center text-slate-500 py-8 text-xs">Necesitas más snapshots para ver el drawdown.</div>;
  }
  const padding = { top: 16, right: 24, bottom: 28, left: 55 };
  const innerW = width - padding.left - padding.right;
  const innerH = height - padding.top - padding.bottom;
  const minDD = Math.min(...series.map(d => d.drawdown), -1);
  const range = Math.abs(minDD) || 1;

  const points = series.map((d, i) => {
    const x = padding.left + (i / (series.length - 1)) * innerW;
    const y = padding.top + (Math.abs(d.drawdown) / range) * innerH;
    return { x, y, ...d };
  });

  const smoothPath = (pts) => {
    if (pts.length < 2) return '';
    let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
    for (let i = 1; i < pts.length; i++) {
      const prev = pts[i - 1], curr = pts[i];
      const cpx = (prev.x + curr.x) / 2;
      d += ` C ${cpx.toFixed(1)} ${prev.y.toFixed(1)}, ${cpx.toFixed(1)} ${curr.y.toFixed(1)}, ${curr.x.toFixed(1)} ${curr.y.toFixed(1)}`;
    }
    return d;
  };

  const path = smoothPath(points);
  const areaPath = `${points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ')} L ${points[points.length - 1].x.toFixed(1)} ${padding.top} L ${padding.left} ${padding.top} Z`;

  const handleMouseMove = (e) => {
    const rect = svgRef.current?.getBoundingClientRect();
    if (!rect) return;
    const mouseX = ((e.clientX - rect.left) / rect.width) * width;
    let closest = 0, closestDist = Infinity;
    points.forEach((p, i) => { const d = Math.abs(p.x - mouseX); if (d < closestDist) { closestDist = d; closest = i; } });
    setHoverIdx(closestDist < 40 ? closest : null);
  };

  return (
    <svg ref={svgRef} width="100%" height={height} viewBox={`0 0 ${width} ${height}`}
      onMouseMove={handleMouseMove} onMouseLeave={() => setHoverIdx(null)} style={{ cursor: 'crosshair' }}>
      <defs>
        <linearGradient id="gradDD3" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor="#f43f5e" stopOpacity="0" />
          <stop offset="100%" stopColor="#f43f5e" stopOpacity="0.25" />
        </linearGradient>
      </defs>
      <line x1={padding.left} x2={width - padding.right} y1={padding.top} y2={padding.top} stroke="#334155" strokeWidth="0.5" strokeDasharray="3 6" />
      <text x={padding.left - 8} y={padding.top + 3} textAnchor="end" fill="#475569" fontSize="9" fontFamily="'JetBrains Mono', monospace">0%</text>
      <text x={padding.left - 8} y={padding.top + innerH} textAnchor="end" fill="#475569" fontSize="9" fontFamily="'JetBrains Mono', monospace">{minDD.toFixed(0)}%</text>
      <path d={areaPath} fill="url(#gradDD3)" />
      <path d={path} fill="none" stroke="#f43f5e" strokeWidth="1.5" strokeLinecap="round" opacity="0.8" />
      {hoverIdx !== null && points[hoverIdx] && (
        <g>
          <line x1={points[hoverIdx].x} x2={points[hoverIdx].x} y1={padding.top} y2={padding.top + innerH} stroke="#475569" strokeWidth="0.5" strokeDasharray="3 3" />
          <circle cx={points[hoverIdx].x} cy={points[hoverIdx].y} r="4" fill="#f43f5e" stroke="#020617" strokeWidth="2" />
          <rect x={Math.min(points[hoverIdx].x + 8, width - 100)} y={Math.max(points[hoverIdx].y - 24, 4)}
            width="90" height="20" rx="4" fill="#0f172a" stroke="#334155" strokeWidth="0.5" opacity="0.95" />
          <text x={Math.min(points[hoverIdx].x + 8, width - 100) + 6} y={Math.max(points[hoverIdx].y - 24, 4) + 14}
            fill="#f43f5e" fontSize="10" fontWeight="600" fontFamily="'JetBrains Mono', monospace">
            {series[hoverIdx].drawdown.toFixed(2)}%
          </text>
        </g>
      )}
    </svg>
  );
};

/* ============================================================
   MODAL POSICIÓN (con FIFO: añade lote en vez de sobreescribir)
   ============================================================ */
const PositionModal = ({ open, onClose, onSave, holdingToEdit, lotToEdit, currentTrms, mode = 'newPosition' /* newPosition | addLot | editLot */ }) => {
  const [txTrms, setTxTrms] = useState(currentTrms);
  const [preview, setPreview] = useState({ USD: 0, EUR: 0, COP: 0 });
  const formRef = useRef(null);

  useEffect(() => {
    if (open) setTxTrms(lotToEdit?.txTrms || currentTrms);
  }, [open, lotToEdit, currentTrms]);

  const recalcPreview = () => {
    const f = formRef.current; if (!f) return;
    const shares = parseFloat(f.shares?.value) || 0;
    const cost = parseFloat(f.costBasis?.value) || 0;
    const comm = parseFloat(f.commission?.value) || 0;
    const cur = f.currency?.value || holdingToEdit?.currency || 'USD';
    setPreview(snapshotMultiCurrency(shares * cost + comm, cur, txTrms));
  };

  useEffect(() => { recalcPreview(); /* eslint-disable-next-line */ }, [txTrms, open]);

  if (!open) return null;

  const isEditingLot = mode === 'editLot';
  const isAddingLot = mode === 'addLot';
  const isNewPosition = mode === 'newPosition';

  const handleSubmit = (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const shares = parseFloat(f.get('shares'));
    const costBasis = parseFloat(f.get('costBasis'));
    const commission = parseFloat(f.get('commission') || 0);
    const currency = isNewPosition ? f.get('currency') : holdingToEdit.currency;
    const totalNativo = shares * costBasis + commission;
    const txSnapshot = snapshotMultiCurrency(totalNativo, currency, txTrms);

    const newLot = {
      id: lotToEdit?.id || `lot_${Date.now()}`,
      shares, costBasis, commission,
      purchaseDate: f.get('purchaseDate'),
      txSnapshot, txTrms: { ...txTrms }
    };

    if (isNewPosition) {
      const newH = {
        id: `h_${Date.now()}`,
        type: f.get('type'),
        symbol: f.get('symbol').toUpperCase(),
        currency,
        currentPrice: parseFloat(f.get('currentPrice')),
        category: f.get('category') || 'Otros',
        notes: f.get('notes') || '',
        shares,
        costBasis, /* mantener para compatibilidad */
        commission,
        purchaseDate: newLot.purchaseDate,
        lots: [newLot],
        txSnapshot, txTrms: { ...txTrms }
      };
      onSave({ mode: 'newPosition', holding: newH });
    } else if (isAddingLot) {
      onSave({ mode: 'addLot', holdingId: holdingToEdit.id, lot: newLot, currentPrice: parseFloat(f.get('currentPrice')) });
    } else if (isEditingLot) {
      onSave({ mode: 'editLot', holdingId: holdingToEdit.id, lot: newLot });
    }
  };

  return (
    <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 animate-fade-in">
      <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
        <div className="p-4 border-b border-slate-800 flex justify-between items-center sticky top-0 bg-slate-900 z-10">
          <h3 className="font-bold text-indigo-400">
            {isNewPosition && 'Nueva Posición'}
            {isAddingLot && `Añadir compra a ${holdingToEdit.symbol}`}
            {isEditingLot && `Editar lote de ${holdingToEdit.symbol}`}
          </h3>
          <button onClick={onClose}><i className="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <form ref={formRef} onSubmit={handleSubmit} onChange={recalcPreview} className="p-4 space-y-3 text-sm">
          {isNewPosition && (
            <div>
              <label className="text-xs text-slate-400">Símbolo</label>
              <input name="symbol" required placeholder="AAPL, GOOGL, NVDA..." className="w-full bg-slate-950 border border-slate-700 rounded p-2 uppercase" />
              {/* Tipo siempre asset en v2.7+ */}
              <input type="hidden" name="type" value="asset" />
            </div>
          )}
          <div className="grid grid-cols-3 gap-3">
            <div><label className="text-xs text-slate-400">Cantidad</label><input name="shares" type="number" step="any" required defaultValue={lotToEdit?.shares} className="w-full bg-slate-950 border border-slate-700 rounded p-2" /></div>
            <div><label className="text-xs text-slate-400">Costo unit.</label><input name="costBasis" type="number" step="any" required defaultValue={lotToEdit?.costBasis} className="w-full bg-slate-950 border border-slate-700 rounded p-2" /></div>
            <div><label className="text-xs text-slate-400">Comisión</label><input name="commission" type="number" step="any" defaultValue={lotToEdit?.commission || 0} className="w-full bg-slate-950 border border-slate-700 rounded p-2" /></div>
          </div>
          <div className="grid grid-cols-3 gap-3">
            {isNewPosition && (
              <div>
                <label className="text-xs text-slate-400">Moneda</label>
                <select name="currency" defaultValue="USD" className="w-full bg-slate-950 border border-slate-700 rounded p-2"><option>USD</option><option>EUR</option><option>COP</option></select>
              </div>
            )}
            <div><label className="text-xs text-slate-400">Fecha</label><input name="purchaseDate" type="date" required defaultValue={lotToEdit?.purchaseDate || new Date().toISOString().split('T')[0]} className="w-full bg-slate-950 border border-slate-700 rounded p-2" /></div>
            {(isNewPosition || isAddingLot) && (
              <div><label className="text-xs text-slate-400">Precio actual</label><input name="currentPrice" type="number" step="any" required defaultValue={holdingToEdit?.currentPrice} className="w-full bg-slate-950 border border-slate-700 rounded p-2" /></div>
            )}
          </div>
          {isNewPosition && (
            <>
              <div>
                <label className="text-xs text-slate-400">Categoría</label>
                <select name="category" defaultValue="AI/Big Tech" className="w-full bg-slate-950 border border-slate-700 rounded p-2">
                  <optgroup label="── Tecnología ──">
                    <option>AI/Big Tech</option>
                    <option>FinTech</option>
                    <option>Semiconductores</option>
                  </optgroup>
                  <optgroup label="── Sectoriales ──">
                    <option>Financiero</option>
                    <option>Healthcare</option>
                    <option>Retail/Consumo</option>
                    <option>Energía</option>
                    <option>Industriales</option>
                    <option>Utilities</option>
                  </optgroup>
                  <optgroup label="── Vehículos ──">
                    <option>ETF</option>
                    <option>Bonos/Renta fija</option>
                  </optgroup>
                  <optgroup label="── Alternativos ──">

const SellModal = ({ open, onClose, onSave, holding, currentTrms }) => {
  const [txTrms, setTxTrms] = useState(currentTrms);
  const [preview, setPreview] = useState({ USD: 0, EUR: 0, COP: 0 });
  const [sharesInput, setSharesInput] = useState(0);
  const formRef = useRef(null);

  useEffect(() => {
    if (open) {
      setTxTrms(currentTrms);
      setSharesInput(holding?.shares || 0);
    }
  }, [open, currentTrms, holding]);

  const fifoPreview = useMemo(() => {
    if (!holding || !holding.lots) return null;
    const lots = [...holding.lots].sort((a, b) => a.purchaseDate.localeCompare(b.purchaseDate));
    let remaining = sharesInput;
    const consumed = [];
    let totalCost = 0;
    for (const lot of lots) {
      if (remaining <= 0) break;
      const take = Math.min(remaining, lot.shares);
      const lotCost = take * lot.costBasis + (lot.commission || 0) * (take / lot.shares);
      consumed.push({ lotId: lot.id, shares: take, costBasis: lot.costBasis, lotCost, purchaseDate: lot.purchaseDate });
      totalCost += lotCost;
      remaining -= take;
    }
    return { consumed, totalCost, fullySatisfied: remaining <= 0.0001 };
  }, [sharesInput, holding]);

  const recalcPreview = () => {
    const f = formRef.current; if (!f || !holding) return;
    const shares = parseFloat(f.shares.value) || 0;
    const price = parseFloat(f.sellPrice.value) || 0;
    const comm = parseFloat(f.commission.value) || 0;
    setSharesInput(shares);
    setPreview(snapshotMultiCurrency(shares * price - comm, holding.currency, txTrms));
  };

  useEffect(() => { recalcPreview(); /* eslint-disable-next-line */ }, [txTrms, open]);

  if (!open || !holding) return null;

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!fifoPreview?.fullySatisfied) return;
    const f = new FormData(e.target);
    const shares = parseFloat(f.get('shares'));
    const sellPrice = parseFloat(f.get('sellPrice'));
    const commission = parseFloat(f.get('commission') || 0);
    const totalNativo = shares * sellPrice - commission;
    const txSnapshot = snapshotMultiCurrency(totalNativo, holding.currency, txTrms);

    onSave({
      id: `s_${Date.now()}`,
      holdingId: holding.id,
      symbol: holding.symbol,
      currency: holding.currency,
      shares, sellPrice, commission,
      date: f.get('date'),
      notes: f.get('notes') || '',
      txSnapshot, txTrms: { ...txTrms },
      fifoConsumed: fifoPreview.consumed,
      avgCostBasis: fifoPreview.totalCost / shares,
      realizedPL_native: totalNativo - fifoPreview.totalCost
    });
  };

  return (
    <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 animate-fade-in">
      <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-xl max-h-[90vh] overflow-y-auto">
        <div className="p-4 border-b border-slate-800 flex justify-between items-center sticky top-0 bg-slate-900 z-10">
          <h3 className="font-bold text-red-400"><i className="fa-solid fa-arrow-trend-down mr-1"></i>Vender {holding.symbol} <span className="text-xs text-slate-400 font-normal">(FIFO)</span></h3>
          <button onClick={onClose}><i className="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <form ref={formRef} onSubmit={handleSubmit} onChange={recalcPreview} className="p-4 space-y-3 text-sm">
          <div className="bg-slate-800/50 rounded p-2 text-xs">
            Posee: <span className="font-bold text-white">{fmt(holding.shares, 4)} {holding.symbol}</span> · {holding.lots?.length || 1} lote(s)
          </div>
          <div className="grid grid-cols-3 gap-3">
            <div><label className="text-xs text-slate-400">Cantidad</label><input name="shares" type="number" step="any" max={holding.shares} required defaultValue={holding.shares} className="w-full bg-slate-950 border border-slate-700 rounded p-2" /></div>
            <div><label className="text-xs text-slate-400">Precio venta</label><input name="sellPrice" type="number" step="any" required defaultValue={holding.currentPrice} className="w-full bg-slate-950 border border-slate-700 rounded p-2" /></div>
            <div><label className="text-xs text-slate-400">Comisión</label><input name="commission" type="number" step="any" defaultValue={0} className="w-full bg-slate-950 border border-slate-700 rounded p-2" /></div>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div><label className="text-xs text-slate-400">Fecha</label><input name="date" type="date" required defaultValue={new Date().toISOString().split('T')[0]} className="w-full bg-slate-950 border border-slate-700 rounded p-2" /></div>

          {/* FIFO preview */}
          {fifoPreview && fifoPreview.consumed.length > 0 && (

              <div className="text-xs font-bold text-cyan-300 uppercase tracking-wider mb-2"><i className="fa-solid fa-layer-group mr-1"></i>Lotes FIFO consumidos</div>
              <div className="space-y-1 text-xs">
                {fifoPreview.consumed.map((c, i) => (

            </div>
          </div>

          <div className="bg-gradient-to-r from-red-950/40 to-orange-950/40 border border-red-700/50 rounded-lg p-3">
            <div className="text-xs font-bold text-red-300 uppercase tracking-wider mb-2">Ingreso neto</div>

              <div className="bg-slate-950/60 rounded p-2"><div className="text-xs text-slate-400">USD</div><div className="font-bold text-green-400">${fmt(preview.USD)}</div></div>
              <div className="bg-slate-950/60 rounded p-2"><div className="text-xs text-slate-400">EUR</div><div className="font-bold text-blue-400">€{fmt(preview.EUR)}</div></div>
